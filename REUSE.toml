version = 1
SPDX-PackageName = "hammunition"
SPDX-PackageSupplier = "Renegade Penguin LLC"
SPDX-PackageDownloadLocation = "https://github.com/ChiefGyk3D/Hammunition"

# The copyright holder is Renegade Penguin LLC, a legal person -- a handle cannot
# enforce a licence. That is separate from attribution, which uses handles
# everywhere it appears, and it is NOT a claim on contributors' work: there is no
# CLA and no assignment, and contributors keep copyright on what they write. See
# CONTRIBUTING.md, which says so in the place people will actually look.
#
# The notice lives here and in every file's SPDX header rather than inside
# LICENSE. LICENSE is the verbatim GPL-3.0 text from Debian base-files and its
# checksum is asserted in tests/test_licensing.py; a project copyright line
# inserted into it would corrupt the licence itself. The GPL's own template at
# its line 635 is part of that text, not a field to fill in. Same for
# catalog/LICENSE: CC0 is a waiver of rights, so a copyright notice inside it
# would contradict the instrument it is printed on.

# Two licences, split on the architectural boundary CLAUDE.md draws between the
# catalog and the engine. See D-023 in docs/DECISIONS.md for the reasoning; the
# short version is that copyleft on the engine serves the governance objection
# this project was founded on, and copyleft on the catalog would defeat the
# requirement that the catalog stay usable by an engine that is not ours.
#
# Files carrying their own SPDX header are annotated there and not here. These
# entries cover formats where a comment is impossible or unwelcome -- generated
# documentation, data, licence texts themselves.

[[annotations]]
path = "catalog/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2026 Renegade Penguin LLC"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2026 Renegade Penguin LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["README.md", "CLAUDE.md", "Makefile", "pyproject.toml", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2026 Renegade Penguin LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [".github/**", "containers/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2026 Renegade Penguin LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Verbatim licence texts, copied from Debian base-files
# (/usr/share/common-licenses) rather than transcribed. sha256:
#   GPL-3    8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903
#   CC0-1.0  a2010f343487d3f7618affe54f789f5487602331c0a8d03f49e9a7c547cf0499
[[annotations]]
path = ["LICENSE", "catalog/LICENSE", "LICENSES/**"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
