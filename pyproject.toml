[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hammunition"
version = "0.6.0"
description = "Turn a Debian-family install into an amateur radio, SDR and RF workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

# The console script. `hammunition` is the binary name (CLAUDE.md).
[project.scripts]
hammunition = "hammunition.cli.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561. `[tool.mypy] files` analyses src, tests and scripts together, so this
# is not what keeps the repo's own checking honest. It is for everyone else: an
# installed copy without the marker is unfollowable, and a downstream consumer
# type-checking against our manifest classes silently gets `Any` for all of them.
# The catalog is meant to be usable by an engine that is not ours; that is worth
# one empty file.
[tool.setuptools.package-data]
hammunition = ["py.typed"]

# ---------------------------------------------------------------------------
# mypy --strict is a hard gate, not an aspiration (CLAUDE.md Conventions).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401",  # Any is occasionally correct at boundaries
    "E501",    # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]  # fixtures are inferred

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
