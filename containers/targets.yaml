# Supported targets. One container per entry in CI.
#
# RUNTIME: rootless Podman, not Docker.
#
# Docker group membership grants root-equivalent access to the host — any
# container can bind-mount / as root. This project's own security requirements
# say it runs alongside offensive tooling on a field laptop, so requiring
# root-equivalent access to run our CI would be indefensible. Podman is rootless
# by default and CLI-compatible; `podman-docker` provides the socket shim if
# something expects `docker`.
#
# `os_release_id` / `os_release_version` are what /etc/os-release reports, which
# is what the engine keys on (DESIGN.md §8 — no heuristics). `image` is verified
# to exist on Docker Hub; see scripts/verify-images.sh.
targets:
  - name: debian-13
    image: debian:13
    os_release_id: debian
    os_release_version: "13"
    arch: x86_64
    priority: 2

  - name: ubuntu-26.04
    image: ubuntu:26.04
    os_release_id: ubuntu
    os_release_version: "26.04"
    arch: x86_64
    priority: 3

  # `rolling: true` means the image tag follows the distribution's moving
  # stream, so VERSION_ID changes under us by design. The drift check then
  # matches on os_release_id alone and prints the version it found;
  # `os_release_version` records the last MEASURED value (read from the
  # image's own /etc/os-release, 2026-08-28), as a record rather than a
  # match requirement. Without this flag, kali's quarterly version bump
  # would redden every unrelated pull request -- the calendar-driven
  # failure the commit-pin job's comment warns teaches people to ignore CI.
  - name: kali-rolling
    image: kalilinux/kali-rolling:latest
    os_release_id: kali
    os_release_version: "2026.3"
    rolling: true
    arch: x86_64
    priority: 4

  - name: parrot
    image: parrotsec/core:latest
    os_release_id: parrot
    os_release_version: "7.3"
    rolling: true        # the *tag* rolls: 7.3 becomes 7.4 in place
    arch: x86_64
    priority: 1          # primary target, CLAUDE.md

  # NO LINUX MINT TARGET, and the absence is a finding, not an oversight.
  # A linuxmint-22.3 target (image linuxmintd/mint22.3-amd64) sat here from
  # Q-004 until 2026-08-28, added so js8call's Mint-specific selector would
  # be exercised. The first time anything read that image's own identity --
  # the --check drift guard -- it turned out /etc/os-release in the image is
  # Ubuntu 24.04's, verbatim: ID=ubuntu, VERSION_ID="24.04". The one selector
  # the target existed to exercise could never match inside it, so every
  # green run was false coverage. Mint publishes no container image that
  # carries Mint's os-release; forging one in the Dockerfile would be the
  # shim CLAUDE.md forbids. Same disposition as Raspberry Pi OS below: the
  # support claim stays, the capability matrix reports Mint as untested in
  # containers, and js8call's selector is exercised by unit tests against a
  # captured Mint os-release. Q-014 asks the maintainer how real Mint
  # coverage should be provided.

  # NOT Raspberry Pi OS. See `claims` below — this exercises aarch64 selectors
  # and nothing more.
  - name: debian-13-arm64
    image: debian:13
    platform: linux/arm64
    os_release_id: debian
    os_release_version: "13"
    arch: aarch64
    priority: 5
    claims: aarch64-only
    note: >-
      Renamed from raspios-arm64, which was a lie by filename. Raspberry Pi OS
      publishes no official container image, and an arm64 Debian container is
      not Pi OS: different kernel, different firmware, different default
      packages, no Pi hardware paths. D-018 forbids claiming what we have not
      tested, so this target claims aarch64 selector coverage ONLY. Raspberry
      Pi support stays `untested` in the capability matrix until it is verified
      on real hardware — a ClockworkPi uConsole is available for that (Q-003).
