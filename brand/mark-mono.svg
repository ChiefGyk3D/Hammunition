  The Hammunition mark: the compass rose from the logo's own base, set in the
  sunset disc. Not a shrunk logo: at 16 to 32 px the full illustration (a
  penguin, a rig, a mast, a stack of manuals) is mud, so the mark is the one
  element of it that survives being small. Variants reuse these paths; do not
  redraw one by hand.
-->
