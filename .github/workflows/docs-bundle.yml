# Builds the offline documentation bundle (docs/offline/index.md) and attaches
# it to the run. scripts/build_offline_bundle.py builds it with --strict and
# then verifies it: no reference may leave the folder, every link and asset
# must resolve, the search index must be present. It is a repository-specific
# job, so it stays local rather than calling a GYST workflow.
#
# Publication as a release asset is not set up: the artifact is what there is.

name: Docs bundle

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs-offline.yml"
      - "offline-theme/**"
      - "scripts/build_offline_bundle.py"
      - "catalog/packages/**"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: offline bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements/docs.txt && pip install --no-deps -e .
      - run: python scripts/build_offline_bundle.py --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hammunition-docs
          path: dist/hammunition-docs-*.zip
          if-no-files-found: error
