name: CI

on:
  schedule:
    # Weekly. D-024's cadence is measured in months; this only has to be
    # frequent enough that an overdue pin is noticed within a week of going so.
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CLAUDE.md: Python 3.11+. The dev machine may be older; CI is the authority.
  PYTHON_MIN: "3.11"

jobs:
  # -------------------------------------------------------------------------
  # Types. mypy --strict is a gate, not advisory (CLAUDE.md Conventions).
  # -------------------------------------------------------------------------
  types:
    name: mypy --strict (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: mypy --strict
        run: mypy --strict

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  # -------------------------------------------------------------------------
  # D-031. A commit message that describes a change the commit does not contain
  # is how the D-028 amendment shipped as a no-op. The hook is opt-in locally
  # (git will not run hooks from a clone, by design); this is the enforcement.
  # -------------------------------------------------------------------------
  commit-claims:
    name: commit claims
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every commit in the pull request
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          fail=0
          for rev in $(git rev-list "$base..$head"); do
            echo "--- $(git log -1 --format='%h %s' "$rev")"
            python3 scripts/check_commit_claims.py --rev "$rev" || fail=1
          done
          exit $fail

  # -------------------------------------------------------------------------
  # Schema and catalog validation across supported interpreters.
  # -------------------------------------------------------------------------
  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  # -------------------------------------------------------------------------
  # One container per target distro. Capability-matrix claims must be backed
  # by a passing container run (CLAUDE.md), never asserted from a dev machine.
  # -------------------------------------------------------------------------
  targets:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: parrot,        image: "parrotsec/core:latest",        platform: linux/amd64 }
          - { name: debian-13,     image: "debian:13",                    platform: linux/amd64 }
          - { name: ubuntu-26.04,  image: "ubuntu:26.04",                 platform: linux/amd64 }
          - { name: kali-rolling,  image: "kalilinux/kali-rolling:latest", platform: linux/amd64 }
<<<<<<< HEAD
=======
          # Mint's image ships Ubuntu's base-files; identity_package installs
          # Mint's own from its own repo so os-release reads linuxmint (Q-014).
          - { name: linuxmint-22.3, image: "linuxmintd/mint22.3-amd64:latest", platform: linux/amd64, identity_package: "base-files/zena" }
>>>>>>> origin/main
          # NOT Raspberry Pi OS — exercises aarch64 selectors only (Q-003).
          - { name: debian-13-arm64, image: "debian:13",                    platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v4

      # Rootless Podman, not Docker. Docker group membership is
      # root-equivalent host access; a security-adjacent project should not
      # require it to run its own CI. See containers/targets.yaml.
      - name: Set up QEMU (arm64 targets only)
        if: matrix.target.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build target container
        run: |
          podman build --platform=${{ matrix.target.platform }} \
            -f containers/Dockerfile.target \
            --build-arg BASE=${{ matrix.target.image }} \
            --build-arg IDENTITY_PACKAGE="${{ matrix.target.identity_package }}" \
            -t hammunition-${{ matrix.target.name }}:ci .

      - name: Validate catalog against this target
        run: |
          podman run --rm hammunition-${{ matrix.target.name }}:ci \
            python scripts/capability_matrix.py --check

      - name: Run the test suite inside the target
        run: |
          podman run --rm hammunition-${{ matrix.target.name }}:ci \
            python -m pytest

      - name: mypy --strict on the target's own Python
        run: |
          podman run --rm hammunition-${{ matrix.target.name }}:ci mypy --strict

  # -------------------------------------------------------------------------
  # Documentation is a deliverable; broken internal links fail the build.
  # -------------------------------------------------------------------------
  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_doc_links.py

  # -------------------------------------------------------------------------
  # Provenance: third-party reference material must never reach the repo.
  # -------------------------------------------------------------------------
  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Runs before the tests so its report is the first thing in the log: it
      # names the offending rule and line, which a pytest assertion cannot.
      - run: python scripts/audit_gitignore.py
      - run: pytest tests/test_repo_hygiene.py tests/test_gitignore_audit.py

  # -------------------------------------------------------------------------
  # Commit pins go stale on a calendar, not on a commit.  D-024.
  #
  # Whether a pin is well-formed is a property of the code and is asserted in
  # tests, which run on every push. Whether it is STALE is a property of the
  # date, and failing an unrelated pull request because a review date rolled
  # over would teach people to ignore the job -- which is the one outcome that
  # makes the whole mechanism worthless. So this runs on a schedule.
  # -------------------------------------------------------------------------
  pin-reviews:
    name: commit pin reviews
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python scripts/check_pin_reviews.py

  # -------------------------------------------------------------------------
  # D-031. Every identifier citing a distribution's udev rule is checked
  # against that rule. This needs the archive-wide sweep -- 280 packages and
  # ~264 MB of downloads -- so it cannot run on every push, and the sweep
  # output is gitignored measurement that a fresh clone does not have. Weekly,
  # which is often enough to catch a citation that a Debian upload invalidated
  # and cheap enough that nobody learns to ignore it.
  # -------------------------------------------------------------------------
  rule-citations:
    name: udev rule citations
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Sweep every udev rule in the archive
        run: |
          mkdir -p reference/probes
          podman run --rm -v "$PWD/scripts/udev-sweep.sh":/sweep.sh:ro debian:13 \
            bash /sweep.sh > reference/probes/udev-debian-13.tsv
          wc -l reference/probes/udev-debian-13.tsv
      - run: python scripts/check_rule_citations.py
