name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CLAUDE.md: Python 3.11+. The dev machine may be older; CI is the authority.
  PYTHON_MIN: "3.11"

jobs:
  # -------------------------------------------------------------------------
  # Types. mypy --strict is a gate, not advisory (CLAUDE.md Conventions).
  # -------------------------------------------------------------------------
  types:
    name: mypy --strict (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: mypy --strict
        run: mypy --strict

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  # -------------------------------------------------------------------------
  # Schema and catalog validation across supported interpreters.
  # -------------------------------------------------------------------------
  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  # -------------------------------------------------------------------------
  # One container per target distro. Capability-matrix claims must be backed
  # by a passing container run (CLAUDE.md), never asserted from a dev machine.
  # -------------------------------------------------------------------------
  targets:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: parrot,        image: "parrotsec/core:latest",        platform: linux/amd64 }
          - { name: debian-13,     image: "debian:13",                    platform: linux/amd64 }
          - { name: ubuntu-26.04,  image: "ubuntu:26.04",                 platform: linux/amd64 }
          - { name: kali-rolling,  image: "kalilinux/kali-rolling:latest", platform: linux/amd64 }
          - { name: raspios-arm64, image: "debian:13",                    platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 targets only)
        if: matrix.target.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build target container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.target
          build-args: BASE=${{ matrix.target.image }}
          platforms: ${{ matrix.target.platform }}
          tags: hammunition-${{ matrix.target.name }}:ci
          load: true

      - name: Validate catalog against this target
        run: |
          docker run --rm --platform=${{ matrix.target.platform }} \
            hammunition-${{ matrix.target.name }}:ci \
            python scripts/capability_matrix.py --check

      - name: Run the test suite inside the target
        run: |
          docker run --rm --platform=${{ matrix.target.platform }} \
            hammunition-${{ matrix.target.name }}:ci \
            python -m pytest

  # -------------------------------------------------------------------------
  # Documentation is a deliverable; broken internal links fail the build.
  # -------------------------------------------------------------------------
  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_doc_links.py

  # -------------------------------------------------------------------------
  # Provenance: third-party reference material must never reach the repo.
  # -------------------------------------------------------------------------
  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_repo_hygiene.py
