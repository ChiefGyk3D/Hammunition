# The Kiwix books the catalog offers (D-065). HAND-WRITTEN: this is the
# curation step, and the licence lines cannot be generated -- of nine ZIMs
# read on 2026-09-29 one carried a License metadata entry, so each line here
# is the publisher's own, from the page `licence_url` names.
#
# `id` is Kiwix's file stem without its date: <name>_<flavour>, or the bare
# name for a book published in one flavour. The operator chooses ids with
# `hammunition station set --reference-books`; `hammunition reference books`
# lists them. A book not listed here is refused by name, because a book with
# no known licence has nothing to print before the confirmation (D-049).
#
# After adding or removing a book, regenerate the pins:
#   scripts/gen_kiwix_pins.py
#
# Not carried, each for its stated reason in D-065 and
# docs/guides/offline-reference.md: wikiHow (no current ZIM; CC BY-NC-SA),
# the zimgit-* prepper collections (no licence stated anywhere), energypedia
# (licence not verified), Gutenberg whole (221 GB), video-channel ZIMs and
# MedlinePlus (mixed licences), nhs.uk (Crown copyright, not verified).

