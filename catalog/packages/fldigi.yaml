name: fldigi
version: "4.2.13"
summary: Multi-mode digital modem for PSK31, RTTY, Olivia, MT63 and more
categories: [digital-modes, nbems]

# SHAPE 2 — one build emits two user-facing programs, and the source build must
# displace the repository package first.
provides: [flarq]

conflicts_with_repo_package: [fldigi]

install:
  - install:
      method: source
      source:
        # Fetch-verified 2026-08-30 -- the 4.2.11 URL this manifest carried was
        # constructed from AHRL's bundled copy, never fetched, and 404s: the
        # classic unverified-claim shape. downloads.sourceforge.net is the
        # direct-fetch host; the tarball hash below is from the actual download.
        url: https://downloads.sourceforge.net/project/fldigi/fldigi/fldigi-4.2.13.tar.gz
        sha256: a1e8d990359ce9c0cce3ceb5116fd0cf72c95528969766898640ca6ca2dba8d4
      build_system: autotools
    build_depends:
      - libfltk1.3-dev
      # 4.2.13's configure demands libpng directly (failed without it on the
      # first fetch-verified build, Parrot VM 2026-08-30).
      - libpng-dev
      # portaudio19-dev, not the runtime libportaudio2/libportaudiocpp0 —
      # a build needs the headers, and Debian's own fldigi Build-Depends
      # says portaudio19-dev (apt-cache showsrc, Debian 13, 2026-08-28).
      - portaudio19-dev
      - libsamplerate0-dev
      - libsndfile1-dev
      - libudev-dev
    note: >-
      AHRL also installs libportaudio-ocaml-dev here. That is an OCaml binding
      fldigi does not use; it is a copy-paste error that never surfaced because
      AHRL checks no exit status. Deliberately omitted — see D-016.

binaries:
  - produced: src/fldigi
    install_as: fldigi
  - produced: src/flarq
    install_as: flarq

# libhamlib4 has no candidate on any target since the 64-bit time_t
# transition renamed it; libhamlib4t64 is the package on Debian 13, Kali,
# Parrot and Ubuntu 26.04 alike (apt-cache policy on all four, 2026-08-28).
# The old name would have blocked resolution with 'apt has no candidate' —
# the exact stale-dependency failure D-016's blocker text cites.
depends: [libhamlib4t64]

toolkit_risk:
  - framework: wx3.2
    upstream_port_status: unknown
    checked: 2026-08-25
    note: >-
      Not fldigi itself, but AHRL resolves libwxgtk*-dev by apt-cache grep for
      several units; fldigi uses FLTK and is unaffected. Recorded to keep the
      register honest about what was checked.

update:
  probe:
    method: binary_version
    command: fldigi --version
    pattern: 'fldigi version ([0-9.]+)'
  strategy: rebuild

documentation:
  what_it_does: >-
    Turns a sound card and a transceiver into a modem for around twenty digital
    modes, including PSK31, RTTY, Olivia, Contestia and MT63, with a waterfall
    display for tuning them.
  why_you_want_it: >-
    It is the reference implementation for HF digital modes on Linux and the
    foundation of the NBEMS emergency-messaging stack alongside flmsg and flamp.
  prerequisites: >-
    Sound-card audio routed to and from the radio, and PTT via hamlib, flrig,
    CAT, or a serial line.
  known_problems: >-
    The repository package is purged before installing, because the source build
    installs to the same prefix. The build also produces flarq, which is why
    this manifest declares it under provides — without that, a parity check
    reports flarq as a false gap.
  upstream_url: https://sourceforge.net/projects/fldigi/
  upstream_support: linuxham groups.io list
