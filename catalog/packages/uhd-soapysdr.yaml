name: uhd-soapysdr
version: "0.4.1"
summary: Makes SoapySDR devices visible to software written for UHD
categories: [sdr, hardware]

install:
  - install:
      method: apt
      packages: [uhd-soapysdr]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    A libuhd plugin that presents SoapySDR devices as if they were USRPs. A
    program written against UHD -- Ettus's own API -- then opens an RTL-SDR,
    a HackRF or an Airspy without knowing anything about SoapySDR.
  why_you_want_it: >-
    It runs the bridge in the direction people usually do not think about.
    `soapysdr-module-uhd`, which this catalog carries separately, makes a USRP
    visible to SoapySDR software; this one makes cheap hardware visible to UHD
    software. Both come from the same upstream project and the names are close
    enough that installing the wrong one is easy -- decide by which API the
    program you want to run was written against.
  prerequisites: >-
    libuhd, and a SoapySDR module for whatever hardware you actually have. It
    is a translation layer and has no devices of its own.
  known_problems: >-
    Not every UHD feature has a SoapySDR equivalent. Timed commands, precise
    multi-channel alignment and GPSDO discipline are USRP capabilities that a
    dongle does not have, and a UHD program that depends on them will fail
    against a translated device rather than degrade. The two similarly named
    packages are the commonest confusion here; see above.
  upstream_url: https://github.com/pothosware/SoapyUHD/wiki
  upstream_support: The Pothosware project. GitHub issues and the wiki.
