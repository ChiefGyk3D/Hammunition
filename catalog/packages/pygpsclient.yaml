    note: >-
      Resolved on 2026-09-30 with `uv pip compile --universal
      --generate-hashes --python-version 3.11` from `pygpsclient==1.7.7`.
      Measured the same day in containers, pip --require-hashes into a
      fresh venv with python3-tk from the archive: the whole set installed,
      `import pygpsclient, pygpsclient.app` succeeded and `pygpsclient -h`
      printed its usage on Debian 13 (Python 3.13.5), Ubuntu 24.04 (3.12.3)
      and Kali (3.14.7). Then through this engine in a debian:13 container
      (`hammunition install pygpsclient`, exit 0: python3-tk and
      python3-venv from apt, the venv, the wrapper and the desktop entry),
      and the wrapper run under xvfb-run was still running at a 20 s
      timeout with an empty stderr. Nothing was tried against a receiver.
      Regenerate the pins with the same command when bumping the version.

# tkinter is the distribution's (python3-tk), and a venv needs python3-venv;
# both have a candidate on all seven targets (apt-cache policy, 2026-09-29).
depends: [python3-tk, python3-venv]

launchers:
  - name: pygpsclient
    exec: exec {venv}/bin/pygpsclient
    title: GNSS receiver console and u-blox setup (PyGPSClient)

update:
  probe:
    method: pypi
  strategy: reinstall
  cadence_hint: >-
    Releases every week or two in 2026 (1.7.4 on 09-03, 1.7.5 on 09-07,
    1.7.6 on 09-17, 1.7.7 on 09-30). A bump regenerates the whole pinned
    set; see the install note.

documentation:
  what_it_does: >-
    A graphical console for a GPS or GNSS receiver: position, satellites in
    view and their signal levels, a sky plot, a map, and the raw sentences
    the receiver sends. For u-blox receivers it also sets what the receiver
    outputs and how often (the protocols, the message rates, the navigation
    settings) and can save that to the receiver, and it can take RTK
    corrections from an NTRIP caster.
  why_you_want_it: >-
    u-blox's own u-center, the usual tool for configuring their receivers,
    is Windows-only. PyGPSClient does that job on Linux, which matters for a
    station clock: a receiver sending the sentences gpsd needs at one fix a
    second, and nothing it does not, is what `chrony` or D-058's GPS time
    read. It is also the quickest way to answer "does this receiver have a
    fix at all" when the clock is not following it.
  prerequisites: >-
    A receiver on a serial or USB port, and membership of the `dialout`
    group to open it (log out and back in after being added). It runs from
    the desktop menu or as `pygpsclient` from a new shell.
  known_problems: >-
    **A serial port has one owner.** While gpsd holds the receiver,
    PyGPSClient cannot open the same port; stop gpsd first (`sudo systemctl
    stop gpsd.socket gpsd`) and start it again afterwards, or GPS time and
    every gpsd client lose the receiver while you work. Configuration saved
    to a u-blox receiver persists: note what you changed. A Tk application,
    so it looks plainer than a Qt one; that is expected.
  upstream_url: https://github.com/semuconsulting/PyGPSClient
  upstream_support: >-
    GitHub issues and discussions on semuconsulting/PyGPSClient (Steve
    Smith, semuadmin); the project also keeps a user guide in its README.
