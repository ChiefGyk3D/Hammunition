name: dablin
version: "1.16.0"
summary: Lightweight DAB receiver for the command line or a small window
categories: [listening, sdr]

install:
  - install:
      method: apt
      packages: [dablin]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Plays DAB and DAB+ from an ensemble, either as a command-line tool taking a
    transport stream on standard input or as a small GTK window with a service
    list. It does the decoding and leaves the tuning to something else --
    typically `eti-cmdline` or a file captured earlier.
  why_you_want_it: >-
    It is the Unix answer to DAB: a decoder in a pipe, which is what you want
    for a headless receiver, an automated recording, or a stream fed to
    something else. welle.io is the program to look at; this is the one to
    script.
  prerequisites: >-
    An ETI stream from somewhere -- a tuner tool, or a recorded file. That
    separation is the design and it is the thing that confuses first-time
    users, who expect it to open a dongle itself.
  known_problems: >-
    It does not tune. Running it with no input produces nothing and no
    explanation, and the missing piece is the ETI source rather than anything
    in this package. Regional DAB coverage applies as with welle.io.
  upstream_url: https://github.com/Opendigitalradio/dablin
  upstream_support: >-
    The Open Digital Radio project, which also produces the ODR transmit
    toolchain. Debian declares opendigitalradio.org as the Homepage; that host
    has a DNS record and answered nothing on either http or https when checked
    on 2026-08-28, so the repository is cited instead. It is live -- head of
    the default branch is 96ae480f7ff6, 2025-10-01, read from the branch rather
    than from GitHub's `updated_at` (D-032).
