name: skid-finder
version: "0.4.0-alpha.1"
summary: Passive BLE-spam and Wi-Fi-attack detector with foxhunting, live alerts and a sensor-net collector
categories: [bluetooth, wifi, capture-analysis]

# Defensive, receive-only, and in rf-security ungated for the same reason
# rayhunter is: it detects scripted BLE spam (Flipper/Marauder-style
# floods), deauth and beacon floods, evil twins and KARMA responders, and
# transmits nothing. The maintainer's own project, optimised for the
# ClockworkPi uConsole + Hacker Gadgets AIO v2 and run on any BlueZ host.
#
# A run-in-place tree: shell and Python scripts that read config/ and write
# logs/ beside themselves, exactly the js8spotter/yaac shape. The launcher
# is the project's own field menu, which only builds command lines and
# prefixes the radio actions with sudo, so the tree must be operator-owned
# (D-043) for config/ and logs/ to be writable.
#
# Pinned to a tagged pre-release archive; the tag is the upstream version.
# The digest was measured from the GitHub tag tarball on the day named in
# the note. Pre-1.0 alphas are expected to be re-pinned often.
install:
  - install:
      method: binary
      artifact:
        url: https://github.com/ChiefGyk3D/Skid-Finder/archive/refs/tags/v0.4.0-alpha.1.tar.gz
        # Fetched twice from GitHub on 2026-09-18 and hashed identically;
        # the tarball has one top directory (Skid-Finder-0.4.0-alpha.1/)
        # holding VERSION, scripts/, config/, tests/, docs/, nodes/.
        sha256: 2cb40de139fcc5d23ac01aa02c007ebc4a6aefbddb0d59e86ef04d4dc3558bac
      format: tarball
      install_tree: true
      # GitHub's tag tarballs have one top directory, which extraction
      # strips, leaving scripts/ at the root of the installed tree.
      tree_marker: scripts/skid-finder.sh
    note: >-
      Upstream is at 0.4.0-alpha.1 (2026-09-18): the laptop paths (capture and
      live alerting without root via the wireshark group) were exercised on
      real hardware; the uConsole checklist is still open. Alpha means green in its
      own CI against synthetic captures and stubbed radios and not yet
      validated on the uConsole hardware; its docs/ROADMAP.md defines the
      stages. Re-pin URL and digest together at every tag. This unit has
      not yet been installed through the engine on any target container or
      VM; the first dry run and install are the open item on its PR.

# What the scripts call: bluez (btmon, bluetoothctl, btmgmt, hciconfig),
# python3, rfkill, tmux for the dual-pane session, whiptail for the menu,
# iw and tshark for the Wi-Fi side, paho for the sensor-net transport.
# All in Debian 13 and Parrot's baseline set except python3-paho-mqtt,
# which is in the archive on every target (apt-cache policy, 2026-09-18,
# host lists) and is optional at runtime: the scripts say so if absent.
depends: [bluez, python3, rfkill, tmux, whiptail, iw, tshark, python3-paho-mqtt]

launchers:
  - name: skid-finder
    exec: ./scripts/skid-finder.sh
    title: BLE spam and Wi-Fi attack detector, field menu (skid-finder)
    working_directory: /usr/local/share/hammunition/skid-finder
    terminal: true

update:
  probe:
    method: github_release
    repo: ChiefGyk3D/Skid-Finder
  strategy: reinstall
  cadence_hint: >-
    Tagged pre-releases per milestone (docs/ROADMAP.md upstream); each is a
    new tarball digest. Re-pin from the tag, never from a branch.

documentation:
  what_it_does: >-
    Listens passively for the scripted radio attacks that turn up at
    conferences and in enterprises and tells you where they come from. On
    Bluetooth it detects Flipper- and Marauder-style advertising floods,
    Fast Pair lure floods and address-churn spam, fingerprints devices with
    an honest identity tier (a rotating address identifies a product, not a
    unit), and foxhunts a source by median RSSI. On Wi-Fi it detects
    deauthentication and disassociation floods, beacon floods, evil twins
    and KARMA-style responders from a monitor-mode capture. Every capture
    leaves JSON Lines records a SIEM ingests, several sensors can feed one
    collector that estimates a source's location with its error stated, and
    a whiptail menu runs the common paths from a small screen.
  why_you_want_it: >-
    A venue or security team wants a timeline and a rough location, not a
    hunch, when phones start throwing pairing pop-ups or clients start
    dropping off the Wi-Fi. Kismet and Wireshark show you the frames; this
    judges them against measured thresholds and says which family of tool
    is likely running, while refusing to claim more than the data supports.
    It is the maintainer's own field tool for the uConsole + AIO v2 and it
    runs unchanged on a laptop with a BlueZ adapter and a monitor-capable
    Wi-Fi card.
  prerequisites: >-
    A BlueZ-visible Bluetooth adapter for the BLE side; a monitor-mode
    capable Wi-Fi adapter (the MT7921 in the AC1200 is one) for the Wi-Fi
    side. Root for anything that touches a radio; the menu adds sudo to
    exactly those actions. Copy config/interfaces.conf.example to
    config/interfaces.conf in the installed tree (the menu offers to on
    first run) and set the adapter names, SENSOR_ID and, for a fixed
    sensor, its position. An MQTT broker only if you run more than one
    sensor.
  known_problems: >-
    Alpha: the detector thresholds were measured on a hacker-conference
    floor and against synthetic traffic, not yet against a quiet baseline
    on the uConsole; a match is a lead, not a verdict, until you record
    your own baseline as its docs describe. The tree writes config/ and
    logs/ beside itself, so it must be owned by the operator, which the
    install's chown step does; running the scripts with sudo leaves
    root-owned files under logs/ that the analysis tools then cannot
    update. The menu's whiptail screens have not been sized on the
    uConsole's 1280x480 display.
  upstream_url: https://github.com/ChiefGyk3D/Skid-Finder
  upstream_support: GitHub issues on the project; the README lists what to attach.
