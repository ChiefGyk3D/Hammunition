name: cubicsdr
version: "0.2.7"
summary: Cross-platform SDR receiver with several demodulators running at once
categories: [sdr, listening]

install:
  - install:
      method: apt
      packages: [cubicsdr]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    A general-purpose SDR receiver over SoapySDR: waterfall and spectrum, AM,
    FM, SSB and digital-adjacent demodulators, recording to file, and -- its
    distinguishing feature -- several independent demodulators running
    simultaneously inside one captured bandwidth, each with its own audio
    output.
  why_you_want_it: >-
    Monitoring more than one frequency at a time is the thing a conventional
    receiver cannot do and an SDR trivially can, and most SDR software still
    only demodulates one channel. Watching four repeater outputs, or a net
    frequency and its alternate, is a single window here.
  prerequisites: >-
    An SDR reachable through SoapySDR, which means the matching per-device
    module installed. Enough CPU for the capture bandwidth times the number of
    demodulators.
  known_problems: >-
    It is wxWidgets-based and scales poorly on HiDPI displays. Development
    upstream has been quiet for some years, and DragonOS's own inventory
    carries it as a Tier 1 unit rather than a growing one. Each extra
    demodulator costs CPU; on a modest machine the audio breaks up rather than
    the display slowing, which reads as a driver problem.
  upstream_url: https://cubicsdr.com/
  upstream_support: Charles J. Cliffe, K6CJC. GitHub issues linked from the site.
