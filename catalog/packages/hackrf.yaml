name: hackrf
version: "2024.02.1"
summary: Host tools for HackRF — transfer, sweep, spectrum and firmware utilities
categories: [sdr, hardware, rf-security]

install:
  - install:
      method: apt
      packages: [hackrf]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    The host-side utilities for HackRF hardware: hackrf_info, hackrf_transfer
    for raw IQ in and out, hackrf_sweep for wideband spectrum, and the
    firmware and CPLD flashing tools.
  why_you_want_it: >-
    hackrf_info is the diagnostic that tells you whether the board is seen,
    what firmware it runs, and whether permissions are right. hackrf_sweep is
    the fastest way to see a very wide slice of spectrum at once, which no GUI
    does as directly.
  prerequisites: >-
    HackRF hardware, the udev rules and plugdev membership from the hardware
    catalog.
  known_problems: >-
    Host tools and device firmware are version-locked; hackrf_info reports a
    mismatch and it is worth reading. Debian 13 and Parrot ship 2024.02.1
    while Kali ships 2026.01.3 (apt-cache policy, 2026-08-28), so the
    firmware you flash should match the
    tools your distribution gave you. This is a transmit-capable radio:
    transmitting into an unterminated port risks the hardware.
  upstream_url: https://github.com/greatscottgadgets/hackrf
