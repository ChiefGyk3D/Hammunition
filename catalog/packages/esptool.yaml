name: esptool
version: "4.7.0"
summary: Flash and inspect ESP8266 and ESP32 chips over their serial bootloader
categories: [workstation, hardware, rf-security]

# D-026, worked example. This copies bytes to a serial port. Some of the images
# people write with it do things that fall inside the D-021 taxonomy; that is a
# property of the firmware, which comes from upstream and runs on the device.
# Gating a flasher would gate `tio` next, because the same firmware is driven
# over a serial console, and then `usbutils`, because enumeration comes first.
# A gate in front of routine software is one people learn to dismiss.

install:
  - install:
      method: apt
      packages: [esptool]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Talks to the ROM bootloader on Espressif ESP8266 and ESP32 chips over a
    serial link: writes firmware images, reads them back, erases flash, and
    reports the chip revision, MAC address and flash size.
  why_you_want_it: >-
    It is how anything ESP32-based gets new firmware from Linux rather than from
    a browser-based flasher, which matters when the board is in front of you and
    the network is not. `esptool chip_id` is also the fastest way to find out
    what a board actually is when the silkscreen is ambiguous, which is
    frequently how a device identification starts.
  prerequisites: >-
    Membership of the `dialout` group, and a board in bootloader mode. Many
    boards enter it automatically via DTR/RTS; some need BOOT held while RESET
    is tapped. Group membership does not apply to a session already open.
  known_problems: >-
    It will happily write an image intended for a different chip and leave the
    board unresponsive until reflashed — recoverable, but alarming the first
    time. A board whose native USB stack is provided by its own firmware
    disappears from /dev while being reflashed; that is expected. ModemManager
    grabbing the port for twenty seconds after plug-in looks exactly like a dead
    board.
  upstream_url: https://github.com/espressif/esptool
