name: cwdaemon
version: "0.10.2"
summary: Network service that keys a transmitter's Morse from a serial or parallel port
categories: [cw, rig-control, contest]

install:
  - install:
      method: apt
      packages: [cwdaemon]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Runs as a daemon listening on a UDP port and turns the text it is sent into
    keying on a serial or parallel port line, or into sidetone on the sound
    card. Speed, weighting, tone and PTT behaviour are changed by escape
    sequences in the same stream, so a client can alter sending mid-message.
  why_you_want_it: >-
    It is the standard way a Linux logging or contest program sends Morse:
    tlf, and several others, speak to it rather than owning the keying
    themselves. Putting the timing in one small daemon is also what keeps it
    steady while the logging program is busy redrawing a screen.
  prerequisites: >-
    A keying interface on a real serial or parallel port and a transmitter to
    key. Access to the port means membership of the `dialout` group for serial,
    or `lp` for parallel — this manifest does not add either, because which one
    you need depends on hardware this catalog cannot see.
  known_problems: >-
    USB-to-serial adapters vary widely in how quickly they toggle a control
    line, and a slow one produces keying that sounds fine at 15 wpm and falls
    apart at 30. This is the single most common cause of "cwdaemon sends badly"
    and it is a property of the adapter, not of the software. A real UART, or a
    dedicated keyer, is the fix. Parallel-port keying needs the `ppdev` module
    and is increasingly hard to find hardware for.
  upstream_url: https://cwdaemon.sourceforge.net/
  upstream_support: SourceForge project page and mailing list.
