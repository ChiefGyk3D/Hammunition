name: hammunition-console
version: "0.1.0"
summary: A terminal front end for the engine -- install, station, logs and updates in one full-screen program
categories: [workstation]

# Retired, and the catalog still carries it, so `hammunition uninstall
# hammunition-console` still reverses a v0.1.0 install (the same arrangement as
# socat, D-061). The console moved into the engine as `hammunition console`
# (#302, D-059 amended 2026-10-04): one release, one version, no floor to check.
# No profile names it, and it no longer carries a launcher: the menu writes the
# engine's own entry for `hammunition console` (`menus apply`).
status: retired
retire_reason: world_changed
status_reason: >-
  Folded into the engine as `hammunition console` (#302): the console only drives
  the engine, so a separate repository produced a version floor and a refusal
  where an update was wanted. Install or update the engine and run
  `hammunition console`; `sudo apt install python3-urwid` (or the `console` extra
  in a virtualenv) is its one dependency. The old repository is archived.
status_date: 2026-10-04
status_verdict: tested
recommended_default: false

# What follows describes the standalone v0.1.0 unit, kept so an uninstall can find
# what it placed.
#
# ADD. Like hammunition-tray and gps-tether, a unit whose upstream is this project's own
# maintainer, disclosed here: a separate repository (GPL-3.0-or-later), its own releases and
# tests, carried on the same terms as everything else: a published, digest-pinned artifact.
#
# The pin is the release's asset, the verified tag archive the release workflow attaches as
# hammunition-console-<ver>.tar.gz beside a SHA256SUMS (the D-024 reasoning, as for the tray). It is a pure
# Python tree run in place with the archive's python3 and python3-urwid: no build, no pip,
# no venv, no network after the fetch (D-014). The console imports no engine code and reads
# only `hammunition <verb> --json` (D-059); every change it makes is the real CLI run in a
# terminal pane, so a consent gate is answered by a person (D-021).
#
# Pinned to v0.1.0's hammunition-console-0.1.0.tar.gz (229,079 bytes), the digest read from the
# release's SHA256SUMS on 2026-10-04 (cosign bundle beside it).
install:
  - install:
      method: binary
      artifact:
        url: https://github.com/Renegade-Penguin/hammunition-console/releases/download/v0.1.0/hammunition-console-0.1.0.tar.gz
        sha256: "78764a19e7225db3f2adfbc3637055c97de73eac170d44c060768462838c3ca2"
      format: tarball
      install_tree: true
      # The asset is the tag's archive: one top directory, which extraction strips.
      tree_marker: hammunition_console/__main__.py
    note: >-
      The tag's source tree, installed to /usr/local/share/hammunition/hammunition-console
      and handed to the operator, with a launcher named hammunition-console in ~/.local/bin
      and a terminal menu entry. Nothing is built and nothing runs as root but the copy.
      The console's own configuration, ~/.config/hammunition-console/, is created by the
      program when it first runs and is left in place on uninstall.

depends: [python3, python3-urwid]

update:
  probe:
    method: github_release
    repo: Renegade-Penguin/hammunition-console
  strategy: reinstall
  cadence_hint: >-
    Tagged releases; each is a new source-archive digest. Re-pin the URL and the digest
    together at every tag, never from a branch.

documentation:
  what_it_does: >-
    Retired: the standalone v0.1.0 terminal front end, now part of the engine as
    `hammunition console`. It is the same full-screen program: Home shows the health
    check, whether your station is set, the last run and how many units are behind the
    catalog's pin; Install shows the engine's own plan and then runs the real command in a
    terminal pane; Station, Logs, Update and Help round it out. Nothing about it is
    measured over SSH or on a Pi.
  why_you_want_it: >-
    You do not need this unit. Run `hammunition console` from the engine you already
    have (reference: docs/console/index.md). This entry stays only so that
    `hammunition uninstall hammunition-console` removes what a v0.1.0 install placed.
  prerequisites: >-
    None for the unit, which cannot be installed. `hammunition console` needs the engine,
    python3-urwid (or the `console` extra in a virtualenv) and a terminal of at least 80x24.
  known_problems: >-
    A copy of the standalone console on PATH (the old unit's tree, or the old
    repository's per-user install.sh) keeps working until you uninstall it, and
    `hammunition-console` is not `hammunition console`: remove the old one with
    `hammunition uninstall hammunition-console` (or that repository's uninstall.sh).
  upstream_url: https://github.com/Renegade-Penguin/hammunition-console
  upstream_support: >-
    The old repository is archived. Issues about `hammunition console` go to the
    Hammunition repository.
