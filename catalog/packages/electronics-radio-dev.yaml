name: electronics-radio-dev
version: "0.3"
summary: Metapackage pulling in the Blend's RF circuit-design tools
categories: [electronics, antenna]

install:
  - install:
      method: apt
      packages: [electronics-radio-dev]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Installs nothing itself. It is a Debian metapackage that depends on the
    circuit-design tools the Debian Hamradio Blend groups under radio-frequency
    work, so installing it brings that set in one command.
  why_you_want_it: >-
    Rarely, in this catalog. Hammunition's profiles are the mechanism for
    "install a coherent set of things", and a metapackage is a second mechanism
    doing the same job with contents we do not control. It is carried for
    completeness of Blend coverage and because an operator following Debian
    documentation will meet the name.
  prerequisites: None.
  known_problems: >-
    Its contents are decided by the Blend, not by us, and they change between
    releases -- which is the reason to prefer a profile, whose contents are
    fixed where you can read them. Uninstalling a metapackage leaves everything
    it pulled in behind, so it is easier to install than to undo.
  upstream_url: https://blends.debian.org/hamradio/
  upstream_support: >-
    The Debian Hamradio Blend team. This package is a Debian construct rather
    than upstream software.
