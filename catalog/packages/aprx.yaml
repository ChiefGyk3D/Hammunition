name: aprx
version: "2.9.1"
summary: APRS digipeater and internet gateway, small enough for a Pi
categories: [aprs, packet-nodes]

install:
  - install:
      method: apt
      packages: [aprx]

# D-050: no menu entry, deliberately. /usr/sbin/aprx is a daemon systemd
# runs and aprx-stat reads its counters; neither is an application to open.
# The callsign in /etc/aprx.conf. Measured 2026-09-29 from the package
# (2.9.1-3), not remembered:
#  - /etc/aprx.conf is a conffile. Debian's copy has `mycall` commented out
#    ("Uncomment the below line and add your own callsign") and, active,
#    only `<aprsis>` (`passcode -1`, `server rotate.aprs2.net`), `<logging>`
#    (pidfile and two logs) and an empty `<beacon>`. This file is those
#    active lines plus `mycall`, so nothing the package did changes except
#    the callsign.
#  - `mycall` is the global callsign macro every `$mycall` in the file,
#    and the APRS-IS login, default to (aprx.conf, aprx(8)).
#  - `passcode -1` is the shipped value: a receive-only APRS-IS login. A
#    real passcode lets a station inject into APRS-IS; it is a credential,
#    not a station value, and is never templated.
#  - The package installs the service disabled (`update-rc.d aprx
#    defaults-disabled`; the systemd unit is not enabled on a first
#    install), so writing this file starts nothing.
#  - The rendered file was read by the extracted binary (`aprx -dd -f`, in
#    a user and network namespace, as a user): `MYCALL = 'N0TST'`,
#    `PASSCODE = '-1'`, `SERVER = 'rotate.aprs2.net':'14580'`, the three
#    logging paths, and "COULD NOT OPEN PIDFILE" -- /var/run is root's, as
#    the service is.
config_files:
  - path: /etc/aprx.conf
    template: |
      # aprx configuration written by Hammunition from your station values.
      # mycall is your callsign; aprx logs in to APRS-IS with it.
      #
      # Deliberately short: the settings Debian's own /etc/aprx.conf had
      # active, plus mycall. That file is kept beside this one as
      # /etc/aprx.conf.hammunition-backup, and the fully commented example
      # is /usr/share/doc/aprx/aprx.conf.gz (zless it); aprx(8) and
      # https://thelifeofkenneth.com/aprx/aprx-manual.pdf explain the rest.
      #
      # This is a receive-only login with no radio interface: it gates
      # nothing until you add an <interface> for your TNC or Direwolf's KISS
      # port. `passcode -1` means no passcode. Your real passcode lets your
      # station inject into APRS-IS; it is a credential, and Hammunition
      # never writes one -- put it here yourself when you want to gate.

      mycall {station.ax25_callsign}

      <aprsis>
      passcode -1
      server rotate.aprs2.net
      </aprsis>

      <logging>
      pidfile /var/run/aprx.pid
      rflog /var/log/aprx/aprx-rf.log
      aprxlog /var/log/aprx/aprx.log
      </logging>
    mode: "0644"
    backup_existing: true

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Acts as an APRS digipeater and as an igate: it can repeat packets on RF,
    forward what it hears to the APRS-IS internet network, and pass messages
    from the internet back out to a local station. It speaks KISS to a
    soundmodem or TNC and runs as a daemon with one configuration file.
  why_you_want_it: >-
    An igate is what puts a local APRS network on the map that everyone else
    looks at, and it is the most common reason to leave a Raspberry Pi and a
    radio running in a loft. Aprx is small, has no graphical dependencies, and
    is designed to run unattended for years -- which is the actual requirement.
  prerequisites: >-
    A receiver and a soundmodem or TNC. A callsign and an APRS-IS passcode for
    the gateway side: Hammunition writes the callsign into `/etc/aprx.conf`
    from station config (`hammunition station set --callsign <yours>`); the
    passcode is a credential and is yours to add. An `<interface>` block for
    the TNC or Direwolf's KISS port is yours too. Transmitting on RF from
    internet traffic is a separate decision and is off unless configured.
  known_problems: >-
    Gating internet traffic to RF is the part that causes trouble: done
    carelessly it floods the local channel with messages for stations that are
    not there. The convention is to gate only what is needed and only for
    stations recently heard locally, and the configuration file's defaults are
    deliberately conservative. An igate publishes what it hears to a permanent
    public archive, including the positions of stations that may not realise
    how far their packets travel.
    What the configuration block does: writes `/etc/aprx.conf`, mode 0644,
    as Debian's own active settings (a receive-only APRS-IS login with
    `passcode -1` to rotate.aprs2.net, and the pidfile and logs) plus
    `mycall` set to your callsign. It is a conffile, so the file Debian
    shipped is copied first to `/etc/aprx.conf.hammunition-backup`, once,
    and a later package upgrade that changes it asks you which to keep. The
    callsign is written only when it is an AX.25 address (one to six
    letters and digits), since aprx logs in with it; a callsign such as
    `W1AW/4` is reported as unusable rather than trimmed. The package
    installs the service disabled and this starts nothing; `sudo systemctl
    start aprx` would log in to APRS-IS under your callsign, receive-only,
    and gate nothing until an interface is configured. If Direwolf is also
    an igate under the same callsign and SSID, APRS-IS sees two logins with
    one name -- give each its own SSID. Inspect with `grep -v '^#'
    /etc/aprx.conf`. `hammunition uninstall aprx` does not remove it
    (config files are not reversed, and the plan says so); to undo, `sudo
    mv /etc/aprx.conf.hammunition-backup /etc/aprx.conf`. Every
    `hammunition install` that includes aprx rewrites the file from station
    config, so a passcode or interface you add is replaced then; the first
    backup is kept, not your edit.
  upstream_url: https://thelifeofkenneth.com/aprx/
  upstream_support: >-
    The maintained aprx line lives at the URL above; the original
    aprx.he.fi site is no longer the reference.
