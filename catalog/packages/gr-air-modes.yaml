name: gr-air-modes
version: "0.0.20210211"
summary: Decodes aircraft transponder replies with GNU Radio
categories: [tracking, sdr, listening]

depends: [gnuradio]

install:
  - install:
      method: apt
      packages: [gr-air-modes]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Receives Mode S and ADS-B transmissions at 1090 MHz and decodes them into
    aircraft identity, altitude, position and velocity, with output to a map,
    to a log, or to the network formats other tracking software consumes.
  why_you_want_it: >-
    It is the GNU Radio path to ADS-B, which means the decode chain is open to
    inspection and modification rather than being a black box that emits
    aircraft. For learning how the protocol works, or for experimenting with
    the demodulator, it is the one to reach for.
  prerequisites: >-
    An SDR that reaches 1090 MHz with at least 2 MHz of bandwidth, and an
    antenna for that band -- a quarter wave is about 7 cm, so a proper antenna
    is small and cheap and makes an enormous difference against the stub that
    came with a dongle.
  known_problems: >-
    For simply collecting aircraft data, readsb or dump1090 are considerably
    more efficient -- they are purpose-built decoders and this is a general
    framework doing the same job at higher CPU cost. Upstream has been quiet
    since 2021, which the version string makes plain. Aircraft positions are
    broadcast in the clear by design; what you may do with them is not a
    technical question.
  upstream_url: https://github.com/bistromath/gr-air-modes
  upstream_support: Nick Foster. GitHub issues at the URL above.
