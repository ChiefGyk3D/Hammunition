name: ebook2cwgui
version: "0.1.2"
summary: Graphical front end for ebook2cw
categories: [cw, training]

# AHRL installs this from apt (unit 14) and not ebook2cw itself, which is why
# the dependency is declared rather than assumed: the GUI is a front end that
# runs the converter, and installing only the window gives you a window that
# reports a missing program.
depends: [ebook2cw]

install:
  - install:
      method: apt
      packages: [ebook2cwgui]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Puts a wxWidgets window around ebook2cw: pick a text file, set character
    speed, effective speed, pitch and output format, and press the button. It
    runs the same converter and produces the same files.
  why_you_want_it: >-
    The command-line tool has around twenty options and the two that matter
    most — character speed and effective speed — are easy to confuse. Seeing
    them as two labelled boxes side by side is worth more than it sounds when
    you are setting up a practice regime you intend to keep.
  prerequisites: >-
    ebook2cw itself, which this manifest declares as a dependency. A desktop
    session; it is a GUI and has no command-line mode.
  known_problems: >-
    It is a thin wrapper and does not expose every ebook2cw option. For
    anything beyond speed, pitch and format — chapter splitting patterns,
    frequency shifts between chapters, ID3 detail — use ebook2cw directly.
  upstream_url: https://fkurz.net/ham/ebook2cw.html#gui
  upstream_support: Fabian Kurz, DJ1YFK — same project as ebook2cw.
