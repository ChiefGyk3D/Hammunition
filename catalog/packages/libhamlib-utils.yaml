name: libhamlib-utils
version: "4.6.2"
summary: The command-line tools for hamlib — test a radio before blaming software
categories: [rig-control, station]

install:
  - install:
      method: apt
      packages: [libhamlib-utils]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Carries `rigctl` and `rigctld`, the command-line and daemon interfaces to
    hamlib, plus `rotctl` and `rotctld` for antenna rotators. `rigctl` sets and
    reads frequency, mode, PTT and everything else a backend supports;
    `rigctld` serves the same over a network socket so several programs can
    share one radio.
  why_you_want_it: >-
    `rigctl` is the diagnostic that separates a radio problem from a program
    problem. When fldigi will not key the transmitter, the question is whether
    hamlib can, and one command answers it. Nearly every Linux ham program uses
    hamlib underneath, so a fault reproduced here is a fault in the layer
    everything shares.
  prerequisites: >-
    A CAT interface and access to its serial device -- the `dialout` group.
    Knowing your radio's hamlib model number, which `rigctl -l` lists.
  known_problems: >-
    The model number matters and the closest-looking one is often wrong; a
    mismatched backend produces partial control, where frequency works and mode
    does not, which reads as a broken cable. Baud rate and, for Icom, the CI-V
    address must match the radio's own menu settings. `rigctld` and a program
    opening the serial port directly will fight over it, and the symptom is
    erratic behaviour rather than an error -- decide which one owns the port.
  upstream_url: http://www.hamlib.org
  upstream_support: >-
    The Hamlib project. The mailing list is where radio-specific backend
    questions are answered, and the developers do respond to good reports.
