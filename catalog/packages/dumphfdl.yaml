name: dumphfdl
version: 1.7.0
summary: HFDL decoder for long-range oceanic aircraft datalink
categories: [listening]

depends:
  - libacars
after:
  - libacars

install:
  - install:
      # Was a git build; converted to the tag archive so the liquid-dsp
      # version-check patch below can apply (patches are a source-block
      # feature). Same revision either way -- the archive is the tag.
      method: source
      source:
        url: https://github.com/szpajder/dumphfdl/archive/refs/tags/v1.7.0.tar.gz
        sha256: 56b091e5e3f8c3b87c91f63cbd3a15fc6c318b297e30f89b77dbaae5991f2d7a
      patches:
        - file: src/CMakeLists.txt
          description: >-
            Two independent breaks against liquid-dsp 1.8 on Kali, measured
            2026-08-30. First the version check cannot even compile: liquid
            1.8's own header uses va_list without including stdarg.h, and
            GCC 15's tightened glibc headers no longer leak it through
            stdio.h -- so the snippet gains the include. Behind that, 1.8
            byte-packs LIQUID_VERSION_NUMBER (1.8.2 reports 67586) where the
            check expects decimal, so the minimum drops to 66304 (1.3.0
            byte-packed), which both encodings satisfy for every version the
            code supports. Debian's older liquid passes untouched either
            way.
          unified_diff: |
            --- a/src/CMakeLists.txt
            +++ b/src/CMakeLists.txt
            @@ -69,10 +69,11 @@
             set(CMAKE_REQUIRED_LIBRARIES_SAVE ${CMAKE_REQUIRED_LIBRARIES})
             set(CMAKE_REQUIRED_LIBRARIES ${CMAKE_REQUIRED_LIBRARIES} ${LIQUIDDSP_LIBRARIES})
             set(LIQUID_VERSION_MIN "1.3.0")
            -set(LIQUID_VERSION_NUMBER_MIN 1003000)
            +set(LIQUID_VERSION_NUMBER_MIN 66304)
             set(LIQUID_VERSION_NUMBER_MAX 1999999)
             check_c_source_runs("
            +#include <stdarg.h>
             #include <stdio.h>
             #include <liquid/liquid.h>
      build_system: cmake
    build_depends:
      - patch
      - build-essential
      - cmake
      - pkg-config
      - libglib2.0-dev
      - libconfig++-dev
      # liquid-dsp >= 1.3.0 is required, not optional: it is the DSP engine.
      - libliquid-dev
      - libfftw3-dev
      - libsoapysdr-dev
      - libsqlite3-dev
    note: >-
      `SCOPE.md` listed dumphfdl as DragonOS Tier 1 — "apt-installable or an
      upstream .deb". It is neither: absent from Debian stable and unstable and
      from every target's apt, measured in containers. It is a source build, and
      that correction is recorded in dragonos-tier1-inventory.md.

update:
  probe:
    method: github_tags
  strategy: rebuild
  cadence_hint: >-
    Tagged releases, infrequent. Last commit on the default branch 2025-11-02
    (verified 2026-08-28 from the branch head — D-032).

documentation:
  what_it_does: >-
    Decodes HFDL, the HF datalink aircraft use where there is no VHF ground
    station — over oceans, poles and deserts. It demodulates the shortwave
    carriers, tracks the ground-station network, and with libacars decodes the
    application layer, including position reports from aircraft several thousand
    kilometres away.
  why_you_want_it: >-
    It is the one aeronautical mode that does not need line of sight, so it is
    the only way to hear datalink traffic from mid-ocean with a receiver at
    home. It also rewards an HF antenna you may already have for amateur bands,
    and it decodes several ground stations at once from a single wideband
    capture if your SDR has the bandwidth.
  prerequisites: >-
    An HF-capable SDR — an RTL dongle alone will not do, since HFDL lives
    between roughly 2 and 22 MHz. Airspy HF+, an upconverted RTL, or anything
    SoapySDR reaches with HF coverage. libacars must be installed first, which
    the catalog sequences.
  known_problems: >-
    liquid-dsp is a hard requirement and the version matters — upstream needs
    1.3.0 or newer. Skywave ships dumphfdl in its ISO but its published
    installer scripts do not build it at all, which is one of the clearest signs
    that those scripts and that image have diverged.
  upstream_url: https://github.com/szpajder/dumphfdl
  upstream_support: >-
    GitHub issues at https://github.com/szpajder/dumphfdl/issues.
