name: hammunition-tray-qt
version: "0.5.0"
summary: Tray switches for parking and waking radio devices on Xfce, LXQt, LXDE, MATE and Cinnamon — the Hammunition family's own
categories: [device-support]

# The Plasma applet's switch for the other panels (D-060). A Qt tray icon:
# StatusNotifierItem where the panel offers it (Xfce, LXQt), XEmbed where it
# does not (LXDE's lxpanel). On a Plasma machine hammunition-tray serves
# instead, and this package's autostart entry carries NotShowIn=KDE so a
# machine with both desktops never shows two trays in Plasma. GNOME is not
# listed: its panel has no tray without the AppIndicator extension, and that
# combination has not been measured.
desktops: [xfce, lxqt, lxde, mate, cinnamon]
desktop_alternative: hammunition-tray

# ADD. A second package from hammunition-tray's repository and release, whose
# upstream is this project's own maintainer, disclosed here and carried on the
# same terms as everything else -- a published, digest-pinned artifact,
# measured before it was written down.
#
# Pinned to the v0.5.0 tag's source archive for the reason hammunition-tray
# gives (no .deb published yet); this unit places what the .deb would have:
# /usr/local/bin/hammunition-tray-qt, its Python package under
# /usr/share/hammunition-tray-qt (the script's own path: it puts that
# directory on the import path, so it cannot move), an application menu entry,
# an autostart entry in /etc/xdg/autostart (not shown in Plasma), and two icons
# under /usr/share/icons/hicolor. The archive and its digest are the ones
# hammunition-tray's comment measured. `depends` is the .deb's Depends line
# (python3-pyqt6, and pkexec first because policykit-1 has no candidate on
# Debian 13, apt-cache policy, 2026-09-28). Not yet run on any of the desktops
# it lists: docs/reference/vm-campaign-desktops.md is that check.
depends: [python3-pyqt6, pkexec]

install:
  - install:
      method: binary
      artifact:
        url: https://github.com/ChiefGyk3D/hammunition-tray/archive/refs/tags/v0.5.0.tar.gz
        sha256: 614148fb4241e88ca007885d01ef97d0752c8cd47b6e57337e2ee12ab3bfc438
      format: tarball
      placement_dirs:
        - /usr/share/hammunition-tray-qt
      placements:
        - source: qt/hammunition_tray_qt/__init__.py
          dest: /usr/share/hammunition-tray-qt/hammunition_tray_qt/__init__.py
        - source: qt/hammunition_tray_qt/__main__.py
          dest: /usr/share/hammunition-tray-qt/hammunition_tray_qt/__main__.py
        - source: qt/hammunition_tray_qt/controls.py
          dest: /usr/share/hammunition-tray-qt/hammunition_tray_qt/controls.py
        - source: qt/hammunition_tray_qt/logic.py
          dest: /usr/share/hammunition-tray-qt/hammunition_tray_qt/logic.py
        - source: qt/hammunition_tray_qt/timelogic.py
          dest: /usr/share/hammunition-tray-qt/hammunition_tray_qt/timelogic.py
        - source: qt/hammunition_tray_qt/tray.py
          dest: /usr/share/hammunition-tray-qt/hammunition_tray_qt/tray.py
        - source: qt/hammunition-tray-qt
          dest: /usr/local/bin/hammunition-tray-qt
          mode: "0755"
        - source: qt/hammunition-tray-qt.desktop
          dest: /usr/share/applications/hammunition-tray-qt.desktop
        - source: qt/hammunition-tray-qt-autostart.desktop
          dest: /etc/xdg/autostart/hammunition-tray-qt.desktop
        - source: plasmoid/package/contents/icons/hammunition-devices-awake.svg
          dest: /usr/share/icons/hicolor/scalable/apps/hammunition-tray-qt-awake.svg
        - source: plasmoid/package/contents/icons/hammunition-devices-parked.svg
          dest: /usr/share/icons/hicolor/scalable/apps/hammunition-tray-qt-parked.svg
      devctl_helper:
        modules:
          - __init__.py
          - __main__.py
          - bus.py
          - datafiles.py
          - devctl.py
          - devices.py
          - linger.py
          - polkit.py
          - power.py
          - radio.py
          - rootfiles.py
          - run.py
          - services.py
    note: >-
      Spreads the tray over /usr/share/hammunition-tray-qt, /usr/local/bin,
      /usr/share/applications, /etc/xdg/autostart (not shown in Plasma) and
      /usr/share/icons/hicolor (each file printed in the plan), and installs
      the device helper the menu calls, through /usr/bin/pkexec: the code under
      /usr/local/lib/hammunition-devctl, the wrapper at
      /usr/local/libexec/hammunition-devctl and the polkit action (the plan
      names the interpreter the wrapper runs as root, and says when another
      installer's helper is already there and is left alone). It runs nothing
      as root itself.

# THE HELPER (D-056, amended 2026-10-02). The privileged helper lives in this
# release's archive (`devctl/`, contract 1: `docs/contract.md` at the tag) and
# the `devctl_helper` block installs it the way the tray's own
# `install.sh --helper-only --interpreter` does, from the same archive: the
# code copied to /usr/local/lib/hammunition-devctl (root never runs the unpack),
# the /bin/sh wrapper at /usr/local/libexec/hammunition-devctl with the
# engine's own venv interpreter baked in (the helper's `time` verbs import the
# engine), and the polkit action. All of it is printed in the plan, asked once
# at the keyboard when the engine's venv belongs to one account (never by
# `--yes`) and refused when any account can write it, read back with
# `--version`, and removed by `uninstall` on the log's say-so, and only when no
# other tray unit still needs it. It is NOT a catalog `config_files` entry:
# the wrapper bakes in an interpreter a catalog file cannot name, and a file a
# package owns is never written over (nor is any placed file: the plan
# refuses, naming the package, where a .deb such as 0.4.0 still owns them). A helper
# that already answers contract 1 (the `hammunition-devctl` .deb, the tray's
# installer) is left alone and the plan says whose it is; one this engine
# installed earlier is refreshed to this pin. This unit and its Qt sibling
# carry the same block, so either installs the helper for both.

update:
  probe:
    method: github_release
    repo: ChiefGyk3D/hammunition-tray
  strategy: reinstall
  cadence_hint: >-
    Released together with hammunition-tray: one tag, both .debs and one
    SHA256SUMS. A release is a new digest for each; re-pin both units. The
    v0.5.0 release's .deb assets were not published when this was pinned, so
    the pin is the tag's own source archive.

documentation:
  what_it_does: >-
    A system-tray icon with a menu entry for each catalogued device
    Hammunition can park that is plugged in -- a GPS receiver, a cellular
    modem, a Bluetooth controller or a camera. Choosing a device's entry detaches it so the kernel drops it
    and its port can suspend, or brings it back. A device kept off across
    reboots reads "kept off", and one that is unplugged while kept offers
    Forget. The icon is the same penguin with a handheld radio as the Plasma
    applet's, and it goes grey while anything is parked. A Time section
    (D-058, needs Hammunition 0.18.0 or later) shows what the clock follows
    and lets you choose one of the four GPS-time modes. The same menu has the
    Controls panel's Services group (the GPS daemon, the clock, the GPS
    tether, the rig service) and Radios group (mobile broadband, Wi-Fi,
    Bluetooth).
  why_you_want_it: >-
    The Plasma applet's switch on a lighter desktop: parking a GPS or a modem
    you are not using saves battery on a field laptop, in one click and one
    password prompt. It is a front end for `hammunition hardware park` and
    `wake` (D-056), sharing the applet's rules and texts, so it does exactly
    what those do and nothing else.
  prerequisites: >-
    Xfce, LXQt, LXDE, MATE or Cinnamon, with a panel that has a system tray
    (Xfce's Status Tray plugin, LXQt's Status Notifier, lxpanel's system
    tray). A polkit authentication agent must be running for the password
    prompt; the tray says so, and names the package, when none is.
    This unit installs the device helper and the polkit action the menu calls
    (from the same release archive, D-056); the device and service lists it
    reads are written by `hammunition hardware apply`, which also hands over to
    this helper rather than writing its own. The helper runs as root through the
    engine's own Python, so the engine's virtualenv must not be writable by any
    account but its owner: the install asks one `yes` that `--yes` cannot
    answer when it belongs to one account, and refuses when any account can
    write it.
  known_problems: >-
    **Not yet run on any of the desktops it lists**; the Xubuntu and Lubuntu
    VM checklist in docs/reference/vm-campaign-desktops.md is that check.
    Where the desktop has no system tray (GNOME without the AppIndicator
    extension) it prints one line and exits rather than showing nothing
    forever. It starts at the next login after installing; start it now from
    the application menu entry *Hammunition Devices* or by running
    `hammunition-tray-qt`. Left click opening the menu is unmeasured on
    Wayland; right click is the menu everywhere.
  upstream_url: https://github.com/ChiefGyk3D/hammunition-tray
  upstream_support: >-
    Issues on the GitHub repository. For "the menu does nothing", run
    `hammunition hardware state` first: the tray shows what that command
    reports.
  offline: >-
    Entirely local: no internet and no local network. The menu calls a root
    helper through polkit on this machine, so a polkit authentication agent must
    be running, and `hammunition hardware apply` must already have written the
    device and service lists. The Radios group switches mobile broadband, Wi-Fi
    and Bluetooth off and on; turning one off is what cuts that connectivity, so
    do it on purpose. It has not yet been run on any of the desktops it lists.
  first_task: >-
    Run `hammunition hardware apply --dry-run`, read it, then `hammunition
    hardware apply`. Start the tray from the *Hammunition Devices* menu entry or
    run `hammunition-tray-qt` (it also starts at your next login). With a
    catalogued parkable device plugged in, its entry appears in the tray icon's
    menu; choose it to park the device and again to wake it, with one password
    prompt. `hammunition hardware state` shows the same state in a terminal.
