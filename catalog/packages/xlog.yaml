name: xlog
version: "2.0.24"
summary: Small GTK station log that opens instantly and does the basics well
categories: [logging]

install:
  - install:
      method: apt
      packages: [xlog]
    note: >-
      AHRL builds 2.0.25 from source because the repository had 2.0.24, and
      needs six -Wno-* flags to make that build compile. Debian 13 and Parrot
      still carry 2.0.24; Ubuntu 26.04 and Kali carry 2.0.25 (measured
      2026-08-28). A point release is not worth owning a build that a stricter
      future compiler will break, so this is apt on every target and the
      difference is recorded rather than engineered around --
      `docs/contributing/manifests.md` states the rule.

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Logs contacts to a plain file, looks up DXCC from cty.dat, tracks worked and
    confirmed status per band, prints and exports QSL labels, and reads the rig
    through hamlib. It has one window and no modes.
  why_you_want_it: >-
    It is the log for an operator who wants a log rather than a station
    management system. It starts in under a second, the file it writes can be
    read with an editor, and nothing about it needs setting up before the first
    contact. For casual operating and for portable work that is exactly right.
  prerequisites: >-
    Nothing to start. DXCC lookup uses cty.dat, which the package ships;
    keeping it current is a manual step and one AHRL automated by copying a
    fresh file into six directories.
  known_problems: >-
    GTK 2, like CQRLOG -- functional, unthemed on a modern desktop, small on
    HiDPI. Development upstream is quiet: the last release is some years old,
    which for a program of this scope is closer to finished than to abandoned,
    but it does mean no new online-service integrations are coming.
  upstream_url: https://xlog.nongnu.org/
  upstream_support: Savannah project page and mailing list at the URL above.
