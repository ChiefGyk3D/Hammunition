name: wsjtx-improved
version: "3.2.0"
summary: Community fork of WSJT-X with additional decoding and UI features
categories: [digital-modes]

# Ordering is declared for determinism, but correctness no longer depends on it:
# install_as gives each build a distinct final name, so neither can overwrite
# the other regardless of sequence. Contrast AHRL, where running one without
# the other leaves a mis-named binary.
after: [wsjtx]

install:
  - when:
      arch: [x86_64]
    install:
      # The flat 3.1.0 source-tgz URL was AHRL's bundled filename, never
      # fetched -- SF actually files releases under WSJT-X_vX.Y.Z/<OS>/, and
      # for 3.2.0 the Linux artifacts are vendor .debs (PLUS flavour matches
      # what AHRL shipped; a Raspberry Pi directory exists for ARM and is not
      # yet measured). Fetch-verified 2026-08-30; goes through
      # apt-get install ./file.deb like every deb.
      method: binary
      artifact:
        url: https://downloads.sourceforge.net/project/wsjt-x-improved/WSJT-X_v3.2.0/Linux/wsjtx_3.2.0_improved_PLUS_260818_amd64.deb
        sha256: 904b943c98bd2cd5e30e2f1aee8fef401a535d2821af8728078e60dfeb287903
      format: deb

recommended_default: false

toolkit_risk:
  - framework: qt5
    upstream_port_status: unknown
    checked: 2026-08-25

update:
  probe:
    method: none
  strategy: manual
  cadence_hint: >-
    SourceForge releases with date-stamped filenames; no release API. Check
    manually and re-pin the sha256.

documentation:
  what_it_does: >-
    A fork of WSJT-X carrying decoding improvements, additional user-interface
    options, and features that have not been merged upstream.
  why_you_want_it: >-
    Operators chasing marginal decodes often prefer it. It coexists with stock
    WSJT-X rather than replacing it, so you can run either.
  prerequisites: Same as WSJT-X — accurate clock, CAT control, audio routing.
  known_problems: >-
    Distributed as date-stamped SourceForge artifacts with no release feed,
    so updates must be found and re-pinned by hand. The 3.2.0 vendor .deb
    registers as dpkg package `wsjtx` and installs /usr/bin/wsjtx -- a
    source-built stock WSJT-X in /usr/local/bin shadows it on PATH, so run
    /usr/bin/wsjtx explicitly when both are present. Measured harder
    (2026-08-30, Parrot and the campaign box state): the deb ships
    /usr/share/pixmaps/wsjtx_icon.png without a Replaces header, so dpkg
    refuses it -- correctly -- on any machine where the distribution's
    wsjtx-data is installed, which jtdx depends on. Until this catalog can
    declare package conflicts, installing wsjtx-improved alongside jtdx
    means removing jtdx and wsjtx-data first; the engine's failure text says
    exactly this.
  upstream_url: https://sourceforge.net/projects/wsjt-x-improved/
