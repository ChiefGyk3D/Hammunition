name: nanovna-saver
version: "0.7.4.dev0+g3445a0ab"
summary: Sweep, chart and calibrate a NanoVNA from the computer
categories: [antenna, electronics]

# CARRY from AHRL, which git-clones main unpinned into a home-dir venv. The
# measured situation (2026-08-30) is messier than either a PyPI install or a
# binary: the project is NOT on PyPI; the latest release (v0.7.3,
# 2025-02-24) caps requires-python at <3.13 while every target here ships
# 3.13+; and its release assets are a Windows .exe and an aarch64 ELF only.
# So: x86_64 builds from a hash-pinned commit archive (HEAD lifted the
# python ceiling; no distribution packages this, so the pin basis is
# own_choice per D-024 -- first release after 2026-04-18 replaces it), and
# aarch64 takes upstream's prebuilt single executable. The commit archive
# needs SETUPTOOLS_SCM_PRETEND_VERSION because a GitHub archive has no .git
# to read a version from.
install:
  - when:
      arch: [x86_64]
    install:
      method: venv
      expose: [NanoVNASaver]
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NANOVNASAVER: 0.7.4.dev0
      requirements:
        - nanovnasaver @ https://github.com/NanoVNA-Saver/nanovna-saver/archive/3445a0ab86161f9c886c9d6f215eb57cab9b6f45.tar.gz  --hash=sha256:e8b1796b7ae06a0245a44060bd9f8135f4228aab3b56387e34f7822241071e42
