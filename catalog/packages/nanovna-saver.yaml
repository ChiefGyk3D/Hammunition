    note: >-
      The nanovnasaver line pins the commit archive by sha256 and pip
      verifies it like any wheel (--require-hashes). GitHub does not promise
      eternal stability for auto-generated archives -- if this hash ever
      fails, that is the archive changing, not tampering necessarily; verify
      and re-pin. Regenerate the set with uv pip compile --universal
      --generate-hashes, with the SETUPTOOLS_SCM env var exported.
  - when:
      arch: [aarch64]
    install:
      method: binary
      artifact:
        url: https://github.com/NanoVNA-Saver/nanovna-saver/releases/download/v0.7.3/nanovna-saver.raspi
        sha256: 2de8c1f6cc64829ceaf5ea13ad47f0507bf4ca7d1336dfc68b355a1609c712c0
      format: executable

binaries:
  - produced: nanovna-saver.raspi
    install_as: NanoVNASaver

update:
  probe:
    method: github_release
    repo: NanoVNA-Saver/nanovna-saver
  strategy: reinstall
  cadence_hint: >-
    Watch for the first release after 2026-04 -- it ends the commit pin and
    the python-ceiling workaround in one move.

documentation:
  what_it_does: >-
    Connects to a NanoVNA or tinySA over USB serial, drives frequency
    sweeps, and displays S11/S21 as SWR, Smith chart, phase and magnitude
    plots -- with proper SOLT calibration, markers, and Touchstone export.
  why_you_want_it: >-
    The NanoVNA's own screen is two inches across. This is how antenna
    measurements actually get read, compared and saved -- the de facto
    companion software for the most common antenna analyzer hardware in
    amateur radio.
  prerequisites: >-
    A NanoVNA-family device on USB and access to its serial port -- the
    `dialout` group. Calibration standards (the SOLT set that came with the
    device) for anything beyond rough looks.
  known_problems: >-
    On x86_64 the wrapper is `NanoVNASaver` in ~/.local/bin (open a new
    shell after first install). The pinned commit is between releases by
    necessity -- the python ceiling -- and behaves as a 0.7.4 development
    snapshot. On Wayland, Qt may want QT_QPA_PLATFORM=xcb, the standing
    guidance.
  upstream_url: https://github.com/NanoVNA-Saver/nanovna-saver
  upstream_support: GitHub issues; an active project with many contributors.
