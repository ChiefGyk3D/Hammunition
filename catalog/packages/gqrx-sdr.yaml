name: gqrx-sdr
version: "2.17.6"
summary: Graphical SDR receiver — waterfall, demodulators and a bookmark list
categories: [sdr, listening]

install:
  - install:
      method: apt
      packages: [gqrx-sdr]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    A general-purpose SDR receiver with a waterfall display, the usual
    analogue demodulators, recording, and a remote-control interface other
    software can drive.
  why_you_want_it: >-
    It is the receiver most people are pointed at first, it works with
    anything gr-osmosdr or SoapySDR reaches, and its remote-control interface
    lets satellite tracking software steer it for Doppler correction.
  prerequisites: >-
    A supported receiver and its driver. Audio output through PulseAudio or
    PipeWire.
  known_problems: >-
    Built on GNU Radio, so it inherits GNU Radio's version sensitivity. The
    apt install this manifest performs is insulated from that in the steady
    state — the archive rebuilds gqrx-sdr against its own GNU Radio — but a
    partial upgrade that moves GNU Radio before the rebuilt gqrx-sdr arrives
    can leave it unable to start until the archive catches up. On Wayland the waterfall can be slow; AHRL's guidance
    to prefer X11 for ham applications applies here.
  upstream_url: https://gqrx.dk/
