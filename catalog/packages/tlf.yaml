name: tlf
version: "1.4.1"
summary: Console contest logger built for speed, driven from the keyboard
categories: [contest, logging, cw]

install:
  - install:
      method: apt
      packages: [tlf]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    A curses contest log covering the major CW, SSB and digital contests, with
    per-contest scoring rules, duplicate checking, multiplier tracking, a band
    map fed from a DX cluster, and CW sent through cwdaemon or the rig's own
    keyer. It talks to hamlib for frequency and mode and to fldigi for digital
    modes.
  why_you_want_it: >-
    Contesting is a typing job under time pressure, and every mouse movement is
    a lost second. Everything here is on the keyboard, the screen fits in a
    terminal, and it runs over SSH to a remote station without a graphics
    stack. It is also the logger most likely to already know the scoring rules
    of the contest you are entering.
  prerequisites: >-
    A contest-specific configuration file -- tlf ships examples and you start
    from one rather than from nothing. CW keying needs cwdaemon or a rig that
    can key itself. Cluster spots need a network connection and a cluster to
    connect to.
  known_problems: >-
    The learning curve is the real cost: the key bindings are not discoverable
    and the first contest with it will go badly if it is also the first hour
    with it. Set it up and run a practice session beforehand. Scoring rules for
    a contest that changed its own rules this year may be a release behind, so
    check the multiplier logic against the current rules rather than trusting
    the total.
  upstream_url: https://tlf.github.io/
  upstream_support: >-
    GitHub issues at https://github.com/Tlf/tlf and a mailing list linked from
    the project page.
