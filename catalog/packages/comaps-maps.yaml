name: comaps-maps
version: "station"
summary: CoMaps' own map files for your map regions, checked against CoMaps' index
categories: [navigation-maps]

# Data (D-049, D-069): which maps follows the station's regions through the
# region table in catalog/data/comaps-pins.yaml, generated from CoMaps' map
# index (data/countries.txt) at the commit `comaps` builds. Each map is
# checked by the SHA-1 and exact size that index gives -- the publisher's
# check, not one Hammunition measured, and the plan says so on every line --
# and its sha256 goes into the transaction log. Measured 2026-09-29: Vermont
# 60,883,711 bytes, its SHA-1 matching the index; a HEAD of Delaware answered
# the index's size. Nothing here depends on `osm-regions`: CoMaps' maps are
# CoMaps' own, not converted from Geofabrik's.
install:
  - install:
      method: mwm-regions
      provider: comaps
      licence: ODbL-1.0
      licence_url: https://www.openstreetmap.org/copyright

update:
  probe:
    method: comaps_maps
  strategy: reinstall
  cadence_hint: >-
    The maps are the version the `comaps` pin's index names. CoMaps' CDN
    keeps a version for months, not forever: `update --upstream` says
    "pin expiring" from 90 days after the version's date and "pin expired"
    once the CDN stops serving it; then move `comaps` to a newer tag and
    regenerate the pins with scripts/gen_comaps_pins.py.

documentation:
  what_it_does: >-
    Downloads CoMaps' own map files (.mwm) for the map regions in station
    config from CoMaps' CDN, checks each against CoMaps' index, and keeps
    them under /usr/local/share/hammunition/data/comaps-maps/, one directory
    per map version. A US state is one to a dozen files, tens to a few
    hundred megabytes; all of the US is 15.7 GB. Each file carries the map,
    its search index (addresses, places, postcodes) and its routing data.
    `hammunition maps comaps` links them where CoMaps looks.
  why_you_want_it: >-
    CoMaps reads its own format and nothing else, so this is how its search
    and routing work offline. The files are the ones the CoMaps phone app
    downloads, so the laptop and a phone can carry the same maps.
  prerequisites: >-
    Map regions set in station config with Geofabrik's region paths, for
    example `hammunition station set --map-regions
    north-america/us/vermont`. With none set this unit is deferred by name.
  known_problems: >-
    The check is the SHA-1 and size in CoMaps' own index at the pinned
    commit ("SHA-1 and size from CoMaps' own map index at the pinned commit
    (the publisher's check)"); there is no signature and no sha256 from
    CoMaps. The size is compared exactly, because CoMaps' mirrors answer a
    missing file with 200 and a web page. Every map not yet installed is
    asked for with a HEAD before the plan prints, so an expired pin refuses
    the plan before anything is changed. A Geofabrik region CoMaps names
    differently (Geofabrik's `europe/germany/bayern` is CoMaps' "Free State
    of Bavaria") has no row in the region table; the plan names it and
    fetches nothing for it. The table covers 262 of the 532 Geofabrik
    regions Hammunition carries lists of: the 50 US states and DC, Canada's
    provinces and territories but Newfoundland and Labrador (CoMaps splits
    it in two), and 165 of the 197 country-level regions. Not covered, among
    others: China, Russia and its districts, Ireland and Northern Ireland,
    Israel and Palestine, the Democratic Republic of the Congo and Ivory
    Coast, which CoMaps names or groups differently. CoMaps' own grouping also brings along what it
    files with a country (the UK's row includes British Indian Ocean
    Territory), a small extra download. A LAN mirror set with `station set
    --mirror` is asked first, checked the same way. The
    maps are OpenStreetMap data under the ODbL: anything you publish from
    them must credit OpenStreetMap's contributors. US address-search
    quality has not been measured.
  upstream_url: https://www.comaps.app/
  upstream_support: >-
    CoMaps' Codeberg issue tracker (https://codeberg.org/comaps/comaps/issues)
    for the maps and the app; OpenStreetMap itself for the data.
