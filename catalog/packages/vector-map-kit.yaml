        Several, each the publisher's: FTWPL (tilemaker's profile); CC-BY-4.0
        (the OSM Bright design and the OpenMapTiles schema, which require the
        visible credit "© OpenMapTiles © OpenStreetMap contributors" that the
        page draws); BSD-3-Clause (OSM Bright's code, MapLibre GL JS,
        pmtiles.js); OFL-1.1 (the Noto fonts, kept under KlokanTech's names
        as their README asks); public domain (Natural Earth)
      licence_url: https://github.com/openmaptiles/osm-bright-gl-style/blob/master/LICENSE.md

update:
  probe:
    method: none
  strategy: reinstall
  cadence_hint: >-
    Each file is pinned to a release, a tag's commit or a pool file. A new
    MapLibre or pmtiles release, a tilemaker the archive moves to, or a new
    Natural Earth tag is a manifest change: download the file once, hash it,
    compare with the publisher's own digest where there is one (GitHub's
    asset digest, npm's integrity), and bump url, sha256 and size together.
    A new tilemaker profile changes the tiles, so `CONVERTER` in
    backends/pmtiles.py is bumped with it and every region is rebuilt.

documentation:
  what_it_does: >-
    Installs, under /usr/local/share/hammunition/data/vector-map-kit/, the
    fixed files the offline browser map needs besides your regions:
    tilemaker's OpenMapTiles profile (config and Lua) and the four Natural
    Earth layers it names (ocean, urban areas, glaciers, Antarctic ice
    shelves), which `osm-pmtiles` reads when it builds each region's vector
    tiles; and the OSM Bright style with its sprite and three Noto fonts,
    MapLibre GL JS and pmtiles.js, which `hammunition reference serve` hands
    to the browser to draw them. About 79 MB downloaded, most of it
    tilemaker's whole tarball, of which only the profile, the style and the
    three fonts are kept; about 45 MB installed.
  why_you_want_it: >-
    None of it is in any distribution's archive (tilemaker's own package
    ships no profile, and no archive carries MapLibre), and the style as
    tilemaker ships it loads its library and sprite from the internet. Pinned
    here, the map draws with the network off. It is what a browser map of
    your own regions needs, the alternative to an online tile service.
  prerequisites: >-
    Nothing. It installs with `osm-pmtiles` in the `navigation` profile.
  known_problems: >-
    The ocean is Natural Earth's 1:10m polygon, about 1 km of accuracy: at
    street zoom a coast can sit a little off OpenStreetMap's own shoreline.
    The accurate water polygons (906 MB, osmdata.openstreetmap.de) are rebuilt
    daily with no checksum, so they cannot be pinned, and are not carried.
    Only Latin, Greek and Cyrillic glyphs are carried (the three KlokanTech
    Noto Sans faces); the CJK faces are another 64 MB and are left out, so
    labels in Chinese, Japanese or Korean script do not draw. On a release
    whose tilemaker is older than 3.0 (Ubuntu 24.04 and those built on it),
    `navigation` defers `osm-pmtiles` but still installs this kit, so the
    page opens and says no maps are installed; `hammunition uninstall
    vector-map-kit` takes it back out.
  upstream_url: https://openmaptiles.org/
  upstream_support: >-
    Each project's own tracker: tilemaker
    (https://github.com/systemed/tilemaker/issues), OSM Bright
    (https://github.com/openmaptiles/osm-bright-gl-style/issues), MapLibre
    GL JS (https://github.com/maplibre/maplibre-gl-js/issues), pmtiles
    (https://github.com/protomaps/PMTiles/issues), Natural Earth
    (https://github.com/nvkelso/natural-earth-vector/issues).
