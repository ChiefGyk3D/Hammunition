name: vector-map-kit
version: "2026-09-30"
summary: The fixed files the offline browser map needs, from their publishers, pinned
categories: [navigation-maps]

# D-071. Every file here was downloaded once on 2026-09-30, hashed, compared
# with the copy the tile spike rendered from (2026-09-29, Delaware) and
# deleted; the sha256 below is Hammunition's own. Nothing is mirrored.
#
# - tilemaker's OpenMapTiles profile, the OSM Bright style and three Noto
#   fonts are members of Debian's pool copy of tilemaker 3.0.0's tarball
#   (the tag Debian 13 packages, D-024), 43,679,032 bytes. Its config and Lua
#   hash equal to the spike's copies from upstream's v3.0.0 tag (commit
#   67c3b45b), and its style and fonts are byte-identical to them. Only the
#   listed members are extracted: not tilemaker's source, not the 64 MB CJK
#   fonts.
# - MapLibre GL JS 6.11.2's dist.zip from its GitHub release: the sha256
#   equals GitHub's own asset digest. Four of its fifteen files are used.
# - pmtiles.js 4.5.0 from npm: the tarball's sha512 equals the registry's
#   integrity field.
# - OSM Bright's sprite from its gh-pages branch at commit 286b174a
#   (2026-08-04): byte-identical to the spike's copies.
# - Natural Earth's ocean, urban areas, glaciers and Antarctic ice shelves at
#   the v5.1.2 tag's commit, the same commit country-boundaries pins. The
#   three land layers are byte-identical to naciscdn's zips the spike used.
#   The ocean stands in for osmdata.openstreetmap.de's water polygons, which
#   are rebuilt daily with no checksum (the simplified set changed size
#   between 2026-09-29 and 2026-09-30), so cannot be pinned.
