name: ax25mail-utils
version: "0.15"
summary: Utilities for exchanging mail with an FBB packet BBS
categories: [packet, emcomm]

after: [ax25-tools]

install:
  - install:
      method: apt
      packages: [ax25mail-utils]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Command-line tools for forwarding mail to and from an FBB-style packet
    bulletin board: connecting, exchanging message lists, transferring what is
    new in each direction, and handling the compressed forwarding protocols
    those systems use.
  why_you_want_it: >-
    Packet BBS forwarding is how mail moved around amateur networks before
    Winlink, and it still moves in places where it never stopped. If you are
    interoperating with an FBB system -- most of the surviving packet BBS
    network -- these are the tools that speak its language.
  prerequisites: >-
    A configured AX.25 port and a BBS to forward with, which means an agreement
    with its operator: forwarding is a two-sided arrangement, not something you
    switch on. Note that `fbb`, the BBS itself, is NOT in Debian 13, Kali or
    Parrot -- only Ubuntu 26.04 and Mint carry it (measured 2026-08-28) -- so on
    the primary target these utilities talk to somebody else's BBS.
  known_problems: >-
    The absence of `fbb` from the Debian line is the surprise here and it is
    the opposite of the usual direction. Forwarding protocols are old, lightly
    documented and unforgiving of configuration errors, and a mis-set
    forwarding schedule can flood a slow RF link.
  upstream_url: https://sourceforge.net/projects/ax25mail/
  upstream_support: SourceForge project page at the URL above.
