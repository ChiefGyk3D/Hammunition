name: hammunition-tray
version: "0.5.0"
summary: KDE Plasma tray switches for parking and waking radio devices — the Hammunition family's own
categories: [device-support]

# A Plasma applet, and its .deb depends on plasma-workspace: on a machine with
# no Plasma session it is deferred from a profile and refused by name rather
# than pulling the whole Plasma shell onto an Xfce or LXQt machine (D-060).
# The same switch for the other panels is hammunition-tray-qt, from the same
# repository and release.
desktops: [kde]
desktop_alternative: hammunition-tray-qt

# ADD. Like hammunition-hill and skid-finder, a unit whose upstream is this
# project's own maintainer, disclosed here: a separate repository (GPL-3.0),
# its own release process and tests, carried on the same terms as everything
# else -- a published, digest-pinned artifact, measured before it was written
# down.
#
# 0.5.0 is the first release that carries the device helper (D-056), and its
# release workflow had not published the .deb assets when this was pinned (the
# Parrot mirror it builds in answered 502), so this pins the tag's source
# archive instead and places its files the way the .deb would have: the
# Plasma applet under /usr/share/plasma/plasmoids/ and its icon under
# /usr/share/icons/hicolor/. Measured 2026-10-02: tag v0.5.0 is the annotated
# tag whose commit is b49e342b4c6883f6de061c5e6d66946ea53bdf8f
# (`git ls-remote`); the archive's digest below is what sha256sum printed on
# two separate downloads and what the engine's fetcher verified on a third;
# 190444 bytes, one top-level directory. When the release publishes its .deb
# and SHA256SUMS this unit can go back to the .deb and the `placements` go.
#
# `depends` is what the .deb's Depends line was (plasma-workspace (>= 4:6) and
# the three QML modules the applet imports, each measured on Parrot 7.3 as the
# package shipping a module the applet loads), because installing from the
# archive no longer has apt to pull them in.
depends: [plasma-workspace, qml6-module-org-kde-plasma-plasma5support, qml6-module-org-kde-kirigami, qml6-module-org-kde-notifications, pkexec]

install:
  - install:
      method: binary
      artifact:
        url: https://github.com/ChiefGyk3D/hammunition-tray/archive/refs/tags/v0.5.0.tar.gz
        sha256: 614148fb4241e88ca007885d01ef97d0752c8cd47b6e57337e2ee12ab3bfc438
      format: tarball
      placement_dirs:
        - /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices
      placements:
        - source: plasmoid/package/contents/config/config.qml
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/config/config.qml
        - source: plasmoid/package/contents/config/main.xml
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/config/main.xml
        - source: plasmoid/package/contents/icons/hammunition-devices-awake.svg
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/icons/hammunition-devices-awake.svg
        - source: plasmoid/package/contents/icons/hammunition-devices-parked.svg
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/icons/hammunition-devices-parked.svg
        - source: plasmoid/package/contents/ui/CompactRepresentation.qml
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/ui/CompactRepresentation.qml
        - source: plasmoid/package/contents/ui/FullRepresentation.qml
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/ui/FullRepresentation.qml
        - source: plasmoid/package/contents/ui/configGeneral.qml
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/ui/configGeneral.qml
        - source: plasmoid/package/contents/ui/controlslogic.js
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/ui/controlslogic.js
        - source: plasmoid/package/contents/ui/main.qml
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/ui/main.qml
        - source: plasmoid/package/contents/ui/timelogic.js
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/contents/ui/timelogic.js
        - source: plasmoid/package/metadata.json
          dest: /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices/metadata.json
        - source: plasmoid/package/contents/icons/hammunition-devices-awake.svg
          dest: /usr/share/icons/hicolor/scalable/apps/hammunition-devices.svg
      devctl_helper:
        modules:
          - __init__.py
          - __main__.py
          - bus.py
          - datafiles.py
          - devctl.py
          - devices.py
          - linger.py
          - polkit.py
          - power.py
          - radio.py
          - rootfiles.py
          - run.py
          - services.py
    note: >-
      Spreads the applet over /usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices
      and its icon into /usr/share/icons/hicolor (each file printed in the plan),
      and installs the device helper the switches call: the code under
      /usr/local/lib/hammunition-devctl, the wrapper at
      /usr/local/libexec/hammunition-devctl and the polkit action (the plan
      names the interpreter the wrapper runs as root, and says when another
      installer's helper is already there and is left alone). The applet runs
      nothing as root itself. Whether Plasma lists an applet placed this way
      without a .deb is unmeasured: a bench item, not yet run.

# THE HELPER (D-056, amended 2026-10-02). The privileged helper lives in this
# release's archive (`devctl/`, contract 1: `docs/contract.md` at the tag) and
# the `devctl_helper` block installs it the way the tray's own
# `install.sh --helper-only --interpreter` does, from the same archive: the
# code copied to /usr/local/lib/hammunition-devctl (root never runs the unpack),
# the /bin/sh wrapper at /usr/local/libexec/hammunition-devctl with the
# engine's own venv interpreter baked in (the helper's `time` verbs import the
# engine), and the polkit action. All of it is printed in the plan, asked once
# at the keyboard when the engine's venv belongs to one account (never by
# `--yes`) and refused when any account can write it, read back with
# `--version`, and removed by `uninstall` on the log's say-so, and only when no
# other tray unit still needs it. It is NOT a catalog `config_files` entry:
# the wrapper bakes in an interpreter a catalog file cannot name, and a file a
# package owns is never written over (nor is any placed file: the plan
# refuses, naming the package, where a .deb such as 0.4.0 still owns them). A helper
# that already answers contract 1 (the `hammunition-devctl` .deb, the tray's
# installer) is left alone and the plan says whose it is; one this engine
# installed earlier is refreshed to this pin. This unit and its Qt sibling
# carry the same block, so either installs the helper for both.

update:
  probe:
    method: github_release
    repo: ChiefGyk3D/hammunition-tray
  strategy: reinstall
  cadence_hint: >-
    Tagged releases with a .deb and SHA256SUMS attached to each. A release is
    a new digest; re-pin both. The v0.5.0 release's .deb assets were not published when
    this was pinned, so the pin is the tag's own source archive.

documentation:
  what_it_does: >-
    A KDE Plasma applet that puts a switch in the system tray for each
    catalogued device Hammunition can park that is plugged in -- a GPS
    receiver, a cellular modem, a Bluetooth controller or a camera. Turning a
    switch off detaches the device so the kernel drops it and its port can
    suspend; turning it on brings it back. Beside the devices it has a
    Services group (the GPS daemon, the clock, the GPS tether, the rig
    service: a running switch and a start-at-login box each) and a Radios
    group (mobile broadband, Wi-Fi, Bluetooth), the Controls panel. The tray icon is a penguin holding a handheld radio, and goes grey
    while anything is parked. A Time section (D-058, needs Hammunition 0.18.0
    or later) shows what the clock follows and lets you choose one of the
    four GPS-time modes.
  why_you_want_it: >-
    Parking a GPS or a modem you are not using saves battery on a field
    laptop, and doing it from the tray is one click and one password prompt
    rather than a command line. It is a front end for `hammunition hardware
    park` and `wake` and `hammunition services` (D-056), so it does exactly
    what those do and nothing else; docs/guides/tray-controls.md says which
    switch asks for a password.
  prerequisites: >-
    KDE Plasma 6. This unit installs the device helper and the polkit action
    the switches call (from the same release archive, D-056); the device and
    service lists it reads are written by `hammunition hardware apply`, which
    also hands over to this helper rather than writing its own. Without the
    lists the applet shows no switches; without the helper it says "Device
    control is not installed". A device only gets a switch when its catalog
    entry carries a power_control block and it is plugged in. The helper runs
    as root through the engine's own Python, so the engine's virtualenv must not
    be writable by any account but its owner: the install asks one `yes` that
    `--yes` cannot answer when it belongs to one account, and refuses when any
    account can write it.
  known_problems: >-
    **KDE only.** On a machine with no Plasma session, `station` defers it
    by name and installs the rest, and `hammunition install
    hammunition-tray` refuses, so a lightweight desktop is never handed the
    Plasma shell (D-060, docs/desktops.md). hammunition-tray-qt is the same switch
    for Xfce, LXQt, LXDE, MATE and Cinnamon; GNOME and COSMIC have none yet. Plasma
    keeps the old version of an applet loaded after an install or upgrade
    until `systemctl --user restart plasma-plasmashell` or a new login. A
    per-user copy installed from the repository's own install.sh
    (~/.local/share/plasma/plasmoids) shadows this system-wide one; run that
    repository's uninstall.sh once after switching to this package. After
    installing, add *Hammunition Devices* to the panel or set it to shown in
    the System Tray's settings: nothing places it for you.
  upstream_url: https://github.com/ChiefGyk3D/hammunition-tray
  upstream_support: >-
    Issues on the GitHub repository. For "the switch does nothing", run
    `hammunition hardware state` first: the applet shows what that command
    reports.
  offline: >-
    Entirely local: no internet and no local network. The switches call a root
    helper through polkit on this machine, so a polkit authentication agent must
    be running in your session, and `hammunition hardware apply` must already
    have written the device and service lists. The Radios group switches mobile
    broadband, Wi-Fi and Bluetooth off and on; turning one off is what cuts that
    connectivity, so do it on purpose and not before you need a link. The GPS
    and modem switches save power while the device is not in use.
  first_task: >-
    Run `hammunition hardware apply --dry-run`, read it, then `hammunition
    hardware apply`. Add the *Hammunition Devices* applet to the panel or the
    System Tray's shown items (nothing places it for you). With a catalogued
    parkable device plugged in, its switch appears; turning it off and on again
    parks and wakes it, with one password prompt. `hammunition hardware state`
    shows the same state in a terminal; docs/guides/tray-controls.md says which
    switch asks for a password.
