name: hammunition-tray
version: "0.4.0"
summary: KDE Plasma tray switches for parking and waking radio devices — the Hammunition family's own
categories: [device-support]

# A Plasma applet, and its .deb depends on plasma-workspace: on a machine with
# no Plasma session it is deferred from a profile and refused by name rather
# than pulling the whole Plasma shell onto an Xfce or LXQt machine (D-060).
# The same switch for the other panels is hammunition-tray-qt, from the same
# repository and release.
desktops: [kde]
desktop_alternative: hammunition-tray-qt

# ADD. Like hammunition-hill and skid-finder, a unit whose upstream is this
# project's own maintainer, disclosed here: a separate repository (GPL-3.0),
# its own release process and tests, carried on the same terms as everything
# else -- a published, digest-pinned artifact, measured before it was written
# down.
#
# Upstream publishes an arch-independent .deb per release beside SHA256SUMS.
# Fetched from the v0.4.0 release on 2026-10-01: the digest below is what
# sha256sum printed for the downloaded file and what SHA256SUMS lists for it
# (15270 bytes). `dpkg-deb -f` gave Package hammunition-tray, Version 0.4.0,
# Architecture all, Depends plasma-workspace (>= 4:6),
# qml6-module-org-kde-plasma-plasma5support, qml6-module-org-kde-kirigami,
# qml6-module-org-kde-notifications -- unchanged from 0.3.0, each measured on
# Parrot 7.3 as the package shipping a QML module the applet imports. 0.4.0
# adds the Time section (D-058): what the clock follows and the four modes,
# read without a password and changed through one polkit prompt to
# hammunition-devctl. The release workflow installed and removed this exact
# .deb in a docker.io/parrotsec/core container before publishing it.
install:
  - install:
      method: binary
      artifact:
        url: https://github.com/ChiefGyk3D/hammunition-tray/releases/download/v0.4.0/hammunition-tray_0.4.0_all.deb
        sha256: 451bea9322376dbb9cd00834834f96e0f5d5ce487735d5fbe2349e2ae41e97bd
      format: deb
      deb_package: hammunition-tray
    note: >-
      Installs the applet system-wide under /usr/share/plasma/plasmoids and its
      icon under /usr/share/icons/hicolor. It runs nothing as root itself; it
      calls the helper, which `hammunition hardware apply` installs until a tray
      release carries it (the `hammunition-devctl` .deb, added to this unit at the
      re-pin; see the comment below) and which reads the lists that command writes.

# D-056, amended 2026-10-02: the privileged helper now lives in hammunition-tray,
# and its wrapper and polkit action are the tray repository's to install: from a
# checkout with `install.sh`, or from the `hammunition-devctl` .deb the tray's
# release is to carry, whose postinst writes the wrapper and which owns the
# polkit file. THIS UNIT DECLARES NO `config_files` FOR EITHER, and must not:
#   - the wrapper bakes in an interpreter (the engine's venv, so the helper's
#     `time` verbs can import the engine), which a catalog file cannot name;
#   - the polkit file is dpkg-owned in the deb route, and a catalog write over a
#     package's file is the clash `hardware apply` avoids by its hand-over;
#   - written against this v0.4.0 pin, which ships no helper, it would replace a
#     working helper with one that exits 2 (review of this change, Critical).
# At the re-pin to the tray release that ships the helper, the unit gains the
# `hammunition-devctl` .deb as an install step (a binary deb, hash-pinned like
# this one), disclosed in the plan like any other; tests/test_tray_unit_files.py
# holds the absence until then.

update:
  probe:
    method: github_release
    repo: ChiefGyk3D/hammunition-tray
  strategy: reinstall
  cadence_hint: >-
    Tagged releases with a .deb and SHA256SUMS attached to each. A release is
    a new digest; re-pin both.

documentation:
  what_it_does: >-
    A KDE Plasma applet that puts a switch in the system tray for each
    catalogued device Hammunition can park -- a GPS receiver today, a WWAN
    modem when one is catalogued. Turning a switch off detaches the device
    so the kernel drops it and its port can suspend; turning it on brings it
    back. The tray icon is a penguin holding a handheld radio, and goes grey
    while anything is parked. A Time section (D-058, needs Hammunition 0.18.0
    or later) shows what the clock follows and lets you choose one of the
    four GPS-time modes.
  why_you_want_it: >-
    Parking a GPS or a modem you are not using saves battery on a field
    laptop, and doing it from the tray is one click and one password prompt
    rather than a command line. It is a front end for `hammunition hardware
    park` and `wake` (D-056), so it does exactly what those do and nothing
    else.
  prerequisites: >-
    KDE Plasma 6. `hammunition hardware apply` must have been run: it installs the
    root helper and the polkit action the switches call (the helper is moving
    to hammunition-tray, whose own release will install it), and writes the device and service lists it reads. Without them the
    applet says "Device control is not installed" instead of showing
    switches. A device only gets a switch when its catalog entry carries a
    power_control block and it is plugged in.
  known_problems: >-
    **KDE only.** On a machine with no Plasma session, `station` defers it
    by name and installs the rest, and `hammunition install
    hammunition-tray` refuses, so a lightweight desktop is never handed the
    Plasma shell (D-060, docs/desktops.md). hammunition-tray-qt is the same switch
    for Xfce, LXQt, LXDE, MATE and Cinnamon; GNOME and COSMIC have none yet. Plasma
    keeps the old version of an applet loaded after an install or upgrade
    until `systemctl --user restart plasma-plasmashell` or a new login. A
    per-user copy installed from the repository's own install.sh
    (~/.local/share/plasma/plasmoids) shadows this system-wide one; run that
    repository's uninstall.sh once after switching to this package. After
    installing, add *Hammunition Devices* to the panel or set it to shown in
    the System Tray's settings: nothing places it for you.
  upstream_url: https://github.com/ChiefGyk3D/hammunition-tray
  upstream_support: >-
    Issues on the GitHub repository. For "the switch does nothing", run
    `hammunition hardware state` first: the applet shows what that command
    reports.
