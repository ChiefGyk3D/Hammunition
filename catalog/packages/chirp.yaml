name: chirp
version: "20250530"
summary: Reads, edits and writes the memory channels of hundreds of radios
categories: [radio-programming, rig-control]

# SUPERSEDE, per docs/reference/dispositions.md #2: AHRL carries `owx`, Open
# Wouxun, a 2022-dated source build supporting one manufacturer. CHIRP supports
# that hardware and several hundred other models, is actively released, and is
# packaged. If superseded, owx's compiler-flag fragility stops mattering.
supersedes: [owx]

install:
  - install:
      method: apt
      packages: [chirp]
    note: >-
      AHRL installs a bundled wheel with `pipx install --system-site-packages`
      run as the user through pkexec, then generates a `run_chirp` wrapper
      because pipx installs into the user's home (inventory unit 84). Debian
      packages it, so this is apt -- and it is one of the few packages in this
      catalog where Parrot differs from Debian: Parrot carries a patched
      1:20250530-1parrot1 against Debian 13's 1:20250502-1, with Ubuntu and
      Kali on 1:20251108-1 and Mint on 1:20240224-1 (measured 2026-08-28).
      CHIRP is versioned by release date, so those gaps are months of radio
      support.

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade
  cadence_hint: >-
    Upstream releases continuously and versions by date. New radio models
    appear in new builds and nowhere else, so a radio that is not in the list
    is often a matter of the version rather than of support.

documentation:
  what_it_does: >-
    Reads the memory image out of a handheld or mobile transceiver over its
    programming cable, presents the channels as a spreadsheet -- frequency,
    tone, offset, name, power -- lets you edit them, and writes the image back.
    It also imports from other radios, from CSV, and from online repeater
    directories.
  why_you_want_it: >-
    Programming a modern handheld from its own keypad is genuinely awful, and
    the manufacturer software is Windows-only, per-model, and frequently worse.
    CHIRP does every common radio from one interface, and it lets you keep a
    channel list as a file that can be edited, versioned and copied to the next
    radio. For anyone with more than one radio it is not optional.
  prerequisites: >-
    The right programming cable, and access to its serial device -- the
    `dialout` group. Many cheap cables use counterfeit chips; see below.
  known_problems: >-
    Counterfeit Prolific and FTDI cables are the dominant problem in this whole
    area. A cable may enumerate, appear in `dmesg`, and still fail to
    communicate, because the driver detects the clone and refuses. Buy from a
    known source. Always download from the radio before uploading to it: the
    downloaded image is your only backup, and a wrong model selection can write
    an image the radio cannot boot from. Some radios are known to CHIRP only in
    a development build, which is why the version spread across targets matters.
  upstream_url: https://chirpmyradio.com/
  upstream_support: >-
    The CHIRP project. Its own site carries per-model instructions, which are
    the answer to most "does it support my radio" questions.
