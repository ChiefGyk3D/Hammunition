name: cw
version: "3.6.1"
summary: Sounds text as Morse from the command line — the unixcw core tool
categories: [cw, training]

install:
  - install:
      method: apt
      packages: [cw]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Reads text on standard input and sounds it as Morse, with speed, tone,
    volume and spacing set by option or by embedded commands in the text
    itself. It also ships cwgen, which produces random practice groups to feed
    it. Output goes to the console beeper, OSS, ALSA or PulseAudio.
  why_you_want_it: >-
    It is the piece that makes Morse practice scriptable. Anything that can
    write to a pipe can send Morse: a callsign list, a news feed, the output of
    another program. The three unixcw front ends — this, cwcp and xcwcp — share
    one engine, so what you learn about timing here applies to all of them.
  prerequisites: >-
    A sound device. On a machine with PulseAudio or PipeWire the default
    usually works; otherwise select the device explicitly with -d.
  known_problems: >-
    The console-beeper output needs privileges most desktops no longer grant
    and is not the sensible default on modern systems — use ALSA or
    PulseAudio. Being a soft timing source, it can stutter under heavy load in
    a way a hardware keyer would not; that is an artefact of the machine, not
    of your copy.
  upstream_url: https://unixcw.sourceforge.net/
  upstream_support: >-
    The unixcw project on SourceForge. Debian packages cw, cwcp and xcwcp from
    this one source, so a bug in the timing engine affects all three.
