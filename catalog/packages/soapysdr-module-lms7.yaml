name: soapysdr-module-lms7
version: "23.11.0"
summary: SoapySDR driver module for LimeSDR (LMS7002M) hardware
categories: [sdr, hardware]

install:
  - install:
      method: apt
      packages: [soapysdr-module-lms7]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    A plugin for SoapySDR that makes LimeSDR USB, Mini and XTRX boards usable
    through the generic SoapySDR interface, built against the classic LimeSuite
    library.
  why_you_want_it: >-
    It is what lets one program drive many different radios. Software written
    against SoapySDR reaches LimeSDR hardware through this module rather than
    through a Lime-specific code path, so installing it is usually the
    difference between an application listing your radio and showing an empty
    device list.
  prerequisites: >-
    LimeSDR hardware and limesuite. The `limesdr` hardware entry carries
    three identifiers confirmed from Debian's own 64-limesuite.rules (closed
    2026-08-26 without hardware — the maintainer still owns none), so udev
    rules for it can be generated from the catalog.
  known_problems: >-
    Built against LimeSuite 23.11, which every target still ships while upstream
    has moved to LimeSuiteNG. The two are not interchangeable, and a module and
    its library must match: a mismatch shows up as a device that is not listed
    rather than as an error. `SoapySDRUtil --info` reports which modules loaded
    and is the first thing to check.
  upstream_url: https://github.com/myriadrf/LimeSuite
