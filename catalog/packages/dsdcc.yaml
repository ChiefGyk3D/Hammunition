name: dsdcc
version: "1.9.3"
summary: Decodes digital voice protocols from demodulated audio
categories: [listening, sdr]

install:
  - install:
      method: apt
      packages: [dsdcc]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Takes discriminator or demodulated audio and decodes the digital voice
    protocols carried in it -- DMR, D-STAR, System Fusion, NXDN, P25 Phase 1
    and dPMR -- recovering both the voice frames and the signalling around
    them: talkgroups, source and destination identifiers, colour codes.
    It is a C++ rewrite of the original DSD.
  why_you_want_it: >-
    Amateur digital voice is several incompatible standards and a receiver
    hears all of them as noise without something like this. For monitoring a
    DMR repeater's talkgroup activity, or identifying which protocol an
    unfamiliar signal is using, it is the tool that turns the transmission into
    something a person can act on.
  prerequisites: >-
    Demodulated audio at the right level, usually piped from an SDR receiver
    or taken from a scanner's discriminator output. Level and polarity both
    matter and neither is obvious.
  known_problems: >-
    The AMBE and AMBE+2 vocoders used by D-STAR, DMR and Fusion are patented
    and proprietary; this decodes the protocol layer, and the voice quality of
    open replacement vocoders is noticeably worse than a commercial radio's.
    Encrypted transmissions decode to the fact that they are encrypted and
    nothing more -- that is by design and is not a bug to report. Listening to
    what you may lawfully listen to is jurisdiction-dependent and is yours to
    know.
  upstream_url: https://github.com/f4exb/dsdcc
  upstream_support: >-
    Edouard Griffiths, F4EXB -- the SDRangel author. GitHub issues at the URL
    above.
