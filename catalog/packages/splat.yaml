name: splat
version: "1.4.2"
summary: Terrain-aware path analysis for VHF and above, from real elevation data
categories: [hf-propagation, antenna]

install:
  - install:
      method: apt
      packages: [splat]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Analyses a point-to-point radio path across real terrain: it reads
    elevation data, draws the terrain profile between two sites with the
    Fresnel zone over it, and reports path loss using the Longley-Rice
    irregular terrain model. It will also produce coverage maps showing the
    area a transmitter reaches from a given height and power.
  why_you_want_it: >-
    Above about 30 MHz the question is line of sight and what is in the way,
    and that is a terrain problem rather than a propagation one. Before
    putting a repeater on a hill, planning a microwave link, or arguing about
    whether a mast needs another six metres, this answers it from data rather
    than from optimism.
  prerequisites: >-
    Elevation data -- SRTM tiles for the region of interest, converted to
    SPLAT's own SDF format with the tools it ships. That download is the real
    setup cost and is not automated here, because which tiles you need depends
    on where you are. gnuplot, which the package depends on, draws the
    profiles.
  known_problems: >-
    Without SDF terrain files it will run and assume a flat earth, which
    produces plausible output that is worthless -- the failure mode is a
    confident answer, not an error. Longley-Rice is a statistical model
    calibrated for particular frequency and distance ranges; using it far
    outside them gives numbers that look precise and are not. Buildings and
    trees are not in SRTM data, so an urban path will read better than reality.
  upstream_url: http://www.qsl.net/kd2bd/splat.html
  upstream_support: >-
    John Magliacane, KD2BD. The project page carries the manual, which is
    unusually good and explains the model rather than just the flags.
