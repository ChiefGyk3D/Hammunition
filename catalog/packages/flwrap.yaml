name: flwrap
version: "1.3.6"
summary: Wraps a file with a checksum so the far end knows it arrived intact
categories: [digital-modes, nbems, emcomm]

after: [fldigi]

install:
  - install:
      method: apt
      packages: [flwrap]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Takes a file, compresses it, adds a header with the filename and a checksum
    over the contents, and produces a text block that can be sent through any
    digital mode as if it were typed. At the far end it verifies the checksum
    and writes the file back out with its original name.
  why_you_want_it: >-
    A file sent as text through a keyboard mode arrives as text, and there is
    no way to tell a clean copy from one with three characters wrong. The
    checksum is the whole point: it converts "it looked all right" into a yes
    or a no. It is the simplest of the NBEMS tools and the one to use when
    flamp's block-fill machinery is more than the job needs.
  prerequisites: >-
    fldigi or any other mode capable of sending text. Unlike flamp it does not
    drive the modem itself -- you paste or send the wrapped block yourself.
  known_problems: >-
    There is no fill mechanism. A wrapped file with one bad character fails its
    checksum and the whole thing is resent; for anything large over a marginal
    path, flamp is the right tool instead. The compression means a corrupted
    block usually fails to decompress rather than producing subtly wrong
    output, which is the safe failure but an opaque one.

    Debian's Homepage field for this package points at w1hkj.com, which no
    longer serves the project. Corrected 2026-08-29 after re-checking: it does
    still resolve, and both it and www.w1hkj.com 301-redirect to
    kylegentz.com, **which has no DNS record at all** — so the chain ends
    nowhere. The subpaths Debian cites return 404 on the way. An earlier note
    here said the redirect landed on "an unrelated site"; that was read from an
    empty response and the accurate statement is that the target does not
    exist. Either way the packaged link is useless, and the live project is
    w1hkj.org, which is what this manifest points at.
  upstream_url: https://w1hkj.org/flwrap-help/
  upstream_support: The W1HKJ suite -- linuxham on groups.io.
