name: gr-osmosdr
version: "0.2.6"
summary: One GNU Radio source block that speaks to nearly every SDR
categories: [sdr, hardware]

depends: [gnuradio]

install:
  - install:
      method: apt
      packages: [gr-osmosdr]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Provides a single GNU Radio source and sink pair that talks to RTL-SDR,
    HackRF, Airspy, bladeRF, SDRplay, USRP, FunCube and several others, all
    behind one device-string interface. Change the string, not the flow graph.
  why_you_want_it: >-
    Without it, every SDR needs its own source block and every flow graph is
    tied to the hardware it was drawn for. This is why a flow graph downloaded
    from someone with a HackRF runs on your RTL-SDR. It is also what gqrx and
    a good deal of other software use underneath.
  prerequisites: >-
    GNU Radio, and the driver library for whatever hardware you have -- this
    is a shim over those libraries, not a replacement for them.
  known_problems: >-
    Which devices are actually supported depends on which driver libraries
    were present when the package was built, and an unsupported device fails
    to open with a message about the device string rather than about the
    missing driver. Development upstream has been slow, and SoapySDR is the
    newer answer to the same problem -- both are carried here because software
    in the wild uses both.
  upstream_url: https://osmocom.org/projects/gr-osmosdr/wiki
  upstream_support: The Osmocom project.
