name: nec2c
version: "1.3.1"
summary: The NEC2 antenna modelling engine as a C program, for scripting
categories: [antenna]

install:
  - install:
      method: apt
      packages: [nec2c]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    A translation of the original Fortran NEC2 into C. It reads a NEC input
    file and writes the output file: patterns, impedances, currents. No
    interface, no plots -- input in, numbers out.
  why_you_want_it: >-
    Because it is scriptable. Sweeping a dimension across fifty values and
    plotting gain against it is a shell loop with this and a graph program,
    and it is not something an interactive modeller does well. It is also the
    engine to reach for when the modelling is part of a larger pipeline rather
    than a session at a screen.
  prerequisites: >-
    A NEC input file, and something to read the output with. If you want to
    look at a pattern rather than compute over it, use xnec2c instead.
  known_problems: >-
    The same NEC2 modelling rules apply and nothing here enforces them -- a
    segmentation error yields plausible numbers. The output format is the
    original fixed-column Fortran layout, which is parseable but not pleasant,
    and is the main cost of scripting against it.
  upstream_url: https://www.qsl.net/5b4az/
  upstream_support: >-
    Neoklis Kyriazis, 5B4AZ. The site above carries the source and notes; there
    is no issue tracker.
