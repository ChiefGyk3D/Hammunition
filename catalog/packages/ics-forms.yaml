update:
  probe:
    method: none
  strategy: reinstall
  cadence_hint: >-
    FEMA revises the forms rarely (version 3 dates from 2018, 3.1 of some
    forms later). When the list changes, re-fetch every PDF twice, compare,
    and replace the artifacts with the new URLs, digests and sizes.

documentation:
  what_it_does: >-
    Installs the 39 fillable PDF forms of the Incident Command System, as
    FEMA publishes them, under /usr/local/share/hammunition/data/ics-forms/:
    the 201 incident briefing, the 205 incident radio communications plan
    and 205A communications list, the 213 general message, the 214 activity
    log and the rest, with FEMA's
    instructions and the NIMS forms booklet. `hammunition reference serve`
    lists them on its page.
  why_you_want_it: >-
    A radio operator serving an agency is handed ICS paperwork: the 205 is
    the communications plan, the 213 the message form, the 214 the log.
    Having the blank forms and FEMA's instructions on the laptop means
    filling them in, or printing them, with no network. Winlink users have
    ICS-213 and friends inside pat's forms already; these are the originals
    for everything else.
  prerequisites: >-
    A PDF reader that can fill in forms, or a printer.
  known_problems: >-
    FEMA publishes no checksum, so each file is checked against a digest
    Hammunition measured; if FEMA revises a form, the install refuses it
    until the catalog is re-measured. The files keep their own names only
    in slug form (ics-205-incident-radio-communications-plan-v3.1.pdf). The
    ICS 309 communications log many nets use is not among the 39 PDFs FEMA
    lists, so it is not installed.
  upstream_url: https://training.fema.gov/emiweb/is/icsresource/icsforms/
  upstream_support: >-
    FEMA's Emergency Management Institute, which maintains the ICS Resource
    Center (https://training.fema.gov/emiweb/is/icsresource/).
