name: ics-forms
version: "2026-09-29"
summary: FEMA's 39 fillable ICS forms, 205 radio communications plan and 213 general message among them
categories: [references, emcomm]

# D-065. Every PDF the ICS Resource Center lists under ICS Forms
# (https://training.fema.gov/emiweb/is/icsresource/icsforms/), 8,046,865
# bytes in all. FEMA publishes no checksum, no signature and no archive, so
# each sha256 below is Hammunition's own: all 39 were fetched twice on
# 2026-09-29 and were byte-identical both times, and the 205's digest matches
# the spike's separate download of the same day. The files are static (the
# 205 was last modified 2022-02-23). Both published versions of the 221 are
# kept, as FEMA lists both. The URLs are FEMA's own, spaces percent-encoded
# and the double slash in its path kept, since that is the path it serves.
# Where one changes, the fetch refuses on the digest; re-measure and bump
# `version`. The weekly artifact-URL review asks each URL.
