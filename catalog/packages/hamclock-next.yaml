name: hamclock-next
version: "1.5"
summary: Maintained SDL2 rewrite of HamClock — grey line, propagation, DX cluster
categories: [hf-propagation]

# SHAPE 7 — the launcher needs a configurable service endpoint.
#
# HamClock's author, Elwood Downey (WB0OEW), became a Silent Key on 2026-01-29.
# Three secondary sources reported that HamClock would stop functioning at the
# end of June 2026. **We tested it and that is wrong** (D-018): hamclock.com
# serves version 4.27 with an active changelog. Only clearskyinstitute.com,
# Elwood's own host, refuses TCP.
#
# AHRL v27 (May 2026) builds the original four times and hardcodes
# `-b hamclock.com:80` into every generated launcher, so repointing an install
# at a different backend means editing four generated scripts.
#
# Here the backend is a manifest field. Repointing every install is a one-line
# catalog change. See D-013 and reference/licence-verification.md.
supersedes: [esphamclock]

install:
  - install:
      method: source
      source:
        url: https://github.com/k4drw/hamclock-next/archive/refs/tags/v1.5.tar.gz
        sha256: 1e4b79cb7e1544e965b193fd9b1586438f96a8f0b5f808cddad2cc147467e4be
      build_system: cmake
    build_depends:
      - libsdl2-dev
      - libsdl2-ttf-dev
      - libsdl2-image-dev
      - libcurl4-openssl-dev
      - libsqlite3-dev
      - cmake
      - build-essential

binaries:
  - produced: hamclock-next
    install_as: hamclock-next

service_endpoints:
  - name: backend
    default_url: https://ohb.works
    description: >-
      Data backend supplying solar indices, DX cluster spots, and propagation
      data. Defaults to the Open HamClock Backend, a community-run alternative
      to hamclock.com.
    user_configurable: true
    note: >-
      hamclock.com is live and serving version 4.27, tested 2026-08-25 — the
      widely reported June 2026 shutdown did not happen. It is now run by a
      third party and funded by patron subscriptions, which is why it is not the
      default here: a community backend is a better default for software we
      install on someone's behalf. Both work. If you run your own, point this
      at it. Which backend should be the default is Q-006, still open.

launchers:
  - name: hamclock-next
    exec: hamclock-next --backend {endpoint:backend}
    terminal: false

update:
  probe:
    method: github_release
    repo: k4drw/hamclock-next
  strategy: rebuild

documentation:
  what_it_does: >-
    Displays a live world map with the grey line, solar and geomagnetic indices,
    satellite passes, DX cluster spots and band-condition predictions, either
    full-screen on a dedicated display or in a window.
  why_you_want_it: >-
    It is the at-a-glance station dashboard for deciding which band to work, and
    it is one of two maintained continuations of HamClock, whose author became a
    Silent Key in January 2026. The other is OpenHamClock, which has the larger
    community; which should be the recommended default is Q-006.
  prerequisites: >-
    A working network connection and a reachable data backend. Set your
    latitude, longitude and callsign on first run.
  known_problems: >-
    Widely reported in mid-2026 to have stopped working after the original
    author's death. Tested 2026-08-25: hamclock.com is up and serving version
    4.27. The host that is gone is clearskyinstitute.com. This manifest defaults
    to the Open HamClock Backend, a community-run alternative, and the endpoint
    is a configurable field rather than a string compiled into a launcher
    script — so switching backends is a one-line change, not a rebuild.
  upstream_url: https://github.com/k4drw/hamclock-next
