name: soapysdr-module-redpitaya
version: "0.1.1"
summary: SoapySDR driver module for Red Pitaya boards used as an SDR
categories: [sdr, hardware]

install:
  - install:
      method: apt
      packages: [soapysdr-module-redpitaya]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Connects over the network to a Red Pitaya running SDR firmware and presents
    it as a SoapySDR device, so ordinary SDR software can receive and transmit
    through it.
  why_you_want_it: >-
    A Red Pitaya is a fast dual-channel ADC and DAC with an FPGA and a Linux
    system on one board, and with the right firmware it is a capable HF
    transceiver. This is how the rest of the SDR ecosystem reaches one instead
    of being limited to the board's own web applications.
  prerequisites: >-
    A Red Pitaya with SDR firmware loaded -- the stock image is a laboratory
    instrument, not a radio, and the SDR image is a separate thing you install
    on its SD card. Network reachability to the board.
  known_problems: >-
    Which SDR firmware is loaded determines what actually works, and a board
    running the wrong image simply does not answer. Sample rate over the
    network is bounded by the link. The maintainer does not own this hardware
    (D-027).
  upstream_url: https://github.com/pothosware/SoapyRedPitaya/wiki
  upstream_support: The Pothosware project.
