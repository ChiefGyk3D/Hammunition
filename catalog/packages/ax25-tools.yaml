name: ax25-tools
version: "0.0.10"
summary: Configures the kernel AX.25 stack — ports, interfaces, NET/ROM, Rose
categories: [packet-terminals]
requires_kernel: [ax25]

install:
  - install:
      method: apt
      packages: [ax25-tools]

# D-050: the unit ships several command-line tools and no desktop entry, so
# `menus apply` could not pick one without guessing. This is the pick: the
# entry an operator opens first. Terminal launchers hold their window.
launchers:
  - name: mheard-stations
    exec: mheard
    title: AX.25 stations heard (mheard)
    terminal: true
    # Who has been heard: the stations mheardd logged on each port. The rest of the unit is per-port configuration (kissattach, axparms, sethdlc) typed at a shell, not opened from a menu

# The line 73Linux appends at install time (D-004 amendment, D-045), written
# the D-035 way. Measured 2026-09-29, not remembered:
#  - /etc/ax25/axports is libax25's conffile (0.0.12-rc5+git20230513, a
#    dependency of ax25-tools), shipped with only its two example lines
#    commented out, so on a fresh install this is the only port.
#  - The format, from that file's header and axports(5): `name callsign speed
#    paclen window description`, one port a line, `#` in the first column a
#    comment.
#  - `wl2k` is the port pat's AX.25 transport uses by default: pat 0.16.0
#    (Parrot's package) writes `"ax25_linux": {"port": "wl2k"}` into a fresh
#    config.json.
#  - libax25's axconfig.c refuses a second port with the same name
#    ("duplicate port name") or the same callsign ("duplicate callsign"),
#    comparing names case-insensitively. So the line is appended only when
#    the file has neither; a re-run finds its own line and changes nothing.
config_files:
  - path: /etc/ax25/axports
    append: true
    template: |
      # wl2k: added by Hammunition from your station values -- the port pat uses.
      wl2k {station.ax25_callsign} 1200 255 7 Winlink
    skip_if_present:
      - '(?i)^\s*wl2k\s'
      - '(?i)^\s*[^#\s]\S*\s+{station.ax25_callsign}(-0)?\s'
    mode: "0644"
    backup_existing: true

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    The administrative half of Linux AX.25: attaches a serial TNC or a KISS
    device to the kernel stack, brings AX.25 interfaces up, configures NET/ROM
    and Rose, and runs the daemons that let inbound connections reach a
    program. It carries kissattach, axparms, mheard, ax25d and the rest.
  why_you_want_it: >-
    Linux has AX.25 in the kernel, which is unusual and genuinely useful --
    packet connections are sockets, so ordinary programs can use them. This is
    what turns that from a compiled-in capability into a working port.
  prerequisites: >-
    A port definition in `/etc/ax25/axports` naming your callsign, the device,
    and the speed. Hammunition appends one, `wl2k <your callsign> 1200 255 7
    Winlink` -- the port pat's AX.25 transport uses by default -- from station
    config (`hammunition station set --callsign <yours>`). Attaching that port
    to Direwolf or a TNC with `kissattach` is still yours to do. With no
    callsign set the package installs and the line is reported as not
    written.
  known_problems: >-
    Linux 7.1 removed the kernel AX.25 stack -- net/ax25, net/netrom, net/rose
    and every driver in drivers/net/hamradio -- in merge 64edfa65 of
    2026-04-24. On a 7.1 or newer kernel there is nothing for kissattach to
    attach to: `socket(AF_AX25)` fails with "Address family not supported by
    protocol", and no modprobe helps because the module does not exist.
    Measured 2026-09-04: Kali rolling (7.1.5) and Pop!_OS 24.04 on its 7.1.5
    kernel lack it; Debian 13 (6.12), Parrot 7.3 (7.0.13), Ubuntu 24.04 (6.8)
    and Ubuntu 26.04 (7.0.0) carry it as a module. Debian removed ax25-tools
    from testing on 2026-09-01 (#1143282) because it no longer builds against
    the headers that left with the subsystem, so Kali's archive lacks the
    package too. Hammunition reads the running kernel's module tree at plan
    time and refuses this unit by name, or defers it out of a profile, on a
    kernel without ax25. The userspace packet path is unaffected: Direwolf's
    KISS and AGW ports serve pat (`ax25+agwpe`), linbpq, YAAC and Xastir
    without kernel AX.25. See `docs/reference/kernel-ax25.md`.
    An unconfigured axports produces failures that name a port rather than
    saying the file is empty, which reads as a hardware problem. The AX.25
    stack has a long history of being lightly maintained in the kernel, and
    some of the more exotic paths -- Rose in particular -- have few users and
    correspondingly few bug reports. A callsign written into axports is
    transmitted; it is the station identity, not a label.
    What the configuration block does: appends the `wl2k` line above to
    `/etc/ax25/axports` (mode 0644), with a comment line naming it as ours.
    It is not appended when the file already has a port named `wl2k` or a
    port on your callsign, because libax25 refuses a second one of either --
    so a re-run changes nothing, and a port you defined yourself is left
    alone. The file as it was is copied first to
    `/etc/ax25/axports.hammunition-backup`, once. The line is written only
    when the callsign is an AX.25 address (one to six letters and digits); a
    callsign such as `W1AW/4` is reported as unusable rather than trimmed.
    On a kernel without ax25 the unit is refused or deferred, and the line
    with it. Inspect with `grep -v '^#' /etc/ax25/axports`.
    `hammunition uninstall ax25-tools` does not remove it (config files are
    not reversed, and the plan says so); to undo, delete the two `wl2k`
    lines with `sudoedit /etc/ax25/axports`, or put the backup back with
    `sudo mv /etc/ax25/axports.hammunition-backup /etc/ax25/axports`.
  upstream_url: https://linux-ax25.in-berlin.de/wiki/Main_Page
  upstream_support: >-
    The linux-ax25 project wiki, which is also the best available
    documentation for the kernel stack itself.
