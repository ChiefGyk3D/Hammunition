name: dmrconfig
version: 1.1+git20230126
summary: Command-line DMR codeplug tool — the text-file approach to the same job
categories: [station, radio-programming, dmr]

install:
  - install:
      method: apt
      packages: [dmrconfig]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Reads a DMR radio's codeplug into a plain text configuration file, and
    writes an edited text file back to the radio. No GUI and no intermediate
    database — the codeplug is a file you edit with an editor.
  why_you_want_it: >-
    It is the version-controllable answer to codeplug management. A text
    codeplug can live in git, diff between revisions, and be generated by a
    script from a contact list, none of which a binary blob or a GUI database
    supports. It is an alternative to qdmr rather than a companion: qdmr is
    better if you want to see the radio's structure, dmrconfig is better if you
    want to treat the codeplug as source.
  prerequisites: >-
    A radio in the right mode and access to its USB device. See the
    `dmr-radio` hardware class, and read its note about the permissions this
    package's own udev rule sets.
  known_problems: >-
    Its shipped udev rule sets `MODE="666"` on the matching USB devices —
    world-readable and world-writable, by any user on the machine, with no group
    involved. qdmr's rule for the same identifiers uses `MODE="660",
    GROUP="dialout"`. Both are quoted verbatim in the `dmr-radio` class; the
    difference matters on a shared machine and matters more because one of the
    two identifiers is the generic STM32 bootloader, which is not specific to a
    radio at all.

    The project name is one character from qdmr's command-line program
    `dmrconf`, and they are unrelated packages from different upstreams.
  upstream_url: https://github.com/sergev/dmrconfig
