name: ustopo-qmapshack
version: "station"
summary: The US Topo sheets as one seamless QMapShack map, collars cropped
categories: [navigation-maps]

# Derived data (D-068): the `ustopo-mosaic` converter warps each sheet to Web
# Mercator cropped to its own box and builds one virtual raster over them.
depends: [usgs-ustopo, gdal-bin]

install:
  - install:
      method: derived
      converter: ustopo-mosaic
      source: usgs-ustopo
      licence: Public domain (USGS)
      licence_url: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits

update:
  probe:
    method: none
  strategy: reinstall
  cadence_hint: >-
    Follows usgs-ustopo: a new sheet is warped on the next install and the
    map is rebuilt when the set of sheets changes.

documentation:
  what_it_does: >-
    Turns the US Topo sheets into one map QMapShack can open, under
    /usr/local/share/hammunition/data/ustopo-qmapshack/: each sheet reprojected
    to Web Mercator and cropped to its own quadrangle, so the white margin and
    legend around every printed sheet are gone and neighbouring sheets meet
    edge to edge, with overviews so it draws quickly zoomed out; then
    `ustopo.vrt`, one virtual raster over all of them, which the
    `qmapshack-offline` launcher adds to QMapShack's map list.
  why_you_want_it: >-
    A US Topo GeoTIFF is the whole printed page, each in its own projection;
    QMapShack cannot lay them side by side as they come, and stacked
    uncropped each margin hides its neighbour. This makes them one map, with
    the archive's GDAL and nothing else.
  prerequisites: >-
    `usgs-ustopo` and `gdal-bin`, which install first.
  known_problems: >-
    Measured on one Delaware sheet on 2026-09-29: 2.5 s to warp a 9.2 MB
    sheet to 6.0 MB and 0.9 s to add overviews, 8.9 MB in all; the plan
    estimates the same size as the download, measured on one quad. Keeping
    the downloaded sheets and the warped ones about doubles the disk the
    sheets take. QMapShack showing this map has not been measured yet: in the
    one run so far QMapShack opened the VRT and listed it, and the map area
    stayed blank for a reason not found. If it stays blank for you, see the
    guide's troubleshooting.
  upstream_url: https://gdal.org/
  upstream_support: >-
    The GDAL documentation (https://gdal.org/) for the tools; QMapShack's
    wiki (https://github.com/Maproom/qmapshack/wiki) for how it shows raster
    maps.
