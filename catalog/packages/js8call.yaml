name: js8call
version: "3.0.3"
summary: Weak-signal keyboard-to-keyboard messaging built on the FT8 modem
categories: [digital-modes]

# SHAPE 1 — the method itself varies, not merely its argument.
# Linux Mint 22.3 ships Qt 6.4.2; JS8Call requires Qt 6.5. On that target we
# take the older repository build; everywhere else we build from source. AHRL
# expresses this with an inverted shell test that is always false (see D-013);
# here it is a selector.
#
# Mint 22.3 is built on Ubuntu 24.04, and Ubuntu 24.04 has the same Qt 6.4.2:
# the git build's cmake configure refused it ("Could not find a configuration
# file for package Qt6 compatible with requested version 6.5", measured on the
# Ubuntu 24.04 VM, 2026-09-01). The selector named the derivative and not the
# base it inherits the problem from. Pop!_OS 24.04 shares the base and is
# named on the same evidence.
install:
  - when:
      distro: [linuxmint, ubuntu, pop]
      distro_version: ["22.3", "24.04"]
    install:
      method: apt
      packages: [js8call]
    note: >-
      Ubuntu 24.04, and Mint 22.3 and Pop!_OS 24.04 on top of it, have
      Qt 6.4.2 and JS8Call 3.x needs Qt 6.5. The repository's 2.2.0 is older
      but it runs. Everywhere else builds the current release from source.

  - install:
      # The 2.5.2-era release tarballs are gone: upstream is at v3.0.3 and its
      # Linux release assets are AppImages only (measured 2026-08-30, the old
      # URL 404s). The source is still the repository, so this is a pinned
      # git build of the tag -- the pin verified after checkout like every
      # git unit.
      method: git
      repo: https://github.com/JS8Call-improved/JS8Call-improved
      ref: "v3.0.3"
      build_system: cmake
      # v3.0.3's CMakeLists.txt has no install rule for the executable -- the
      # only install() is in resources/debian/CMakeLists.txt, which nothing
      # adds as a subdirectory -- so `cmake --install` exits 0, writes an empty
      # install_manifest.txt, and installs nothing. Four targets had reported
      # js8call "confirmed" with no /usr/local/bin/js8call before the effect
      # check learned to look for declared binaries (measured Ubuntu 26.04,
      # 2026-09-02; absent on Parrot after its full-catalog pass too).
      provides_install_target: false
    build_depends:
      - qt6-multimedia-dev
      - qt6-serialport-dev
      - qt6-tools-dev
      - libboost-dev
      - libfftw3-dev
      - libhamlib-dev
      - gfortran
      - cmake
      - build-essential

binaries:
  - produced: JS8Call
    install_as: js8call

# libhamlib4t64, not libhamlib4 — see the note in fldigi.yaml: the t64
# transition renamed it on every target (measured 2026-08-28).
depends: [libhamlib4t64]

update:
  probe:
    method: github_release
    repo: JS8Call-improved/JS8Call-improved
  strategy: rebuild

documentation:
  what_it_does: >-
    Sends and receives short text messages over HF using the same weak-signal
    modem technology as FT8, so contacts work at signal levels well below what
    voice or CW can manage.
  why_you_want_it: >-
    It is the practical choice for keyboard-to-keyboard conversation and
    store-and-forward messaging when band conditions are poor. Where FT8 only
    exchanges signal reports, JS8Call carries actual text.
  prerequisites: >-
    Rig control via hamlib or flrig, and correctly routed sound-card audio
    between the radio and the computer.
  known_problems: >-
    Needs Qt 6.5 or newer. Linux Mint 22.3 ships Qt 6.4.2, so that target
    installs the older repository build instead. This branch is exercised in
    CI against a real Mint 22.3 container — the linuxmintd image ships Ubuntu's
    base-files, so the target build installs Mint's own base-files from Mint's
    repo to restore its true os-release (Q-014; see containers/Dockerfile.target
    IDENTITY_PACKAGE and containers/targets.yaml).
  upstream_url: https://github.com/JS8Call-improved/JS8Call-improved
  upstream_support: JS8Call groups.io list
