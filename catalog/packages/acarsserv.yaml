name: acarsserv
version: "0+git20181219"
summary: Stores what acarsdec and dumpvdl2 decode into a SQLite database
categories: [listening]

# The aeronautical cluster's storage end. libacars decodes the application
# layer, acarsdec and dumpvdl2 receive, this keeps what they heard.
after: [acarsdec]

install:
  - install:
      method: git
      repo: https://github.com/TLeconte/acarsserv
      # No tag has ever been cut and the repository is archived, so a commit
      # pin is the only option and D-024 requires a review beside it.
      ref: a191e1f3eea3e476500333740a03c20b6933b3fd
      build_system: make
      # The Makefile has targets for `acarsserv` and its objects and no
      # install rule.
      provides_install_target: false
      pin_review:
        last_reviewed: 2026-08-28
        reviewed_by: hammunition-maintainers
        # Nothing packages it, so the judgement is ours -- which is what
        # `own_choice` records, and it is the more expensive basis on purpose.
        basis: own_choice
        rationale: >-
          Upstream is archived and has never cut a tag, so the head of the
          default branch is the only revision there is: a191e1f3, 2018-12-19.
          Checked for a distribution to follow instead and found none --
          `apt-cache policy acarsserv` returns no candidate on Debian 13, Kali
          or Parrot (2026-08-28). It builds clean on Debian 13 with no
          compiler flags, which for eight-year-old C is better than expected
          and is the reason this is an ADD rather than a documented gap.
        cadence_days: 365
    build_depends:
      - build-essential
      - pkg-config
      - libsqlite3-dev
    note: >-
      Built from this commit in a Debian 13 container on 2026-08-28: make exits
      0 with no flags at all and produces `acarsserv`. Re-tested with the
      permissive flags this catalog uses elsewhere and the result was the same,
      so none are carried -- a flag that is not needed is a claim that
      something is wrong with the code.

binaries:
  - produced: acarsserv
    install_as: acarsserv

update:
  probe:
    method: none
  strategy: rebuild
  cadence_hint: >-
    Archived upstream, last commit 2018-12-19. There is nothing to probe and
    nothing will change. Watch for a successor rather than for a release --
    the pin review is due annually and that is what it is due for.

documentation:
  what_it_does: >-
    Listens on a UDP port for the JSON messages acarsdec, dumpvdl2 and their
    relatives emit, and writes them into a SQLite database: message text,
    aircraft registration, flight number, timestamp and the station that heard
    it, with the reassembly of multi-part messages done on the way in.
  why_you_want_it: >-
    A decoder prints messages and forgets them. This is what turns a receiver
    into a record you can query -- how often an airframe passes, what a
    particular flight number sends, what was heard overnight. Because the
    result is an ordinary SQLite file, anything that speaks SQL can read it,
    which is a great deal more useful than a log file.
  prerequisites: >-
    A decoder configured to send JSON to it -- acarsdec and dumpvdl2 both do.
    Somewhere to put the database file. Nothing else; it does not touch a
    radio.
  known_problems: >-
    **Upstream is archived and has not been touched since 2018-12-19.** It
    still builds cleanly and still does what it says, and no one is going to
    fix it if that changes. The manifest's pin review is due annually and its
    real job is to notice a successor rather than a release. The database
    schema is fixed and undocumented beyond the source; treat the file as
    something to read rather than something to build a schema-dependent tool
    on. It listens on a UDP port with no authentication -- bind it to localhost
    unless you meant otherwise.
  upstream_url: https://github.com/TLeconte/acarsserv
  upstream_support: >-
    Thierry Leconte. The repository is archived, so issues are closed; GPL-2.0,
    read from LICENSE at the pinned commit.
