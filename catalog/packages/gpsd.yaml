name: gpsd
version: "3.25"
summary: GPS service daemon — one process owns the receiver, everything else asks it
categories: [hardware, station, timing]

install:
  - install:
      method: apt
      packages: [gpsd]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Runs as a daemon, opens a GPS or GNSS receiver, and serves the position,
    time and satellite data to any number of clients over a local socket on
    port 2947. Applications talk to gpsd rather than to the receiver. This
    package also carries `ubxtool`, `gpsctl`, `ppscheck` and `ntpshmmon` —
    verified by listing its contents on Debian 13, because the name suggests
    they would be in gpsd-clients and they are not.
  why_you_want_it: >-
    A serial receiver can only be opened by one program at a time, and a ham
    station routinely wants position and time in several places at once —
    APRS beaconing, grid-square lookup, satellite prediction, and a disciplined
    clock for FT8 and JS8, where the whole protocol depends on the station
    clock being right. gpsd is what lets all of them read one receiver. It is
    also the thing chrony takes a PPS reference from.
  prerequisites: >-
    A receiver the machine can see. Most USB GNSS units are USB-serial devices,
    so the identifiers and permissions come from the `gps-receiver` hardware
    class. Nothing needs configuring by hand for a hotplugged USB receiver —
    gpsd's own udev rule starts it on the device.
  known_problems: >-
    gpsd's udev rule does not merely name the device, it starts gpsd on it —
    `ENV{SYSTEMD_WANTS}="gpsdctl@%k.service"`. That is correct for a GPS and
    hostile for anything else that happens to share an identifier, which is why
    Debian ships the rule with five entries commented out and the note "rule
    disabled in Debian as it matches too many other devices". Two of those five
    are the FTDI FT232 and the Silicon Labs CP210x — the chips in most rig
    control cables. If yours is on the list that is still enabled, gpsd will
    open it and your logging software will find the port busy. The
    `gps-receiver` class documents which identifiers those are.
  upstream_url: https://gpsd.io/
  upstream_support: gpsd-users mailing list
