name: klog
version: "2.4.1"
summary: Cross-platform Qt station log that stays out of the way
categories: [logging, rig-control]

install:
  - install:
      method: apt
      packages: [klog]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Logs contacts to a local file with DXCC, WAZ, ITU and IOTA tracking, satellite
    and QSL fields, ADIF import and export, and upload to LoTW, eQSL, ClubLog
    and QRZ. It reads the rig through hamlib so frequency and mode fill
    themselves in, and it runs on Linux, Windows and macOS from the same code.
  why_you_want_it: >-
    It is the middle option between xlog, which is small and does the basics,
    and CQRLOG, which wants a database server. Nothing to configure before the
    first contact, and the award tracking is there when you start caring about
    it. The cross-platform part matters if you also operate from a Windows
    laptop and want one log format and one habit.
  prerequisites: >-
    None to start logging. Rig control needs hamlib to be able to reach the
    radio, which usually means the serial device and membership of the
    `dialout` group.
  known_problems: >-
    The targets disagree sharply on version -- 2.4.1 on Debian 13 and Parrot,
    2.4.2 on Ubuntu 26.04, 2.5.2 on Kali, 2.3.3 on Linux Mint 22.3, measured
    2026-08-28. Upload behaviour to the online services is the part that
    changes most between releases, so a service that rejects an upload is worth
    checking against your version before assuming a credential problem.
  upstream_url: https://github.com/ea4k/klog
  upstream_support: >-
    Jaime Robles, EA4K. GitHub issues at the URL above, which is also the
    Homepage Debian's package declares -- klog.xyz refused an automated request
    when this was checked on 2026-08-28, so the repository is cited instead.
