name: soapyremote-server
version: "0.5.2"
summary: Serves a local SDR over the network to software on another machine
categories: [sdr, hardware]

install:
  - install:
      method: apt
      packages: [soapyremote-server]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Runs a daemon that publishes the SDRs attached to one machine over the
    network. Any SoapySDR client elsewhere sees them as if they were local,
    with the samples streamed over the link.
  why_you_want_it: >-
    The antenna and the operator are rarely in the same place. This is what
    lets a Raspberry Pi in a loft, at a mast base, or at a quiet site hold the
    dongle while the machine with the screen and the CPU does the work. It is
    also the cheapest way to escape the noise floor of a modern house.
  prerequisites: >-
    A network with enough capacity for the sample rate you want -- 2.4 Msps of
    8-bit IQ is roughly 40 Mbit/s before overhead, so wired is a different
    experience from wireless. The matching SoapySDR module on the server, and
    the remote module on the client.
  known_problems: >-
    Bandwidth is the whole story: a rate that works on the local machine may
    simply not fit down the link, and the symptom is dropped samples and gaps
    rather than an error. The server has no authentication -- anyone who can
    reach the port can use your radio and hear what it hears -- so it belongs
    on a trusted network or behind a tunnel, and that is a deliberate decision
    rather than a default to accept.
  upstream_url: https://github.com/pothosware/SoapyRemote/wiki
  upstream_support: The Pothosware project.
