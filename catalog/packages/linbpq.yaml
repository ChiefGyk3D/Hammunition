name: linbpq
version: "25.39"
summary: BPQ32 packet-radio node, BBS and Winlink gateway
categories: [packet, emcomm]

# Q-005, resolved: build from a pinned upstream tag.
#
# The working assumption was that linbpq is free-to-use but not open source, so
# mirroring might be impermissible. Verified otherwise: LinBPQ.c carries an
# explicit GPL-3.0-or-later grant, Copyright 2001-2018 John Wiseman G8BPQ,
# worded as a statement about the whole project. See
# docs/reference/licence-verification.md.
#
# The unversioned cantab.net /Downloads/Beta/ URLs that 73Linux fetches are its
# packaging choice, not upstream's publishing model. Upstream tags releases, so
# this is an ordinary pinned build with no mirror and no `unverifiable` status.
install:
  - install:
      method: git
      repo: https://github.com/g8bpq/LinBPQ
      ref: "25.39"
      build_system: make
    build_depends:
      - build-essential
      - libpaho-mqtt-dev
      - libjansson-dev
      - libminiupnpc-dev
      - libconfig-dev
      - libpcap-dev
      - zlib1g-dev
      - libi2c-dev
    note: >-
      Dependency list derived from the LIBS line of upstream's makefile
      (-lpaho-mqtt3a -ljansson -lminiupnpc -lm -lz -lpthread -lconfig -lpcap)
      and verified present on Debian 13 by querying the target container, not
      by guessing package names. Upstream supports `make noi2c` to drop the I2C
      dependency on hardware without it.

binaries:
  - produced: linbpq
    install_as: linbpq

# linbpq is a node, BBS and gateway: it is useless without configuration, and
# per D-008 the packet core is admitted "with configuration, not merely
# installation". The callsign is operator-specific and cannot ship in git.
config_files:
  - path: /etc/bpq32.cfg
    template: |
      ; Minimal LinBPQ node configuration generated by Hammunition.
      ; Review before use — a node transmits, and its identity is yours.
      NODECALL={station.callsign}
      NODEALIAS={station.node_alias}
      LOCATOR={station.grid_square}
    mode: "0644"
    backup_existing: true

system_modifications:
  - kind: group_membership
    description: LinBPQ needs serial and audio access for TNCs and soundmodems
    detail: adds the operating user to the `dialout` group
    reversible: true
    reverse_hint: gpasswd -d <user> dialout

service_endpoints:
  - name: node_telnet
    default_url: telnet://localhost:8010
    description: >-
      Telnet listener for local node access. Bound to localhost by default;
      exposing it to a network makes your node reachable by others, which is
      usually the point but should be a deliberate choice.
    user_configurable: true

update:
  probe:
    method: github_tags
    repo: g8bpq/LinBPQ
  strategy: rebuild
  cadence_hint: >-
    Upstream tags frequently and cuts no GitHub releases — 25.39, 25.36, 25.35
    within one year. Tag selection is a stability judgement, not "take latest".

documentation:
  what_it_does: >-
    Runs a packet-radio node: a switch that relays AX.25 traffic between RF
    ports and the internet, with an integrated BBS, a Winlink RMS gateway, chat,
    and APRS support. It is the software behind a large share of the packet
    nodes still on the air.
  why_you_want_it: >-
    If you want to operate infrastructure rather than just use it — host a BBS,
    provide a Winlink gateway for your area, or link a local packet network to
    the wider one — this is the standard implementation. It has no real
    alternative on Linux.
  prerequisites: >-
    A configured AX.25 stack, a TNC or soundmodem such as Direwolf or
    QtSoundModem, and a callsign in `/etc/bpq32.cfg`. Running a Winlink gateway
    additionally requires registration with the Winlink system.
  known_problems: >-
    Upstream publishes prebuilt binaries in a directory named Beta with no
    versioning or checksums; we ignore those and build from a tagged source
    revision instead. The generated configuration is a minimum viable node and
    is meant to be edited — read it before transmitting.
  upstream_url: https://github.com/g8bpq/LinBPQ
  upstream_support: BPQ32 support group at groups.io/g/BPQ32
