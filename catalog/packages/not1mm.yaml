    note: >-
      AHRL removes not1mm's menu entry on aarch64 while still installing it;
      the wheel set above resolves for both architectures, so nothing here is
      arch-gated -- if it misbehaves on ARM that will be measured, not
      inherited (D-025). Regenerate the pins with
      `uv pip compile --universal --generate-hashes` when bumping the version.

# PyQt6's xcb platform plugin needs the cursor library at runtime; AHRL
# installs the same package for the same reason.
depends: [libxcb-cursor0]

update:
  probe:
    method: pypi
  strategy: reinstall
  cadence_hint: >-
    Upstream versions by date and releases often -- a new contest's rules
    ship as a new release. Bumping means regenerating the whole pinned set,
    which is one command; see the install note.

documentation:
  what_it_does: >-
    A ham contest logging program in the N1MM mould -- per-contest rule sets,
    dupe checking, CW/voice keying, rig control via flrig or rigctld, cluster
    spots, and ADIF/Cabrillo export.
  why_you_want_it: >-
    The Linux-native answer to "what do I log a contest in" -- N1MM itself is
    Windows-only. Scores as you go, knows the multiplier rules for the major
    contests, and exports the Cabrillo the sponsor wants.
  prerequisites: >-
    Rig control through flrig or rigctld if you want frequency/mode followed
    automatically, and your station values set (`hammunition station set`) --
    the program asks for callsign and grid on first run either way.
  known_problems: >-
    A PyQt6 application installed into a per-user virtualenv: it appears on
    the PATH as `not1mm` via a generated wrapper in ~/.local/bin, which login
    shells add to PATH only when it exists -- open a new shell after the
    first install. Wayland sessions may want QT_QPA_PLATFORM=xcb if the
    window comes up blank (the AHRL X11 guidance applies to Qt6 too).
  upstream_url: https://github.com/mbridak/not1mm
  upstream_support: >-
    Mike Bridak K6GTE, via GitHub issues -- responsive, and the README's
    troubleshooting section is genuinely good.
