name: libnfc-bin
version: "1.8.0"
summary: Command-line tools for PN53x-based NFC readers
categories: [rfid]

install:
  - install:
      method: apt
      packages: [libnfc-bin]

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Utilities for the libnfc library: listing attached readers, polling for
    tags, reading and writing MIFARE Classic and Ultralight cards, and
    relaying or emulating tags with supported hardware.
  why_you_want_it: >-
    It is the free-software baseline for NFC work and covers the cheap PN532
    readers that most people already own or can buy for a few pounds. It is a
    different device family from a Proxmark -- 13.56 MHz only, and no low-
    frequency support -- so the two complement rather than replace each other.
  prerequisites: >-
    A PN53x-based reader on USB or serial, and a /etc/nfc/libnfc.conf entry
    for serial devices. USB readers are usually found without configuration.
  known_problems: >-
    It does not do low-frequency (125 kHz) at all, which is half of what
    people arrive at this profile for. MIFARE Classic support depends on the
    reader firmware as much as on the software, and some cheap clones
    misreport what they can do.
  upstream_url: https://github.com/nfc-tools/libnfc
