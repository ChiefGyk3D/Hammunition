name: svxlink-server
version: "24.02"
summary: Repeater controller and EchoLink node in software
categories: [digital-modes, emcomm, station]

install:
  - install:
      method: apt
      packages: [svxlink-server]
    note: >-
      AHRL runs this early because the package creates the `svxlink` group
      (inventory unit 7). Measured on Debian 13 on 2026-08-28 by installing it
      in a container: it is correct. The package creates an `svxlink` system
      user and group and adds that user to `dialout` and `audio`. Unlike
      AHRL's xastir claim, which measured as a no-op, this one holds -- which
      is the argument for measuring each rather than trusting or distrusting
      the source as a whole.
      Version spread is wide: 24.02 on Debian 13 and Parrot, 25.05.1 on Ubuntu
      26.04, 26.05.1 on Kali, 19.09.2 on Mint 22.3.

update:
  probe:
    method: apt_policy
  strategy: apt_upgrade

documentation:
  what_it_does: >-
    Runs a repeater or a simplex node: it handles squelch detection, courtesy
    tones, identification, timeouts and DTMF commands, and it links the radio
    to EchoLink and to other SvxLink nodes over the internet. Modules add voice
    mail, a parrot repeater, metar reports and more.
  why_you_want_it: >-
    It is a complete repeater controller in software, which replaces a box of
    dedicated hardware with a small computer and an interface. For a club
    repeater, a link node, or an EchoLink gateway, it is the standard Linux
    answer and has been for many years.
  prerequisites: >-
    A radio interfaced for audio and PTT, and squelch detection -- either a COS
    line from the radio or SvxLink's own tone or level detection, which is less
    reliable. A callsign, which the node identifies with. EchoLink requires
    validation of your licence with the EchoLink system.
  known_problems: >-
    Squelch detection is where most installations struggle: level-based
    detection reacts to noise and to the tail of a transmission, and a
    hardware COS line is worth the trouble. A repeater controller keys a
    transmitter unattended and its identification and timeout settings are
    what keep that lawful -- they are yours to set correctly. The version
    spread across targets means configuration examples found online may
    reference options a 24.02 build does not have.
  upstream_url: https://www.svxlink.org
  upstream_support: >-
    Tobias Blomberg, SM0SVX. The site carries documentation and links to the
    mailing list, which is the practical route for configuration questions.
