# The category vocabulary — D-003's flat tags, written down.
#
# Categories are tags, not a tree: they overlap freely and never nest. What
# they must not do is drift, and they had. `satdump` was tagged `satellite`
# and `noaa-apt` `satellites`, so a query for either found half the satellite
# software in the catalog and reported it as all of it. Nothing failed; the
# answer was just quietly wrong, which is the failure mode this project keeps
# writing checks against.
#
# A controlled vocabulary is the fix, and the cost is deliberate: adding a tag
# means editing this file, where the tag you were about to invent is already
# visible three lines up. `tests/test_categories.py` enforces both directions —
# no manifest may use an undeclared tag, and no declared tag may go unused, so
# the vocabulary cannot accumulate names nothing carries.
#
# `icon` is a freedesktop icon name (checked against Breeze and Adwaita on the
# field laptop, 2026-09-12) for the submenu and for entries that carry none.
#
# `title` is how the tag reads on a desktop menu -- the acronyms nothing can
# derive from the tag (`sdr` is SDR, not Sdr; a title-cased `hf-propagation`
# read "Hf Propagation" on the Kali VM's Xfce tree, 2026-09-01).
#
# This file is data, not logic. The install path never reads it; the checker,
# the docs generator, the person adding the next manifest, and
# `hammunition menus apply` (D-036, which renders one submenu per entry) do.
#
# `groups` (D-050) is the menu's second level and nothing else: Parrot's own
# tool menu is one top menu, numbered groups, then subcategories, and the
# flat 27-sibling tree was the thing nobody could find anything in. Every
# category belongs to exactly one group (tests/test_categories.py), `order`
# is the menu's order, and a category stays a flat tag for every other
# reader -- a group is where a submenu sits, not what a package is.

categories:
  - name: antenna
    icon: applications-engineering
    title: Antenna Design
    summary: >-
      Antenna and transmission-line design, modelling, and measurement.

  - name: contest
    icon: applications-utilities
    title: Contesting
    summary: >-
      Contest operating -- scoring, duplicate checking, rate keeping,
      and keying under time pressure.

  - name: cw
    icon: preferences-desktop-keyboard
    title: CW (Morse)
    summary: >-
      Morse code -- keying, decoding, and learning to hear it.

  - name: digital-modes
    icon: audio-x-generic
    title: Digital Modes
    summary: >-
      Keyboard-to-keyboard and weak-signal modes worked with a transceiver:
      PSK31, RTTY, FT8, JS8, SSTV and the rest.

  - name: dmr
    icon: radio
    title: DMR
    summary: DMR — codeplugs, talkgroups, and the radios that use them.

  - name: electronics
    icon: applications-engineering
    title: Electronics & Test Gear
    summary: Bench electronics and EDA — circuit design, simulation, test gear.

  - name: emcomm
    icon: network-wireless
    title: Emergency Comms
    summary: Emergency and public-service communications.

  - name: hardware
    icon: applications-engineering
    title: Devices & Drivers
    summary: >-
      Device support rather than an application: drivers, firmware, udev
      permissions, and the tools for talking to a device at all.

  - name: hf-propagation
    icon: map-globe
    title: HF Propagation
    summary: Propagation prediction, solar indices, beacons and grey line.

  - name: listening
    icon: audio-input-microphone
    title: Listening & Decoding
    summary: >-
      Receive-only monitoring and decoding. Needs no licence and often no
      transmitter, which makes it the on-ramp for an operator who owns nothing
      but a dongle yet.

  - name: logging
    icon: applications-utilities
    title: Logging & QSL
    summary: >-
      Contact logging, awards tracking, QSL and confirmation services.

  - name: mesh
    icon: network-wireless
    title: LoRa Mesh
    summary: LoRa and mesh networking — Meshtastic, MeshCore, Reticulum.

  - name: nbems
    icon: audio-x-generic
    title: NBEMS Messaging
    summary: >-
      The NBEMS stack specifically — fldigi with flmsg, flamp and flwrap for
      formal message handling without an internet connection.

  - name: packet
    icon: network-wireless
    title: Packet (AX.25, Winlink)
    summary: AX.25 and packet radio, including Winlink and BBS work.

  - name: programmer
    icon: applications-development
    title: Flashers & Programmers
    summary: Device programmers and flashers for microcontrollers and memories.

  - name: radio-programming
    icon: radio
    title: Radio Memories (Codeplugs)
    summary: >-
      Writing memories and settings into a transceiver — codeplugs and channel
      lists, as distinct from controlling a radio while operating it.

  - name: rf-research
    icon: applications-science
    title: RF Research (consent-gated)
    summary: >-
      Research tooling whose lawful use is jurisdiction-dependent. Consent-gated
      (D-021).

  - name: rf-security
    icon: applications-utilities
    title: RF Security
    summary: >-
      RF security and SIGINT tooling. Opt-in by profile, never installed by
      default.

  - name: rfid
    icon: applications-engineering
    title: RFID & NFC
    summary: RFID and NFC — readers, transponders, and the cards themselves.

  - name: rig-control
    icon: radio
    title: Rig Control (CAT)
    summary: >-
      CAT control of a transceiver while operating: frequency, mode, PTT
      and the panadapter that rides on them, as distinct from writing its
      memories.

  - name: satellite
    icon: map-globe
    title: Satellites
    summary: >-
      Amateur satellites and weather satellites — tracking, prediction,
      telemetry and image decoding.

  - name: sdr
    icon: applications-science
    title: SDR Receivers & Toolkits
    summary: Software-defined radio — receivers, transceivers and the software.

  - name: station
    icon: radio
    title: Station Utilities
    summary: >-
      Station infrastructure that is not itself a radio application: time,
      position, and the plumbing an operating position needs.

  - name: timing
    icon: preferences-system
    title: Time & Frequency
    summary: Time and frequency — clocks, disciplining, and stable references.

  - name: tracking
    icon: gps
    title: Tracking (APRS, ADS-B, AIS)
    summary: >-
      Position reporting and target tracking: APRS, ADS-B, AIS, and the
      map that shows them.

  - name: training
    icon: applications-education
    title: Exams & Practice
    summary: >-
      Licence exam preparation and operating practice.

  - name: workstation
    icon: utilities-terminal
    title: Workstation
    summary: >-
      The machine the station runs on rather than the radio: editors, serial
      consoles, enumeration tools.

groups:
  # The order is the order a newcomer reads the menu in: what you do at the
  # radio first, then how you listen, then the bench, then the tools whose
  # use is gated, then learning. Titles say what is inside in plain words;
  # the category submenus carry the ham vocabulary (D-054).
  - order: 1
    name: station
    icon: radio
    title: Operate the Station
    summary: Control the rig, keep the log, run a contest, set the clock.
    categories: [rig-control, logging, contest, station, timing]
  - order: 2
    name: digital-modes
    icon: audio-x-generic
    title: Digital Modes & Morse
    summary: Keyboard modes, weak-signal modes, NBEMS messaging and CW.
    categories: [digital-modes, nbems, cw]
  - order: 3
    name: packet
    icon: network-wireless
    title: Packet, Mesh & Emergency Comms
    summary: AX.25 packet, APRS, Winlink, LoRa mesh and the EMCOMM stack.
    categories: [packet, emcomm, mesh]
  - order: 4
    name: sdr
    icon: applications-science
    title: SDR & Listening
    summary: Software-defined radio, receive-only decoders, and position tracking on a map.
    categories: [sdr, listening, tracking]
  - order: 5
    name: space
    icon: weather-clear-night
    title: Satellites & Propagation
    summary: Satellite passes and telemetry, HF propagation and the solar picture.
    categories: [satellite, hf-propagation]
  - order: 6
    name: hardware
    icon: applications-engineering
    title: Antennas, Bench & Programming
    summary: Antenna design, test gear, radio memories, device flashers and drivers.
    categories: [antenna, electronics, radio-programming, dmr, programmer, hardware]
  - order: 7
    name: rf-security
    icon: applications-utilities
    title: RF Security & Research
    summary: Wireless auditing, RFID, and consent-gated research tooling.
    categories: [rf-security, rfid, rf-research]
  - order: 8
    name: learning
    icon: applications-education
    title: Learn & Practise
    summary: Licence exam practice and Morse training.
    categories: [training]
  - order: 9
    name: workstation
    icon: utilities-terminal
    title: Workstation
    summary: The machine the station runs on.
    categories: [workstation]
    # Not a menu: git, tmux, screen and VS Code are catalog units because a
    # station needs them, not because they are radio software. A unit tagged
    # workstation *and* a radio category (wireshark, esptool) still shows
    # under the radio one; the desktop keeps these where it already puts
    # them (maintainer, 2026-09-12).
    menu: false
