name: phone-maps
summary: Offline maps and points of interest for the team's phones, built on the laptop
# post-1.0, as `navigation` is: adding to the 1.0 set is the maintainer's
# decision. A profile of its own rather than members of `navigation`
# (D-067): that profile is the laptop's own navigator, and every member is
# built for every region, which at the measured rate costs hours on a large
# region for phones the operator may not have. Profiles overlap (D-003).
stage: post-1.0

packages:
  - osm-regions
  - mapsforge-map
  - mapsforge-poi

documentation:
  what_it_installs: >-
    The OpenStreetMap regions you choose, downloaded from Geofabrik and
    verified (`osm-regions`); a Mapsforge vector map of each
    (`mapsforge-map`), built with the archive's osmosis and Mapsforge
    writer; and a Mapsforge points-of-interest file of each
    (`mapsforge-poi`), built with Mapsforge's POI writer, which is fetched
    once from Maven Central and checked against a sha256 Hammunition
    measured. `hammunition maps phone` then gathers the files, with the
    Garmin maps from `navigation` when they are installed, into one folder
    with a SHA256SUMS, and prints the ways to carry them to a phone.
  why_together: >-
    Phones lean on the network for their maps. With these, the laptop makes
    every phone's offline maps from one verified download per region, ahead
    of time, so a team deployed with the phone network down navigates on
    the same maps as the laptop. The regions are shared with `navigation`,
    so a machine with both downloads each region once.
  deliberately_excludes: >-
    OsmAnd's `.obf`, because its generator is a nightly build replaced daily
    with no checksum, signature or tag (the route is a build of OsmAnd-tools
    from a source commit). Organic Maps' and CoMaps' `.mwm`, because the
    generator must match the app's release and needs the whole planet's
    coastline for any coastal region (the route is the publishers' own
    files, checked by their per-file hashes). PocketMaps, which needs a 2019
    routing engine for an app with no commit since 2024-10. Transportr,
    which queries online transit services and stores nothing offline. The
    engine transfers nothing to a phone itself: `adb` and KDE Connect are
    opt-ins the operator installs, and `maps phone` says what each needs.
  manual_configuration: >-
    Choose your map regions first, for example `hammunition station set
    --map-regions north-america/us/vermont`; without them the map units are
    deferred. After the install, run `hammunition maps phone` as yourself,
    then carry the folder it names to each phone by one of the routes it
    prints: the laptop's hotspot with a web server bound to the hotspot's
    address, USB file transfer, or the opt-in `adb` or KDE Connect. On the
    phone, install a Mapsforge-reading app while it still has the internet,
    and open the files from it. None of this has been checked on a phone
    yet; the bench owes it.
  disk_footprint_hint: >-
    osmosis, libmapsforge-java and a Java runtime from the archive (size not
    yet measured), and the 18.8 MB POI writer once. Per region, measured on
    Delaware (22 MB download): the download, a map at about 0.78 times it and
    a POI file at about 0.21 times it, with about 15 times the download of
    scratch while the map builds, removed afterwards. `maps phone` copies the
    files once more into your home.
  who_for: "A team lead who builds offline maps and points of interest once on the laptop and carries them to the team's phones."
  hardware_assumed: "A phone that reads Mapsforge files (install the app while it still has internet). The laptop's hotspot, USB or KDE Connect carry the files."
  footprint_short: "per region: the download plus about a fifth and three quarters of it, and about 15 times it as scratch while building"
  excludes_short: "OsmAnd, Organic Maps, CoMaps and PocketMaps files, Transportr"
  goals:
    - "Carry offline maps on my team's phones"
  first_ten_minutes:
    - "Choose your regions: `hammunition station set --map-regions <region-path>`. Without them the map units are deferred."
    - "Read the plan: `hammunition install phone-maps --dry-run`. Look at the scratch space a build needs, about 15 times the download."
    - "Install: `hammunition install phone-maps`. A map took 3 minutes 38 seconds on a 22 MB region and hours on a large one."
    - "Gather the files: `hammunition maps phone`, run as yourself. It makes one folder with a `SHA256SUMS` and prints the ways to carry it; it never runs them."
    - "Install a Mapsforge-reading app on each phone while it still has internet, then copy the folder across and open the files from the app."
    - "Compare checksums on the phone with the `SHA256SUMS` file so a corrupt copy cannot pass for a map."
    - "Note: nothing here has been checked on a phone yet; the bench owes it."
