name: reference
summary: An offline library -- Wikipedia, WikiMed, ham Q&A, dictionaries and the ICS forms -- on one local page
# post-1.0 until the maintainer places it, as navigation is: the 1.0 profile
# set is the one accepted on 2026-08-29 and asserted by tests/test_schema.py.
stage: post-1.0

# D-065, docs/superpowers/specs/2026-09-29-reference-layer-design.md: the
# offline reference layer ETC sub-project 5 named (D-042 rule 5). Readers are
# apt units; the books and the forms are data units; serving is the engine
# verb `hammunition reference serve`, not a unit.
packages:
  - kiwix-tools
  - kiwix
  - kiwix-library
  - dictionaries
  - goldendict-ng
  - ics-forms

documentation:
  what_it_installs: >-
    kiwix-tools, the Kiwix reader and server `hammunition reference serve`
    runs, and `kiwix`, the desktop reader; the Kiwix books you choose,
    pinned and checked (`kiwix-library`); dictd with GCIDE, WordNet, FOLDOC
    and VERA acronyms on 127.0.0.1 (`dictionaries`) and goldendict-ng to
    look words up on the desktop; and FEMA's 39 ICS forms (`ics-forms`).
  why_together: >-
    They are the questions that do not stop when the network does: what a
    word or an acronym means, how to treat an injury, how a circuit works,
    what an agency's form wants. Readers without books are empty and books
    without a reader are files, and `hammunition reference serve` puts all
    of it on one page on the laptop.
  deliberately_excludes: >-
    wikiHow (no current Kiwix file, CC BY-NC-SA), the zimgit prepper
    collections (no licence stated anywhere), energypedia (licence not
    verified), the whole of Project Gutenberg (221 GB; one class of it is
    offered), video-channel ZIMs and MedlinePlus (mixed licences), ARRL and
    ARES material (ARRL copyright), a sigidwiki ZIM (none exists; `artemis`
    carries the signal database), and Debian's Direwolf manual (Debian's
    package strips the PDFs; upstream's direwolf-doc repository is the
    route, not yet measured). Translation dictionaries (`dict-freedict-*`)
    are left for you to choose by language.
  manual_configuration: >-
    Choose books first, by id, for example `hammunition station set
    --reference-books ham.stackexchange.com_en_all,wikipedia_en_medicine_nopic`
    (`hammunition reference books` lists the 27 with sizes and licences);
    with none chosen, `kiwix-library` is deferred and everything else
    installs. Then `hammunition reference serve` and open
    http://127.0.0.1:8480/. goldendict-ng needs the local dictd added once
    as a DICT server (127.0.0.1).
  disk_footprint_hint: >-
    Readers and dictionaries from the archive: kiwix-tools about 11.4 MB
    with its dependencies, the dictionaries about 32 MB, kiwix and
    goldendict-ng mostly their WebEngine (not yet measured). The ICS forms
    8 MB. Books as chosen, from 27 MB (Simple English Wiktionary) and 76 MB
    (Amateur Radio Stack Exchange) to 127 GB (English Wikipedia with
    pictures); each is counted twice while it installs.
