name: workstation
summary: Editor, terminal and bench tooling for the machine the station runs on
stage: "post-1.0"

# Accepted per Q-011, contents fixed at acceptance so the profile cannot grow
# quietly. The case against it was scope creep in its most plausible costume,
# and the defence is not vigilance — it is that `deliberately_excludes` below is
# a required schema field, so the exclusion travels with the profile instead of
# living in a review comment nobody reads.
#
# NOT consent-gated. Nothing here is an RF capability at all.
packages:
  - git
  - tio
  - minicom
  - screen
  - tmux
  - usbutils
  - pciutils
  - codium
  - code

# Q-015 #2, resolved 2026-08-30: a serial terminal for rig consoles, TNC
# config and programming cables. Detect any existing one and respect it;
# offer an open-source selection only when none is found; PuTTY recommended
# for its saved-session GUI, never installed silently.
suggests_one_of:
  - name: serial-terminal
    reason: >-
      Rig debug ports, TNC configuration and GPS at raw baud all want a
      serial console. PuTTY is the familiar GUI one; picocom and tio are the
      terminal-native answers. If you already run one, it is respected.
    detect_commands: [putty, cutecom, picocom, tio, minicom, screen, moserial]
    options: [putty, cutecom, picocom, tio, minicom]
    recommended: putty

documentation:
  what_it_installs: >-
    Version control, three serial consoles, a terminal multiplexer, the two
    hardware enumeration tools every device problem starts with, and an editor.
    Nine packages, all from apt on every supported target except `code`, which
    needs Microsoft's repository, and `codium`, which needs VSCodium's on
    anything but Parrot.
  why_together: >-
    A person building a station is usually also building the machine it runs on,
    and every RF profile in this catalog silently assumes some of this is
    already present. Manifests install from pinned git revisions, hardware
    entries instruct you to run lsusb, badge and Meshtastic work needs a serial
    console, and a decode running over SSH to a field machine needs to survive
    the link dropping. This is that assumed floor, made explicit and installable
    rather than left to chance.
  deliberately_excludes: >-
    Shells, prompts, dotfiles, window managers, fonts, colour schemes, and
    terminal emulators beyond what serial work needs. The rule is simple enough
    to apply without argument: if it is a matter of taste, it is not in scope.
    There are a thousand dotfile projects and this is not one of them; every
    hour spent choosing between tmux and zellij is an hour not spent on the
    source backend, which is what actually blocks 60% of the parity target.
    Also excluded is any editor beyond the two here, and neither of those is a
    default — `codium` is what Parrot chose and `code` is opt-in under D-022.
  manual_configuration: >-
    Set `user.name` and `user.email` before your first commit or git refuses to
    make one. Serial work needs membership of the `dialout` group, which the
    hardware catalog requests but which does not apply to a session already
    open — log out and back in. Nothing here ships a tmux, screen or minicom
    configuration, deliberately: those are taste, and taste is excluded.
  disk_footprint_hint: >-
    Roughly 200 MB without an editor, or 600 MB with one. `code` and `codium`
    are around 400 MB each and installing both doubles that; they coexist
    without conflict but there is no reason to install both unless you want to
    compare them.
