name: rf-research
summary: Transmit-capable and interception-capable RF tooling — affirmative opt-in required
stage: post-1.0

# CONSENT-GATED. D-021.
#
# This profile exists to hold the tools whose *capability* is the hazard, so
# that `rf-security` does not have to. Splitting them is the whole point: a gate
# on everything trains people to click through, and `rf-security` (Wireshark,
# aircrack-ng, inspectrum, rtl_433) ships in Debian and Kali without ceremony.
#
# Contents settled by D-034 (Q-008 resolved 2026-08-29). This profile holds the
# RECEIVE-and-decode half of the cellular cluster. The transmit-capable stacks —
# srsRAN_4G, the Osmocom core, osmo-trx, OsmocomBB, intrusive-lte-mme, sni5gect —
# are NOT here and are **scheduled post-1.0** for a separate consent-gated
# `cellular` profile with its own env_var. They are staged, not refused: the
# dividing line is transmit, not topic.
consent:
  env_var: HAMMUNITION_ACCEPT_RF_RESEARCH
  risk_categories:
    - unlicensed_transmission
    - protected_communications
    - identifier_collection
    - spectrum_disruption
  disclosure: >-
    This profile installs software that can drive connected radio hardware to
    transmit, and software that can receive, decode and store communications
    carried over the air, including identifiers belonging to people and their
    devices. Transmitting may require a licence or other authorization, and
    receiving some communications may require authorization as well, depending
    on where you are and what you are doing. (What installs *today* is the
    receive/interception subset — gr-gsm — pending Q-008; the transmit tooling
    this disclosure covers is not in the profile yet. The disclosure describes
    the profile's gated scope, not a promise that every capability is installed
    now.)
  affirmation: >-
    Do you affirm that you have the authorization you need for how you intend to
    use this software?

packages:
  - gr-gsm

documentation:
  what_it_installs: >-
    Software whose capability, rather than its complexity, is the reason it is
    kept separate: tools that can cause hardware to transmit, and tools that
    receive and decode communications not addressed to you.
  why_together: >-
    They share a single property — using them lawfully depends on authorization
    you hold and we cannot see. Grouping them means the affirmation is asked
    once, about something specific, rather than repeatedly about everything.
  deliberately_excludes: >-
    Transmit-capable cellular network stacks — srsRAN_4G, the Osmocom core,
    osmo-trx, OsmocomBB, intrusive-lte-mme and sni5gect. They are **post-1.0,
    not out of scope** (D-034): they land in a separate consent-gated
    `cellular` profile with its own env_var, once that profile and the
    `docs/rf-security/` framing exist. The objection was never to the software,
    which is legitimate and which DragonOS ships; it is that a one-command
    installer aimed at licensed hams is the wrong delivery mechanism for a
    rogue base station before that framing is written. Also excludes everything
    in `rf-security`, which is not gated.
  manual_configuration: >-
    Nothing is configured automatically. gr-gsm needs a supported SDR and a
    tuned capture — its own documentation (the upstream project page in the
    gr-gsm package manifest) is the reference; this catalog ships no worked
    example yet. No transmit path is enabled by installing this.
  disk_footprint_hint: Small today — one package plus the GNU Radio stack it depends on.
