name: station
summary: The floor every station stands on — rig control, time, position
stage: "1.0"

# NOT named `ham-core`. `core` is the packaging word this project was built to
# avoid: it invites "what's not core?" and makes everything else feel
# optional-in-a-bad-way. `station` is what an operator calls the thing they are
# building, and `hammunition install station` reads as a sentence.
# See docs/reference/profile-sizing.md for the naming argument.
packages:
  - libhamlib-utils
  - flrig
  - chirp
  - gpsd
  - gpsd-clients
  - gpsd-tools
  - gpsbabel
  - twclock
  - tzwatch
  - pipx
  # The family's own dashboard. Sits here rather than in `propagation`
  # because it is the station's front page, not one more propagation
  # tool: the plan is for it to show what this installer set up.
  - hammunition-hill

documentation:
  what_it_installs: >-
    Hamlib's command-line tools, a rig control panel that other programs can
    share, the one radio programmer that covers hundreds of models, GPS for
    position and time with the converter that gets tracks off a handheld,
    two clocks, pipx, and Hammunition Hill -- the family's own local-first
    dashboard, installed from its release .deb and served to your browser
    on 127.0.0.1:8073.
  why_together: >-
    This is what every other profile quietly assumes is already there. A
    digital-modes setup needs something to key the radio; a logger needs to
    know the frequency; anything timed needs the clock to be right. Installing
    it once and by name is better than each profile pulling in half of it.

    Two pieces earn their place beyond the obvious. **flrig runs an XML-RPC
    server**, which is what lets fldigi, WSJT-X and a logger share one CAT port
    instead of the second program to start finding it busy — that is the normal
    digital-modes setup, and without something in the middle it does not work.
    **`rigctl` is the diagnostic** that separates a radio problem from a program
    problem: when fldigi will not key the transmitter, one command answers
    whether hamlib can.
  deliberately_excludes: >-
    Per-manufacturer radio tools. `wfview` is Icom, `kappanhang` is Icom
    network radios, `qdmr` and `dmrconfig` are DMR, `icom` is CI-V,
    `tmd710-tncsetup` is two Kenwood models. All are in the catalog and all
    belong to whoever owns that radio; putting them in the floor would install
    six manufacturers' software on every machine. CHIRP is the exception
    because it covers hundreds of models across most manufacturers, which makes
    it a general tool rather than a specific one. Also excludes loggers,
    propagation tools and anything mode-specific — those are their own
    profiles, which is the whole point of the split.
  manual_configuration: >-
    **Serial access needs the `dialout` group, and adding you to it does not
    affect a session that is already open** — log out and back in. Rig control
    needs your radio's hamlib model number, which `rigctl -l` lists and which is
    the thing most often set wrong; a mismatched backend gives partial control,
    where frequency works and mode does not, which reads as a broken cable.
    Icom radios additionally need the CI-V address matched to the radio's own
    menu. **Decide that flrig owns the serial port** and point everything else
    at flrig; two programs opening it directly is the classic failure and its
    symptom is erratic behaviour rather than an error. `pipx ensurepath` needs
    a new shell before it takes effect. **Hammunition Hill is running from
    the moment its package lands**: the .deb enables and starts
    `hammunition-hill.service` as its own `hamhill` user, bound to loopback.
    Give it your callsign and an ADIF log in
    `/etc/hammunition-hill/config.toml` and restart the service; leave the
    host at 127.0.0.1.
  disk_footprint_hint: >-
    Around 125 MB. CHIRP and its wxPython dependency are most of it;
    Hammunition Hill's .deb is under half a megabyte plus two Python
    libraries.
