name: station
summary: The floor every station stands on — rig control, time, position
stage: "1.0"

# NOT named `ham-core`. `core` is the packaging word this project was built to
# avoid: it invites "what's not core?" and makes everything else feel
# optional-in-a-bad-way. `station` is what an operator calls the thing they are
# building, and `hammunition install station` reads as a sentence.
# See docs/reference/profile-sizing.md for the naming argument.
packages:
  - libhamlib-utils
  - flrig
  # One shared rigctld for the station's rig, as a systemd user service (D-073).
  # Deferred by name when no rig is set, so an operator who owns no radio sees a
  # deferral here rather than on hamlib itself.
  - rig-service
  - chirp
  - gpsd
  - gpsd-clients
  - gpsd-tools
  - gpsbabel
  - twclock
  - tzwatch
  - pipx
  # The family's own dashboard. Sits here rather than in `propagation`
  # because it is the station's front page, not one more propagation
  # tool: the plan is for it to show what this installer set up.
  - hammunition-hill
  # Its tray applet: switches for parking the GPS and the modem, KDE only.
  # A machine with no Plasma session defers it by name and the rest of the
  # profile installs, rather than pulling in plasma-workspace (D-060).
  - hammunition-tray
  # The same switch for Xfce, LXQt, LXDE, MATE and Cinnamon; deferred by
  # name on a machine with none of those, as the applet is without Plasma.
  - hammunition-tray-qt

documentation:
  what_it_installs: >-
    Hamlib's command-line tools, a rig control panel that other programs can
    share, and `rig-service`, which runs one shared `rigctld` for the radio
    you name with `station set --rig` (deferred by name until you do), the one
    radio programmer that covers hundreds of models, GPS for position and
    time with the converter that gets tracks off a handheld, two clocks,
    pipx, Hammunition Hill -- the family's own local-first dashboard,
    installed from its release .deb and served to your browser on
    127.0.0.1:8073 -- and the tray switches for the desktop you run (KDE's
    applet, or the Qt tray for Xfce, LXQt, LXDE, MATE and Cinnamon), which
    park and wake devices and start and stop services.
  why_together: >-
    This is what every other profile quietly assumes is already there. A
    digital-modes setup needs something to key the radio; a logger needs to
    know the frequency; anything timed needs the clock to be right. Installing
    it once and by name is better than each profile pulling in half of it.

    Two pieces earn their place beyond the obvious. **One program owns the CAT
    port and the rest ask it**, which is what lets fldigi, WSJT-X and a logger
    share a radio instead of the second program to start finding the port busy
    — that is the normal digital-modes setup, and without something in the
    middle it does not work. By default that program is `rigctld`, run for you
    by `rig-service` as a user service on 127.0.0.1:4532 (D-073); flrig, which
    gives a front panel and an XML-RPC server, is the other route, chosen with
    `station set --rig-owner flrig`. **`rigctl` is the diagnostic** that separates a radio problem from a program
    problem: when fldigi will not key the transmitter, one command answers
    whether hamlib can.
  deliberately_excludes: >-
    Per-manufacturer radio tools. `wfview` is Icom, `kappanhang` is Icom
    network radios, `qdmr` and `dmrconfig` are DMR, `icom` is CI-V,
    `tmd710-tncsetup` is two Kenwood models. All are in the catalog and all
    belong to whoever owns that radio; putting them in the floor would install
    six manufacturers' software on every machine. CHIRP is the exception
    because it covers hundreds of models across most manufacturers, which makes
    it a general tool rather than a specific one. Also excludes loggers,
    propagation tools and anything mode-specific — those are their own
    profiles, which is the whole point of the split.
  manual_configuration: >-
    **Serial access needs the `dialout` group, and adding you to it does not
    affect a session that is already open** — log out and back in. Rig control
    needs your radio's hamlib model number, which `rigctl -l` lists and which is
    the thing most often set wrong; a mismatched backend gives partial control,
    where frequency works and mode does not, which reads as a broken cable.
    Icom radios additionally need the CI-V address matched to the radio's own
    menu. **Decide who owns the serial port**: say which radio you have with
    `hammunition station set --rig ... --rig-device ... --rig-baud ...`, run
    `hammunition install rig-service`, and point every program at
    `127.0.0.1:4532` (the guide, docs/guides/rig-control.md, has the table), or
    choose flrig and point everything at it. Two programs opening the port
    directly is the classic failure and its symptom is erratic behaviour
    rather than an error. The tray switches need `hammunition hardware apply`
    run once, to write the lists they read (docs/guides/tray-controls.md). `pipx ensurepath` needs
    a new shell before it takes effect. **Hammunition Hill is running from
    the moment its package lands**: the .deb enables and starts
    `hammunition-hill.service` as its own `hamhill` user, bound to loopback.
    Give it your callsign and an ADIF log in
    `/etc/hammunition-hill/config.toml` and restart the service; leave the
    host at 127.0.0.1.
  disk_footprint_hint: >-
    Around 125 MB. CHIRP and its wxPython dependency are most of it;
    Hammunition Hill's .deb is under half a megabyte plus two Python
    libraries.
  who_for: "Everyone who will operate from this machine. Install it first, before any mode profile, because every other profile quietly assumes rig control, a correct clock and a position source are already there."
  hardware_assumed: "None to install it. It is for a radio with a CAT or serial cable (rig control) and a USB GPS receiver (position and time); both are optional until you want those features."
  footprint_short: "about 125 MB"
  excludes_short: "per-manufacturer radio tools, loggers, anything mode-specific"
  goals:
    - "Control my radio from the computer (CAT) and share it between programs"
    - "Keep the clock right with no network (GPS time)"
    - "Make FT8, JS8Call or PSK31 contacts"
    - "Send email by radio (Winlink) or run packet"
    - "Program a handheld radio"
  first_ten_minutes:
    - "Read what will happen: `hammunition install station --dry-run`. Expect two entries under *Will NOT happen*: `rig-service` (it waits until you name your radio) and, on a desktop that is not Xfce, LXQt, LXDE, MATE or Cinnamon, `hammunition-tray-qt`. Neither is a failure."
    - "Tell the engine who you are: `hammunition station set --callsign N0CALL --grid-square FN31pr`, with your own values in place of the placeholders. Nothing is invented for you; a missing value defers one file, not the install."
    - "Install: `hammunition install station`. It asks for your `sudo` password once, near the start."
    - "Write the udev rules and join the device groups: `hammunition hardware apply --dry-run`, read it, then `hammunition hardware apply`. **Log out and back in afterward**; a group you were just added to does not reach a session that is already open."
    - "If you have a radio with CAT: find its model with `rigctl -l | grep -i <your radio>` and its port with `ls -l /dev/serial/by-id/`, then `hammunition station set --rig <device-or-hamlib:MODEL> --rig-device <port> --rig-baud <rate>` and `hammunition install rig-service`."
    - "Check that the shared rig service answers: `systemctl --user status hammunition-rigctld`, then `rigctl -m 2 -r 127.0.0.1:4532 f`, which prints the radio's frequency. [Rig control (CAT)](../guides/rig-control.md) has every step and the symptom list."
    - "Check the clock and the GPS with `hammunition doctor` (the `time` and `station` lines). [Time and position](../guides/time-and-gps.md) explains what each state means."
    - "Next: a mode profile. [Digital modes](digital-modes.md) is the usual one."
