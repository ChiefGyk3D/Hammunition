name: rfid
summary: RFID and NFC — card protocols, readers, and the tooling to study them
stage: "post-1.0"

# Accepted per Q-010: a separate profile rather than folding RFID into
# rf-security. Different range, different hardware, different skills, and
# essentially no overlap in software.
#
# NOT consent-gated, and the reasoning matters because it is the closest call in
# the catalog. Reading a card you are holding is not the kind of capability the
# D-021 taxonomy is about -- there is no third party, no protected
# communication, no spectrum being disrupted. `third_party_systems` would cover
# testing a system you do not own, and that is a property of what an operator
# chooses to do rather than of what this profile installs. Gating routine
# software teaches people to dismiss gates, which is what would make the
# rf-research gate useless when it matters.
packages:
  - libnfc-bin
  - libfreefare-bin
  - mfoc
  - mfcuk
  - pcsc-tools
  - proxmark3

documentation:
  what_it_installs: >-
    Tools for two different card worlds. Five packages cover 13.56 MHz over
    libnfc and PC/SC -- reader diagnostics, MIFARE Classic key recovery, and
    DESFire management -- and one, the Proxmark3 client, covers both 13.56 MHz
    and the 125 kHz low-frequency cards nothing else here reaches.
  why_together: >-
    They are the same domain at two frequencies and two price points. The libnfc
    side runs on a reader costing a few pounds and is where most people start;
    the Proxmark3 is purpose-built hardware that reaches the low-frequency
    access-control cards actually deployed in buildings. Studying one without
    the other gives half the picture, and the two families of tool do not
    overlap in what they can talk to.
  deliberately_excludes: >-
    Anything that is not card-range. Long-range RFID, UHF and the 900 MHz
    inventory-tag world are a different domain again and are not here. Nothing
    aimed at cloning credentials for use rather than for study, and no
    pre-loaded key dictionaries -- the tools take those as input if you supply
    them. Also excluded is the vendor tooling for proprietary readers, which is
    neither free software nor packaged anywhere.
  manual_configuration: >-
    Membership of `dialout` and `plugdev` for the Proxmark3, from the hardware
    catalog. Serial PN53x readers need an entry in /etc/nfc/libnfc.conf; USB
    ones usually do not. The one that catches everyone: pcscd and libnfc compete
    for the same reader, whichever claims it first wins, and the other reports
    no device at all -- stop pcscd if libnfc tools suddenly stop seeing your
    hardware.
  disk_footprint_hint: >-
    Under 50 MB from apt. The Proxmark3 source build is larger and pulls an ARM
    cross-compiler, because the client ships the firmware images it flashes; on
    Kali it is a package like any other.
