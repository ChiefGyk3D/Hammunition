name: sdr
summary: Software-defined radio — receivers, GNU Radio, and the driver layer
stage: "1.0"

# D-020 says profile resolution consults detected hardware, and this is the
# profile that needs it most: the Debian Blend's `sdr` task carries twelve
# per-device SoapySDR modules and a one-dongle user needs exactly one. Hardware
# detection is not written (M4), so this ships the software plus the driver
# stack for the device almost everyone actually has, and names the rest.
packages:
  - gqrx-sdr
  - sdrpp
  - cubicsdr
  - gnuradio
  - gr-osmosdr
  - gr-fosphor
  - soapysdr-tools
  - soapysdr-module-rtlsdr
  - rtl-sdr
  - soapyremote-server
  - soapysdr-module-remote
  - inspectrum
  - gr-rds
  - quisk
  - pihpsdr
  - gnss-sdr

documentation:
  what_it_installs: >-
    Three general-purpose receivers with waterfalls, GNU Radio and the block
    that lets a flow graph talk to almost any radio, fosphor's GPU-drawn
    spectrum and waterfall blocks for it, the SoapySDR tools and the
    RTL-SDR driver stack, the client and server halves of network SDR sharing,
    an offline signal visualiser, an RDS decoder, two transceiver applications
    for hardware that transmits -- Quisk, and piHPSDR for OpenHPSDR radios
    such as the ANAN and the Hermes Lite 2 -- and a complete GPS receiver in
    software.
  why_together: >-
    Everything here works with one cheap dongle, and the driver layer is what
    makes the applications interchangeable — software written against SoapySDR
    reaches your radio through a module, which is why installing the right one
    is usually the difference between an application listing your radio and
    showing an empty device list.

    **The network pair is worth the two packages.** Run the server where the
    antenna is and the client where you are sitting, and every SoapySDR program
    reaches the remote radio unchanged. Getting the antenna away from a modern
    house is the single biggest improvement available to most receivers.
  deliberately_excludes: >-
    **Eleven of the twelve per-device SoapySDR modules.** Airspy, bladeRF,
    LimeSDR, MiriSDR, PlutoSDR, Red Pitaya, RFSpace, USRP, OsmoSDR, audio and
    the FUNcube all have manifests and none is installed here, because a
    one-dongle user needs one module and installing twelve to be safe is
    exactly what D-020 exists to avoid. Install the one matching your hardware
    by name. **The HydraSDR RFOne and the RigExpert Fobos SDR** (`hydrasdr-host`
    and `soapysdr-module-hydrasdr`; `libfobos`, `libfobos-sdr-agile` and
    `soapysdr-module-fobos`) are the same case and a heavier one: on most
    targets they are source builds, so installing them for hardware you do
    not own would compile five projects for nothing. `soapysdr-module-rtlsdr` is the exception on frequency grounds
    rather than principle: an RTL-SDR is what most people have.

    Also excludes transmit-capable research and interception tooling, which
    is `rf-security` and the consent-gated `rf-research`. The two
    transceiver programs here, `quisk` and `pihpsdr`, transmit the way a
    station transceiver does: when you key them, on the frequency shown, and
    a licence and the band plan apply. Installing them transmits nothing;
    the profile also excludes the DAB transmit chain,
    which emits into a broadcast band; and the aeronautical and utility
    decoders, which are `listening`.
  manual_configuration: >-
    **A dongle that works under `sudo` and not otherwise is a permissions
    problem.** Device access needs a udev rule and usually the `plugdev` group;
    the hardware catalog carries the rules and `hammunition hardware apply` writes
    them and adds you to the groups (log out and back in afterward). `SoapySDRUtil --find` is the
    first command to run when a radio is invisible — it separates a USB or
    permissions problem from a missing module from an application bug.

    **Determine your dongle's frequency error once** and keep the PPM
    correction; several decoders fail to lock rather than reporting an error
    when it is wrong. `soapyremote-server` has no authentication at all —
    anyone who can reach the port can use your radio and hear what it hears —
    so it belongs on a trusted network or behind a tunnel, deliberately.
    Quisk is configured in Python rather than through a dialog; the shipped
    examples are the starting point and this is the step that stops people.
    fosphor's blocks need an OpenCL driver for the graphics hardware, which
    nothing here installs; `clinfo` shows whether one is present, and the
    `gr-fosphor` package page says what the archives offer.
  disk_footprint_hint: >-
    Around 1.5 GB, most of it GNU Radio and its Python stack. Without GNU Radio
    the rest is roughly 300 MB. `gr-fosphor` (added 2026-09-30) also pulls
    `gnuradio-dev`, GNU Radio's development headers; what that adds has not
    been measured. `pihpsdr` (added 2026-10-01) is a source build whose
    GTK 3 development dependencies came to about 1.0 GB on a bare debian:13
    image. Its first start
    spends minutes to an hour computing FFTW wisdom; see its package page.
  who_for: "Anyone with, or about to buy, a software-defined radio: a twenty-pound RTL-SDR dongle, an Airspy, a HackRF or a transceiver such as an ANAN. It is the receiver and driver layer the listening, satellite and security profiles stand on."
  hardware_assumed: "An SDR and an antenna. Without one the programs install and open but have nothing to tune; the SoapySDR remote client can reach a radio on another machine."
  footprint_short: "about 1.5 GB, most of it GNU Radio"
  excludes_short: "eleven of twelve per-device SoapySDR modules (install yours by name)"
  goals:
    - "Listen with a cheap SDR dongle"
    - "Decode aircraft, ships, DAB or other signals with an SDR"
    - "Build my own signal-processing flow graphs (GNU Radio)"
  first_ten_minutes:
    - "Read the plan: `hammunition install sdr --dry-run`. GNU Radio is the large part."
    - "Install: `hammunition install sdr`."
    - "Apply the udev rules so your dongle opens without root: `hammunition hardware apply --dry-run`, then `hammunition hardware apply`, then **log out and back in**."
    - "Plug the dongle in and run `rtl_test` for an RTL-SDR or `SoapySDRUtil --find` for anything else. Seeing the device here separates a USB or permissions problem from a missing module from a program bug."
    - "If your radio is not an RTL-SDR, install its one SoapySDR module by name, for example `hammunition install soapysdr-module-airspy`; `hammunition list packages` shows the names."
    - "Open `gqrx`, tune broadcast FM and listen. [SDR first steps](../guides/sdr.md) takes you from there to aircraft, 433 MHz sensors and ships."
    - "Work out your dongle's frequency error once and keep the PPM correction; several decoders fail to lock rather than reporting it."
