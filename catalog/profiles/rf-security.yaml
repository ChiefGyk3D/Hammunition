name: rf-security
summary: Spectrum analysis, wireless auditing and protocol inspection
stage: "1.0"

# NOT consent-gated, deliberately. D-021.
#
# Every package here ships in Debian, Kali or Parrot without ceremony. Gating
# them would be theatre, and worse: a prompt that appears for routine software
# is a prompt people learn to dismiss, which is exactly what would make the
# `rf-research` gate useless when it matters.
#
# Sized in docs/reference/profile-sizing.md; membership measured in
# docs/reference/dragonos-tier1-inventory.md.
packages:
  - aircrack-ng
  - esptool
  - hcxdumptool
  - hcxtools
  - inspectrum
  - kismet
  - rtl-433
  - tcpdump
  - ubertooth
  - wireshark
  - artemis
  - rayhunter
  - skid-finder

documentation:
  what_it_installs: >-
    Tools for looking at radio and network traffic you are entitled to look at:
    a protocol analyser, Wi-Fi and Bluetooth capture tooling, a wireless
    device detector and logger (Kismet) that puts Wi-Fi, Bluetooth and
    sniffer dongles in one view, an offline signal visualiser, a decoder for
    the unlicensed ISM bands, and an offline signal-identification reference
    (Artemis) for naming what the visualiser shows.
  why_together: >-
    All of it is receive-and-analyse, and none of it is specific to protected
    communications. Most of it installs from each target's own archive with
    no ceremony. Two units do not: Artemis is a venv from its source tarball,
    because its vendor package collides with an unrelated Debian package of
    the same name (D-048); and Kismet is in Kali's and Parrot's archives but
    not in Debian 13's, Ubuntu's or Mint's, so on Debian 13, Ubuntu 24.04 and
    Mint 22.3 it comes from the Kismet project's own signed repository, added
    only after you type its key fingerprint (D-040). On those three targets,
    installing this profile therefore asks that one question, and `--yes`
    cannot answer it; declining stops the whole transaction, and every other
    member can still be installed by name. Ubuntu 26.04 has no Kismet
    release repository yet, so there Kismet is deferred and the rest
    installs (D-039).
  deliberately_excludes: >-
    Anything that transmits, and anything aimed at cellular. `esptool` is the
    edge case D-026 was written for and is included: it writes bytes to a serial
    port, and the firmware people write with it comes from upstream and runs on
    the device rather than on the host. Gating a flasher would gate the serial
    console next, and then `lsusb`. What is held back for `rf-research`
    (consent-gated) is transmit-capable and cellular tooling — not the flasher,
    the console, or `lsusb`. Kismet is included, ungated for the same
    reason Wireshark and aircrack-ng are: it captures and logs what it
    hears, and gates attach to profiles whose capability is the hazard
    (D-021), not to a sniffer. It had been held back until the third-party
    repository path existed; D-040 built that on 2026-09-03 and Kismet
    joined on 2026-09-30. The CatSniffer V3's Kismet capture helpers are in
    no Kismet release yet, so that board is not a Kismet source here.
  manual_configuration: >-
    Wireshark asks at install time whether non-root users may capture; that
    choice adds users to the `wireshark` group and is recorded as a system
    modification. Monitor-mode capture needs a supported adapter. Ubertooth
    needs its udev rules and group membership from the hardware catalog.
    Kismet adds you to the `kismet` group (log out and back in), serves its
    interface at http://localhost:2501 -- on every network interface unless
    you set `httpd_bind_address=127.0.0.1` in /etc/kismet/kismet_site.conf --
    and asks the first browser to connect to set its login. On Kali and
    Parrot its package also enables a root `kismet.service` at boot; `sudo
    systemctl disable --now kismet.service` if you only want it on demand.
    See docs/rf-security/kismet.md.
  disk_footprint_hint: >-
    Roughly 300 MB with dependencies, dominated by Wireshark. Kismet's share,
    by apt's own estimate on 2026-09-30: 36 MB on a bare Parrot image, 72 MB
    on a bare Kali one (more of its libraries already present on a real
    desktop install).
