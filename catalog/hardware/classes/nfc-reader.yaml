groups:
  - plugdev

packages:
  - libnfc-bin
  - libfreefare-bin
  - pcsc-tools

udev:
  symlink: nfc
  serial_suffix: true
  mode: "0660"
  group: plugdev
  tag_uaccess: true

documentation:
  what_it_is: >-
    A device class rather than a single device: the USB contactless readers
    built on NXP's PN531, PN532 and PN533 controllers, sold under many names —
    the ACR122U and Touchatag being the ones most people meet first.
  what_you_can_do_with_it: >-
    Read, write and analyse 13.56 MHz contactless cards: MIFARE Classic,
    Ultralight and DESFire, and NFC tags generally. With a supported reader,
    emulate a tag or relay between two of them.
  setup_steps: >-
    Install the class packages, join `plugdev`, then log out and back in —
    group membership does not apply to an existing session. USB readers are
    usually found without configuration; a serial reader needs an entry in
    /etc/nfc/libnfc.conf. `nfc-list` should report the reader and its firmware.
  known_problems: >-
    pcscd and libnfc compete for the same reader — whichever claims it first
    wins and the other reports no device at all. That is the single most common
    confusion with this hardware, and the fix is to stop pcscd when using libnfc
    tools. The ACR122U in particular is claimed by pcscd on most desktops the
    moment it is plugged in. These readers are 13.56 MHz only: they cannot see a
    125 kHz card at all, which surprises people arriving from access-control
    work. Cheap clones misreport their own firmware capabilities.
  upstream_url: https://github.com/nfc-tools/libnfc
