kind: class
name: nfc-reader
summary: PN53x-based NFC readers — the contactless equivalent of the badgelife class

# The second device class, and written for the same reason as the first: these
# readers differ in badge and price and not at all in what Linux needs. libnfc
# talks to all of them, they all want plugdev, and Debian ships one udev rule
# covering the family. Build the class once and every reader works.
#
# Every identifier here is transcribed from Debian's own rule, which is why they
# are all confirmed while most of the device catalog is not. That is the point
# worth noticing: a distribution's udev rules are an under-used primary source,
# and reading them is cheaper and more reliable than owning the hardware.
#
# Serves the `rfid` profile. Distinct from a Proxmark, which is not PN53x, is
# not covered by this rule, and reaches 125 kHz where these do not.

