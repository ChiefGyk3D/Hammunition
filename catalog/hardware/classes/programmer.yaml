documentation:
  what_it_is: 'The adapters that talk to a chip rather than to a computer: JTAG and SWD debug
    probes, SPI flash clips, AVR programmers and FPGA loaders. One class because their Linux-side
    need is identical — unprivileged access to a USB device — and because the five Debian
    packages that drive them name overlapping sets of the same hardware.'
  what_you_can_do_with_it: 'Read and write the firmware of a microcontroller, dump or reflash
    an SPI ROM, load a bitstream into an FPGA, and single-step code on a target board. In
    this catalog''s terms that is device tooling and not a capability claim (D-026): what
    a programmer may lawfully be pointed at is a matter for the operator, and installing one
    is not an argument about it.'
  setup_steps: Install the tools you need, join `plugdev` and `dialout`, then log out and
    back in — group membership does not apply to a session already open. There is no symlink
    to look for and that is deliberate; see the known problems.
  known_problems: 'These are the most heavily shared identifiers in the archive. 11 of the
    180 are claimed by at least one package outside this class, and the two that matter most
    to this project are claimed by `libhamlib4t64`: 0403:6001, 16c0:05dc. Those are the ONLY
    two identifiers hamlib claims. A rig-control cable and a JTAG adapter built on the same
    FTDI chip are the same USB device to the kernel, so the access this class grants cannot
    be given to one without giving it to the other.


    That is why there is no symlink here at all — naming any of these would claim hardware
    it does not identify (D-028) — and why the class asks for group membership rather than
    anything cleverer. An operator who wants a stable name for one specific programmer wants
    a station-local rule matching its serial, not a catalog-wide one matching its chip.


    avrdude and openocd also drive parallel-port and network programmers that have no USB
    identifier at all and are therefore invisible to this class.'
  upstream_url: https://openocd.org/
