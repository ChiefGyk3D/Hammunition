kind: class
name: badgelife
summary: Conference badges and SAOs — serial console, flashing, and the USB bridges they use

# Generalised deliberately. ESP32-based conference badges are everywhere and
# their Linux-side needs are identical: a serial console, a flasher, and udev
# rules covering native USB CDC plus the two bridge chips older designs use.
# Build the class once and every badge works. A specific badge is then a worked
# example, not a special case.

usb_ids:
  - vendor: "10c4"
    product: "ea60"
    description: Silicon Labs CP2102/CP2109 UART bridge — the most common badge bridge
    evidence: Debian 13 usb.ids (usb.ids package), vendor 10c4 "Silicon Labs", product ea60 "CP210x UART Bridge"
    confirmed: true
    ambiguity:
      basis: kernel_generic_driver
      evidence: >-
        Debian 13 modules.alias binds this pair to the cp210x driver, a
        general-purpose USB-serial bridge. The kernel maintainers list it in a
        bridge driver's table, which is the closest thing to an authoritative
        statement that the pair names silicon and not a product.
      also_used_by:
        - any board using a Silicon Labs CP210x bridge
  - vendor: "10c4"
    product: "ea70"
    description: Silicon Labs CP2105 dual UART bridge
    evidence: Debian 13 usb.ids, product ea70 "CP2105 Dual UART Bridge"
    confirmed: true
    ambiguity:
      basis: kernel_generic_driver
      evidence: >-
        Debian 13 modules.alias binds this pair to the cp210x driver, a
        general-purpose USB-serial bridge. The kernel maintainers list it in a
        bridge driver's table, which is the closest thing to an authoritative
        statement that the pair names silicon and not a product.
      also_used_by:
        - any board using a Silicon Labs CP210x bridge
  - vendor: "10c4"
    product: "ea71"
    description: Silicon Labs CP2108 quad UART bridge
    evidence: Debian 13 usb.ids, product ea71 "CP2108 Quad UART Bridge"
    confirmed: true
    ambiguity:
      basis: kernel_generic_driver
      evidence: >-
        Debian 13 modules.alias binds this pair to the cp210x driver, a
        general-purpose USB-serial bridge. The kernel maintainers list it in a
        bridge driver's table, which is the closest thing to an authoritative
        statement that the pair names silicon and not a product.
      also_used_by:
        - any board using a Silicon Labs CP210x bridge
  - vendor: "1a86"
    product: "7523"
    description: WCH CH340 UART bridge — common on low-cost badges
    evidence: Debian 13 usb.ids, vendor 1a86 "QinHeng Electronics", product 7523 "CH340 serial converter"
    confirmed: true
    ambiguity:
      basis: kernel_generic_driver
      evidence: >-
        Debian 13 modules.alias binds this pair to the ch341 driver, a
        general-purpose USB-serial bridge. The kernel maintainers list it in a
        bridge driver's table, which is the closest thing to an authoritative
        statement that the pair names silicon and not a product.
      also_used_by:
        - any board using a WCH CH340 bridge
  - vendor: "303a"
    product: "1001"
    description: Espressif ESP32-S3/C3 native USB CDC and JTAG-serial peripheral
    evidence: >-
      CONFIRMED BY CAPTURE 2026-08-26 on Pop!_OS 22.04, three times, on three
      unrelated products: the Clip-Boy, the Minino, and the ESP32-S3 inside a
      Free-WiLi 2. All three report manufacturer=Espressif and product="USB
      JTAG/serial debug unit"; only the serial (a MAC address) differs.
      Previously carried as unconfirmed on the strength of esptool 4.7.0 calling
      0x1001 USB_JTAG_SERIAL_PID.
    confirmed: true
    ambiguity:
      basis: vendor_chip_default
      evidence: >-
        A constant of the ESP32-S3/C3 USB-serial-JTAG peripheral rather than an
        identifier for any board. The three captures above are the proof: same
        vendor, same product, same product STRING, three entirely different
        products. Nothing a catalog-wide rule can match on separates them, and
        the class is the right home for the pair precisely because it belongs to
        no one device.
      also_used_by:
        - clip-boy
        - minino
        - free-wili-2
        - every ESP32-S3 or ESP32-C3 board using native USB
  - vendor: "1a86"
    product: "55d3"
    description: WCH CH343 USB-serial bridge
    evidence: >-
      CONFIRMED BY CAPTURE 2026-08-26 on Pop!_OS 22.04: a C5 Wardriver v1.1
      presents this pair with product="USB Single Serial" and no manufacturer
      string. usb.ids names it "QinHeng Electronics USB Single Serial"; Debian
      13 modules.alias binds it to cdc_acm.
    confirmed: true
    ambiguity:
      basis: kernel_generic_driver
      evidence: >-
        A WCH bridge chip. usb.ids names a function -- "USB Single Serial" --
        and boards using it commonly supply no manufacturer or product string of
        their own, as the C5 Wardriver does not, leaving only the per-unit
        serial.
      also_used_by:
        - c5-wardriver
        - any board using a WCH CH343 bridge
  - vendor: "1a86"
    product: "55d4"
    description: WCH CH9102 UART bridge — a sibling of 55d3, carried on report only
    evidence: >-
      Widely reported for the CH9102F, NOT present in Debian 13 usb.ids, and not
      confirmed against any hardware here. Worth keeping as a worked example of
      the difference a capture makes: this pair was the class's guess at what a
      CH343-family board would present, and when one was finally captured on
      2026-08-26 it turned out to be 55d3. One digit out. A widely-reported
      identifier is not evidence, and the rule it generates would silently never
      match.
    confirmed: false
    ambiguity:
      basis: generic_function_name
      evidence: >-
        A UART bridge chip either way, so ambiguous regardless of whether the
        identifier itself is ever confirmed -- a bridge identifies silicon
        rather than a product.
      also_used_by:
        - any board using a WCH CH9102 bridge

groups:
  - dialout
  - plugdev

packages:
  - esptool
  - tio
  - screen
  - minicom

firmware:
  - kind: esptool
    packages: [esptool]
    note: >-
      Most ESP32 badges flash over the same serial link used for the console.
      Many enter bootloader mode automatically via DTR/RTS; some need BOOT held
      while RESET is tapped. Nothing here flashes anything on its own.

# NO CLASS-LEVEL SYMLINK, and this is a correction rather than an omission.
#
# This class previously emitted /dev/badge-<serial> for every identifier above.
# Every one of them is a bridge chip: the kernel binds 10c4:ea60 to cp210x and
# 1a86:7523 to ch341, and 303a:1001 is Espressif's chip-level constant. A rule
# matching those names every CP2102 adapter on the machine after whichever badge
# it was written for -- a rig-control cable, a GPS puck, a Meshtastic node --
# and the operator sees a symlink pointing at the wrong device, with no error
# anywhere. The same silent failure as the rtl-sdr gap, pointed the other way.
#
# The right answer for USB-serial devices is the one that already exists:
# systemd's 60-serial.rules populates /dev/serial/by-id/ from the manufacturer,
# product and serial strings in the descriptor, per unit, with no help from us.
# Where a board carries a serial it is already distinguishable there.
#
# A device-specific symlink is still worth having for an OPERATOR-CHOSEN role
# name -- /dev/rig-991a is more useful than a by-id path nobody memorises -- and
# that belongs in station-local configuration with a match_serial for the
# specific unit, not in a catalog-wide class rule. See D-028.

documentation:
  what_it_is: >-
    A device class rather than a single device: conference badges, SAOs and the
    development boards they are built from, nearly all of which present as a USB
    serial port either natively or through a CP210x or CH34x bridge.
  what_you_can_do_with_it: >-
    Open a serial console to read badge output and use its shell if it has one,
    and flash new or modified firmware from Linux rather than from a browser.
  setup_steps: >-
    Install the class packages, add yourself to dialout and plugdev, then log out
    and back in — group membership does not apply to an existing session. Plug the
    badge in and check for a persistent symlink under /dev. `tio /dev/badge-<serial>`
    opens a console; 115200 8N1 is the usual default.
  known_problems: >-
    ModemManager grabs new serial devices on many desktops and holds them for
    around twenty seconds, which looks exactly like a dead badge. The generated
    udev rules tag matching devices so ModemManager ignores them. A badge whose
    native USB stack is provided by its own firmware will disappear from /dev when
    that firmware crashes or is being replaced; that is expected, not a fault.
    Two identical badges attached at once is exactly why serial_suffix defaults on.
  upstream_url: https://github.com/espressif/esptool
