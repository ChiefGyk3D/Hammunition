kind: device
name: meshtastic
summary: Meshtastic LoRa nodes — T-Deck, T-Echo, RAK and WisMesh boards
vendor: various (LilyGO, RAK Wireless, Heltec)
device_class: badgelife
status: supported

# Closed from upstream data, not from hardware -- and it could not have been
# closed any other way. The maintainer's Meshtastic boards were lost in a flood,
# and Meshtastic was never one device to begin with: it is firmware that runs on
# a hundred of them.
#
# Meshtastic and MeshCore both build with PlatformIO, so every supported board
# ships a boards/*.json naming the identifiers its flasher looks for. That is
# the same class of source as Debian's udev rules, pointed somewhere Debian
# cannot reach. 107 board definitions across the two projects yield 26 distinct
# identifiers -- and the top one covers 49 boards.
#
# So this entry carries the identifiers a Meshtastic node is likely to present
# and asserts nothing about WHICH node. Every one is ambiguous by measurement:
# the pair names the module a board is built on, not the board. See
# docs/reference/lora-inventory.md.

usb_ids:
  - vendor: "303a"
    product: "1001"
    description: Espressif ESP32-S3/C3 native USB — the most common Meshtastic path
    evidence: >-
      Meshtastic and MeshCore PlatformIO board definitions, read 2026-08-26 by
      scripts/lora-sweep.sh. Claimed by 49 distinct board definitions
      across the two projects. Also captured directly from three unrelated non-Meshtastic devices; see badgelife.
    confirmed: true
    node_kind: serial
    ambiguity:
      basis: vendor_chip_default
      evidence: >-
        Claimed by 49 different products in the upstream board metadata,
        which is what "shared" means measured rather than asserted. The pair
        identifies the module a board is built on, not the board.
      also_used_by:
