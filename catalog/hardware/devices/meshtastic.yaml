# NO SYMLINK, and no prospect of one at this level. Every identifier above is
# shared across dozens of products by measurement. A per-board entry could
# carry one if that board turns out to supply a distinguishing product string --
# which the board definitions do not record, because a flasher does not need it.
# Only a capture shows a descriptor string, and that is the part upstream data
# cannot supply.

identification_gap: >-
  Not closable as a single record, and now for a documented reason rather than
  an unexplored one. The identifiers are confirmed from upstream board metadata
  covering 107 products; what no upstream source records is the manufacturer and
  product STRINGS a running board reports, because a flasher matches on VID:PID
  and never needs them. Those strings are the only thing that could make a
  per-board udev rule safe.

  So the remaining work is per-board captures, and it is a contribution ask
  rather than a task: the maintainer's boards were lost to flooding, and anyone
  with a T-Deck, a T-Echo, a RAK or a Heltec can close one board's worth in
  thirty seconds with scripts/identify-device.sh.
gap_closure: unverified_by_maintainer

groups: [dialout, plugdev]
packages: [python3-meshtastic, gtk-meshtastic-client, tio]
firmware:
  - kind: esptool
    packages: [esptool]
    note: ESP32-based nodes such as T-Deck flash with esptool over the serial port.
  - kind: uf2
    packages: []
    note: >-
      nRF52840 boards such as T-Echo use a UF2 bootloader — double-tap reset and
      the board mounts as a USB mass storage device you copy firmware onto. No
      flashing tool is needed, but the device enumerates as storage rather than
      serial while in that mode, so a serial udev rule will not match it.
documentation:
  what_it_is: >-
    Long-range low-power mesh networking over LoRa, running on a wide range of
    inexpensive boards. The node is the radio; the phone or computer is a client.
  what_you_can_do_with_it: >-
    Text messaging and position sharing over a mesh with no infrastructure, at
    ranges measured in kilometres, on licence-free ISM bands.
  setup_steps: >-
    Both python3-meshtastic and gtk-meshtastic-client are in Debian 13 — measured,
    not assumed. Add yourself to dialout, attach the node, and talk to it over the
    serial port with the CLI.
  known_problems: >-
    Regional frequency settings are the operator's responsibility and the defaults
    may not match where you are. ModemManager grabbing the serial port affects
    these boards as much as any badge. Firmware and client versions drift quickly.
  upstream_url: https://meshtastic.org/
