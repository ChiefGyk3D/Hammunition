kind: device
name: c5-wardriver
summary: C5 Wardriver v1.1 — justcallmekoko's ESP32 survey board, runs Marauder-family firmware
vendor: justcallmekoko (community hardware)
status: supported

# Captured against real hardware 2026-08-26, after flashing. The entry expected
# an ESP32 on native USB, inheriting badgelife's 303a:1001 like the Clip-Boy and
# the Minino. It does not: it presents a WCH CH343-family bridge, 1a86:55d3.
#
# So the wait for flashing was worth it for a reason other than the one given.
# The stated reason was that an unflashed ESP32 shows its ROM bootloader; the
# actual payoff is that this board never had the identifier the class predicted,
# and a capture taken on the assumption it would have been read as confirmation.
#
# It also lands next to a guess already in the catalog. badgelife carries
# 1a86:55d4 as an UNCONFIRMED CH9102/CH343 identifier, "widely reported". The
# real board is 55d3. One digit out, and the guessed one is still unconfirmed --
# a good illustration of why a widely-reported identifier is not evidence.
device_class: badgelife

usb_ids:
  - vendor: "1a86"
    product: "55d3"
    description: WCH CH343 USB-serial bridge, as used on this board
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04, via
      scripts/identify-device.sh. product="USB Single Serial" serial=5B7B027280,
      presenting /dev/ttyACM0. No manufacturer string at all. usb.ids names
      1a86:55d3 "QinHeng Electronics USB Single Serial".
    confirmed: true
    ambiguity:
      basis: kernel_generic_driver
      evidence: >-
        Debian 13 modules.alias binds 1a86:55d3 to cdc_acm, and it is on the
        generated ambiguity list. usb.ids calls it "USB Single Serial", which is
        a function rather than a product, and the board supplies no manufacturer
        string and no product string of its own -- so there is nothing beyond
        the per-unit serial to match on.
      also_used_by:
        - any board using a WCH CH343 bridge

# NO SYMLINK. The board contributes no distinguishing descriptor of its own: no
# manufacturer, and a product string of "USB Single Serial" that belongs to the
# bridge chip. Only the serial is specific, and a serial is per-unit.
# /dev/serial/by-id/ carries it already.

maintainer_verified:
  date: 2026-08-26
  by: ChiefGyk3D
  distro: Pop!_OS 22.04
  what_was_tested: >-
    Flashed, attached and enumerated; identifier, product string and serial
    captured with scripts/identify-device.sh. Firmware output was confirmed over
    UART, so the board is running. Its screen did not display correctly, which
    is recorded as a known problem rather than a USB finding.

documentation:
  what_it_is: >-
    A firmware for ESP32 boards that turns them into a handheld 2.4 GHz survey
    tool, sold and built by several people as a self-contained device with a
    screen and battery. The hardware is ordinary ESP32; the Marauder identity is
    the firmware.
  what_you_can_do_with_it: >-
    Scan for Wi-Fi access points and stations and for Bluetooth Low Energy
    advertisements, capture probe requests, and log what is present on the band
    around you. The firmware also includes active features — deauthentication
    frames, beacon spam, and captive-portal impersonation — which transmit
    rather than listen. Stating that plainly is deliberate: nobody should
    discover it by surprise, and operating those features against networks you
    do not own or are not authorised to test is a separate matter from
    installing a flasher.
  setup_steps: >-
    Install the badgelife class packages, join `dialout` and `plugdev`, then log
    out and back in — group membership does not apply to an existing session.
    Plug the board in and run `esptool chip_id`, which reports what the chip
    actually is and is the quickest way to resolve an ambiguous silkscreen.
    `tio /dev/badge-<serial>` opens a console at 115200 8N1. Firmware images
    come from upstream and are flashed with esptool; nothing here flashes
    anything on its own.
  known_problems: >-
    Observed 2026-08-26 on the maintainer's v1.1 board: firmware runs and
    reports over UART, but the screen did not display correctly. That is a board
    or firmware matter rather than anything Linux does, and it is recorded here
    because the symptom -- a device that looks dead but is not -- is exactly what
    someone will search for. Check UART output before assuming the board is
    faulty.

    Several hardware builds share the name and differ in USB bridge, screen and
    button layout, so instructions written for one board may not match another.
    A board whose USB is provided by its own firmware disappears from /dev while
    being reflashed, which is expected rather than a fault. ModemManager holds a
    newly attached serial device for around twenty seconds on many desktops,
    which looks exactly like a dead board; the generated udev rules tag matching
    devices so it ignores them.
  upstream_url: https://github.com/justcallmekoko/ESP32Marauder
