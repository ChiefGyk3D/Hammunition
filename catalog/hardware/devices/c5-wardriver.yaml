kind: device
name: c5-wardriver
summary: C5 Wardriver v1.1 — justcallmekoko's ESP32 survey board, runs Marauder-family firmware
vendor: justcallmekoko (community hardware)
status: untested

# Renamed from `esp32-marauder`. The entry was written around the firmware
# because that was the name I had; the maintainer's board is a C5 Wardriver
# v1.1, and ESP32 Marauder is firmware that runs on several boards rather than a
# board itself. Modelling the firmware as the device would have put the
# identifier of whatever hardware happened to be under it into an entry named
# after software -- and the identifier belongs to the board.
#
# The revision IS now known: v1.1, from the maintainer. It was deliberately
# absent before, because the revision determines the USB path and guessing one
# would have defeated the point of the entry.
#
# Still uncaptured: the board needs flashing before first use, so enumeration
# waits on that. Which is itself informative -- an unflashed ESP32 may present
# only its ROM bootloader.
device_class: badgelife

gap_closure: maintainer_hardware
identification_gap: >-
  Not yet captured, and the reason is worth recording rather than treating as a
  delay: the board has not been flashed, and on an ESP32 the USB identity comes
  from the firmware. An unflashed board may present only its ROM download mode,
  which is a different identifier from what it will present in normal
  operation — so a capture taken now would record the bootloader and read as
  though it recorded the device.

  Both are worth having, and they are separate records. The badgelife class
  covers every plausible case in the meantime, which is the point of a class,
  and the class's 303a:1001 is now confirmed against two other boards — so if
  this one is an ESP32-S3 on native USB, it is already covered and already
  ambiguous.

documentation:
  what_it_is: >-
    A firmware for ESP32 boards that turns them into a handheld 2.4 GHz survey
    tool, sold and built by several people as a self-contained device with a
    screen and battery. The hardware is ordinary ESP32; the Marauder identity is
    the firmware.
  what_you_can_do_with_it: >-
    Scan for Wi-Fi access points and stations and for Bluetooth Low Energy
    advertisements, capture probe requests, and log what is present on the band
    around you. The firmware also includes active features — deauthentication
    frames, beacon spam, and captive-portal impersonation — which transmit
    rather than listen. Stating that plainly is deliberate: nobody should
    discover it by surprise, and operating those features against networks you
    do not own or are not authorised to test is a separate matter from
    installing a flasher.
  setup_steps: >-
    Install the badgelife class packages, join `dialout` and `plugdev`, then log
    out and back in — group membership does not apply to an existing session.
    Plug the board in and run `esptool chip_id`, which reports what the chip
    actually is and is the quickest way to resolve an ambiguous silkscreen.
    `tio /dev/badge-<serial>` opens a console at 115200 8N1. Firmware images
    come from upstream and are flashed with esptool; nothing here flashes
    anything on its own.
  known_problems: >-
    Several hardware builds share the name and differ in USB bridge, screen and
    button layout, so instructions written for one board may not match another.
    A board whose USB is provided by its own firmware disappears from /dev while
    being reflashed, which is expected rather than a fault. ModemManager holds a
    newly attached serial device for around twenty seconds on many desktops,
    which looks exactly like a dead board; the generated udev rules tag matching
    devices so it ignores them.
  upstream_url: https://github.com/justcallmekoko/ESP32Marauder
