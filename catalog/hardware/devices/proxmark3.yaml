kind: device
name: proxmark3
summary: Proxmark3 v3 and v5 — RFID and NFC research tool (RDV4 not covered)
vendor: Proxmark community / RRG
status: supported

# Captured against real hardware 2026-08-26, twice, and the second capture is
# the finding.
#
# The Proxmark presents 2d2d:504d -- proxmark.org's own vendor id, so the
# identifier is device-specific and NOT ambiguous. That part is easy. What it
# does not present is anything else at all: no product string, and NO SERIAL.
#
# Two captures were taken under different names and returned byte-identical
# descriptors. Whether that was two boards or one board twice does not change
# the conclusion, and the conclusion is unusually strong: nothing in this
# device's USB descriptor distinguishes one unit from another.
#
# That breaks more than a symlink. `serial_suffix` has nothing to append.
# /dev/serial/by-id/ -- which has been the answer for every other serial device
# in this catalog -- composes its path from manufacturer, product and serial,
# so two attached Proxmarks collide there too. The only discriminator left is
# /dev/serial/by-path/, which names the physical port rather than the device.
#
# So for this device the ordering is inverted: by-path is correct and by-id is
# not. Worth stating because it is the first counter-example to a rule this
# catalog otherwise leans on, and somebody will hit it with two boards attached.

usb_ids:
  - vendor: "2d2d"
    product: "504d"
    description: Proxmark3 in normal operating mode
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04, via
      scripts/identify-device.sh, captured twice under different names with
      identical results. manufacturer=proxmark.org, NO product string, NO
      serial, presenting /dev/ttyACM0. usb.ids names 2d2d "proxmark.org" and
      504d "Proxmark3" -- an identifier the project registered for itself.
    confirmed: true
    node_kind: serial
    reports_serial: false

# NO SYMLINK, and for a reason none of the other entries have: there is no
# serial to suffix and no product string to match. A rule could safely say "this
# is a Proxmark", because 2d2d:504d is unambiguous -- and it could not say WHICH
# Proxmark. With one attached that is harmless; with two it is a coin toss, and
# a coin toss that silently picks the wrong board is what D-028 exists to
# prevent.

maintainer_verified:
  date: 2026-08-26
  by: ChiefGyk3D
  distro: Pop!_OS 22.04
  what_was_tested: >-
    Attached and enumerated, twice, with scripts/identify-device.sh. Both
    captures returned the same identifier, no product string and no serial. The
    client was not built and no card was read.

identification_gap: >-
  Narrowed sharply, and what remains is a real limitation rather than missing
  work. The operating-mode identifier is confirmed. What is NOT established:

  Whether the v3 and v5 boards differ at all in their descriptors. Both captures
  returned identical output, which suggests they do not, but the two runs cannot
  be attributed to two specific boards with confidence from the record kept.

  The bootloader identifier. A Proxmark enumerates differently while its
  bootloader is running, and that was not captured -- it needs the button held
  during attachment.

  Whether any firmware variant supplies a serial. The stock build does not, and
  if some variant does, that changes the story above completely: a serial would
  restore /dev/serial/by-id/ as the answer.
gap_closure: maintainer_hardware

groups: [dialout, plugdev]
packages: []

firmware:
  - kind: bootloader_button
    packages: []
    note: >-
      The Proxmark client flashes both bootloader and application images, and the
      device enumerates with a different identifier while in the bootloader. The
      client is built from source against the firmware it will talk to — client
      and firmware are version-locked and a mismatch is the most common source of
      confusing behaviour. Not packaged in Debian; this needs the source backend.

documentation:
  what_it_is: >-
    A research tool for low-frequency (125 kHz) and high-frequency (13.56 MHz)
    RFID and NFC, able to read, emulate and analyse a wide range of card
    technologies.
  what_you_can_do_with_it: >-
    Read and analyse access cards and transit tokens, study the protocols they
    use, and emulate them for testing systems you are authorized to test.
  setup_steps: >-
    Kali packages the client (proxmark3 4.21611-0kali1, measured 2026-08-26)
    and the `proxmark3` package installs it there. On Debian 13 and Parrot it
    must be built from source against matching firmware, which needs the source
    backend this project has not written — those steps are not documented yet,
    because writing an untested path would be a documentation bug.
  known_problems: >-
    Two attached at once cannot be told apart. The device supplies no product
    string and no serial, so /dev/serial/by-id/ gives both the same path and no
    udev symlink can distinguish them. Use /dev/serial/by-path/, which names the
    physical port, and keep track of which board is in which socket. This is the
    one device in this catalog for which by-path beats by-id.

    Client and firmware are version-locked, and a mismatch is the most common
    source of confusing behaviour. Several incompatible hardware generations
    share the name. This entry covers the v3 and v5 boards, which are what is
    available to test against; an RDV4 is planned and not owned, and is
    deliberately not claimed here.
    Neither the client nor a udev rule is packaged by any target distribution.
  upstream_url: https://github.com/RfidResearchGroup/proxmark3
