kind: device
name: hackrf-pro
summary: HackRF Pro — Great Scott Gadgets' successor to the HackRF One
vendor: Great Scott Gadgets
status: supported

# Captured against real hardware 2026-08-26. This entry previously said the
# maintainer did not own one and marked it `planned`; that was true when it was
# written and is not now.
#
# The capture answered the question the entry had refused to guess at, and the
# answer is the interesting part: the Pro presents 1d50:6089 -- BYTE-IDENTICAL
# to the HackRF One. Great Scott Gadgets reused the identifier for the successor
# board. Only the product string differs: "HackRF Pro" against "HackRF One".
#
# The earlier entry said assuming a successor reuses its predecessor's ids was
# "exactly the family-resemblance guess that produces a rule which silently
# never matches". The guess would have been right. Refusing to make it was still
# correct -- being right by luck is not a method, and the same refusal is what
# produced the far more valuable finding below.
#
# THIS PAIR IS NOT ON THE GENERATED AMBIGUITY LIST. usb.ids names it "Great
# Scott Gadgets HackRF One SDR", a product name, and the generator treats a
# product name as evidence that a vendor bought an identifier for one device.
# Sound in general; wrong here. Hardware found what the sweep could not, which
# is the argument for doing both.

usb_ids:
  - vendor: "1d50"
    product: "6089"
    description: HackRF Pro — the same identifier the HackRF One uses
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04, via
      scripts/identify-device.sh. manufacturer="Great Scott Gadgets"
      product="HackRF Pro" serial=0000000000000000812865de24233c5f. lsusb
      renders the pair as "Great Scott Gadgets HackRF One SDR" from usb.ids,
      which is the database being out of date rather than the device lying.
    confirmed: true
    ambiguity:
      basis: shared_across_products
      evidence: >-
        Confirmed by capture: the HackRF One carries the identical pair. The
        two are distinguishable only by ATTRS{product}. Any rule matching
        1d50:6089 alone claims both.
      also_used_by:
        - hackrf-one

udev:
  # The whole reason this is safe. Without match_product the rule would name a
  # HackRF One /dev/hackrf-pro, and the operator would have no way to tell.
  match_product: HackRF Pro
  symlink: hackrf-pro
  serial_suffix: true
  mode: "0660"
  group: plugdev
  tag_uaccess: true

maintainer_verified:
  date: 2026-08-26
  by: ChiefGyk3D
  distro: Pop!_OS 22.04
  what_was_tested: >-
    Attached and enumerated in both normal and DFU modes; identifiers, product
    strings and serials captured with scripts/identify-device.sh. No /dev node is
    created in either mode, which is expected for a libusb device. Nothing was
    received or transmitted, and no firmware was read or written.

firmware:
  - kind: dfu
    packages: [dfu-util, hackrf]
    dfu_usb_id:
      vendor: "1fc9"
      product: "000c"
      description: NXP LPC4330 in DFU mode — the microcontroller, not the radio
      evidence: >-
        Captured against real hardware 2026-08-26 on Pop!_OS 22.04 by attaching
        a HackRF Pro in DFU mode. manufacturer=NXP product=LPC serial=ABCD, no
        /dev node. Identical to the identifier the HackRF One presents in DFU,
        which Debian's own 60-libhackrf0.rules also carries.
      confirmed: true
      ambiguity:
        basis: shared_across_products
        evidence: >-
          Debian's 60-libhackrf0.rules comments this pair "NXP Semiconductors
          DFU mode (HackRF and rad1o)" -- the rule itself names two devices. The
          capture adds a third, the HackRF Pro, and shows why no rule can do
          better: in DFU the board reports manufacturer=NXP, product=LPC and
          serial=ABCD. Those are the NXP ROM's own constants, identical on every
          LPC4330. Even the serial is a placeholder.
        also_used_by:
          - hackrf-one
          - rad1o
          - any device built on an NXP LPC4330
    note: >-
      In DFU the board is an NXP microcontroller and nothing more: it does not
      report itself as a HackRF, a Pro or anything else. Select it by the port
      you plugged it into, and do not have two LPC4330 devices in DFU at once.


groups: [plugdev]
packages: [hackrf, soapysdr-module-hackrf, gqrx-sdr]

documentation:
  what_it_is: >-
    A wideband half-duplex software defined radio from Great Scott Gadgets, the
    successor to the HackRF One, which has been the default wide-coverage
    transmit-capable SDR in this space for over a decade.
  what_you_can_do_with_it: >-
    The same broad receive and transmit work the HackRF One is used for across a
    very wide frequency range, half-duplex. Coverage and sample rates are
    deliberately not quoted here: this project has enumerated the device, not
    measured it, and D-027 keeps those two claims apart.
  setup_steps: >-
    Install the hackrf host tools, join `plugdev`, then log out and back in.
    `hackrf_info` reports the board and its firmware and is the first check that
    permissions are right. Note the version skew across targets — Debian 13 and
    Parrot ship the 2024.02.1 tools while Kali ships 2026.01.3, and host tools
    are version-locked to device firmware.
  known_problems: >-
    It shares its USB identifier with the HackRF One and is distinguished only
    by its product string, so any udev rule, and any software that selects a
    board by VID:PID, will see the two as the same device. If both are attached,
    expect tools that take the first match to pick arbitrarily. Beyond that, the
    family caveat: this transmits, and transmitting into an unterminated port or
    the wrong antenna risks the hardware regardless of what the software does.
  upstream_url: https://greatscottgadgets.com/hackrf/
