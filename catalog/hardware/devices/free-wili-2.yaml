kind: device
name: free-wili-2
summary: Free-WiLi 2 — multi-function hardware-hacking tool presenting six USB devices
vendor: Intrepid Control Systems / FREE-WILi
status: supported

# Captured against real hardware 2026-08-26. The entry previously said "no USB
# identifier confirmed, and the hardware's USB implementation has not been
# verified here", and guessed the badgelife class rules were "a reasonable
# starting point for anything presenting as USB serial". That guess was wrong in
# an instructive way: this is not one device behind a bridge chip, it is an
# internal hub carrying SIX independent USB devices from four different vendors.
#
# It is also the strongest empirical support for D-028 in the catalog, because
# one of the six is Espressif's 303a:1001 -- the same identifier the Clip-Boy
# presents. Two entirely different products, one pair. That was recorded by hand
# as `vendor_chip_default` on the strength of an esptool constant; it is now
# confirmed by two captures of different hardware.

usb_ids:
  - vendor: "093c"
    product: "2059"
    description: Free-WiLi 2 main interface — four CDC ACM ports
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04, via
      scripts/identify-device.sh. manufacturer=FREE-WILi product=FREE-WILi2
      serial=FX0053. usb.ids attributes vendor 093c to Intrepid Control
      Systems, which is the Free-WiLi vendor.
    confirmed: true
  - vendor: "093c"
    product: "205a"
    description: Free-WiLi 2 secondary interface, reporting firmware v07
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04.
      manufacturer=FreeWili product="FW2 v07" serial=FX0053 — the same board
      serial as 093c:2059, which is how the two are known to be one device.
    confirmed: true
  - vendor: "093c"
    product: "205f"
    description: Free-WiLi 2 mass-storage interface ("FW Ultra Fast Media")
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04.
      manufacturer=FREE-WILi product="FW Ultra Fast Media" serial=0000395D5DB7.
      No /dev node created; it is storage rather than a serial port.
    confirmed: true
  - vendor: "0403"
    product: "6014"
    description: FTDI FT232H bridge inside the Free-WiLi 2
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04.
      manufacturer=FREE-WILi product=FW2 serial=FX0053, presenting /dev/ttyUSB0.
    confirmed: true
    ambiguity:
      basis: kernel_generic_driver
      evidence: >-
        Debian 13 modules.alias binds 0403:6014 to ftdi_sio, and usb.ids names
        it "FT232H Single HS USB-UART/FIFO IC" — a chip, not a product. It is on
        the generated ambiguity list. What makes it usable here is that this
        board sets a device-specific product string, "FW2", so ATTRS{product}
        distinguishes it from any other FT232H.
      also_used_by:
        - any board using an FTDI FT232H
  - vendor: "2e8a"
    product: "000c"
    description: RP2040 CMSIS-DAP debug probe built into the board
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04.
      manufacturer=Multiprobe product="FreeWili Debug Probe (CMSIS-DAP"
      serial=E66568714F71BE29 — a DIFFERENT serial from the rest of the board,
      because it is a separate microcontroller.
    confirmed: true
    ambiguity:
      basis: vendor_chip_default
      evidence: >-
        Vendor 2e8a is Raspberry Pi and 000c is the stock identifier for the
        RP2040-based debug probe firmware, so any board running it presents the
        same pair. Not on the generated list, which reads Debian's udev rules
        and the kernel's module table: this device is claimed by cdc_acm on
        class rather than by identifier, so neither source sees it. That is a
        limit of the sweep, recorded here rather than left implicit.
      also_used_by:
        - any RP2040 running the CMSIS-DAP debug-probe firmware
  - vendor: "303a"
    product: "1001"
    description: Espressif ESP32-S3 native USB JTAG/serial peripheral
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04.
      manufacturer=Espressif product="USB JTAG/serial debug unit"
      serial=3C:DC:75:9A:A5:0C — a MAC address, which is how Espressif parts
      report a serial.
    confirmed: true
    ambiguity:
      basis: vendor_chip_default
      evidence: >-
        esptool calls 0x1001 USB_JTAG_SERIAL_PID, a constant of the
        ESP32-S3/C3 USB-serial-JTAG peripheral. CONFIRMED BY CAPTURE rather
        than inferred: the Clip-Boy presents the identical pair AND the
        identical product string, and the two are unrelated products. Only the
        serial differs, and a serial is per-unit.
      also_used_by:
        - clip-boy
        - every ESP32-S3 or ESP32-C3 board using native USB

# NO SYMLINK. Not because nothing here is distinguishable -- 093c:2059 is
# Free-WiLi's own identifier and would be safe -- but because the device
# presents four CDC ports on that one interface and this project does not know
# which is which. A symlink naming an arbitrary one of the four would be worse
# than none. /dev/serial/by-id/ already distinguishes them by interface number.
# See the identification gap below.

maintainer_verified:
  date: 2026-08-26
  by: ChiefGyk3D
  distro: Pop!_OS 22.04
  what_was_tested: >-
    Attached and enumerated. All six USB devices captured with
    scripts/identify-device.sh, including vendor and product strings and
    serials. Nothing was run against the hardware and no firmware was flashed.

identification_gap: >-
  Narrowed to one thing. Every identifier is confirmed against hardware, but the
  main interface (093c:2059) presents four CDC ACM ports and which port carries
  which function is not documented here. Naming one of them /dev/free-wili would
  be a coin toss. Upstream documentation or a functional test would settle it;
  /dev/serial/by-id/ distinguishes them by interface number in the meantime.
gap_closure: maintainer_hardware

groups: [dialout, plugdev]
packages: [dfu-util, esptool]

documentation:
  what_it_is: >-
    A multi-function hardware-hacking tool that presents as an internal USB hub
    carrying six devices: a main interface with four serial ports, a secondary
    interface, a mass-storage interface, an FTDI FT232H bridge, an RP2040
    CMSIS-DAP debug probe, and an ESP32-S3.
  what_you_can_do_with_it: >-
    Drive several hardware interfaces from one board — serial, SPI/I2C through
    the FT232H, SWD debugging through the CMSIS-DAP probe, and whatever the
    ESP32-S3 is running. Per D-026 this catalog installs the tooling to talk to
    it, not the capability of the firmware it runs.
  setup_steps: >-
    Join `dialout` and `plugdev`, then log out and back in — group membership
    does not apply to a session already open. Attach it and expect SIX entries
    in `lsusb`, not one; that is correct and not a fault. The four ACM ports
    appear as /dev/ttyACM0 through ACM3 in plug order, so use
    /dev/serial/by-id/ rather than a raw device path.
  known_problems: >-
    Plug order determines which /dev/ttyACM number each port gets, and there are
    four of them on one device plus more from the debug probe — this is exactly
    the case /dev/serial/by-id/ exists for. Two of the six identifiers are
    shared silicon rather than this product: the FT232H is distinguishable only
    by its product string, and the ESP32-S3's 303a:1001 is byte-identical to the
    Clip-Boy's, product string included, so nothing but the serial separates
    them. Any udev rule for this board must match on product, never on VID:PID
    alone.
  upstream_url: https://freewili.com/
