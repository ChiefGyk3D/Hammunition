kind: device
name: librevna
summary: LibreVNA — open-hardware two-port vector network analyser, 100 kHz to 6 GHz, over USB
vendor: LibreVNA project (open hardware)
status: untested

# Not owned by the maintainer (D-027): nothing here has been run against the
# hardware. The identifiers are read from upstream's source at tag v1.6.5,
# measured 2026-10-01, and none appears in any distribution's udev rules,
# because no target's archive packages LibreVNA.
gap_closure: unverified_by_maintainer
identification_gap: >-
  The three identifiers this entry carries are the ones upstream's GUI accepts as a
  LibreVNA (`librevnausbdriver.cpp` at v1.6.5) and the three its own udev
  rule names; which one a given unit presents, by hardware revision and
  firmware, has not been seen on a bench here. The maintainer does not own
  one, so closing this needs `lsusb` output from an owner. Upstream's
  LibreCAL calibration kit is a separate device (0483:4122, 1209:4122) and
  is not carried.
usb_ids:
  - vendor: "1209"
    product: "4121"
    description: LibreVNA
    evidence: >-
      Upstream source at tag v1.6.5:
      Software/PC_Application/LibreVNA-GUI/Device/LibreVNA/librevnausbdriver.cpp
      lists it as a valid LibreVNA identifier, and upstream's own udev rule
      beside the GUI source grants it. pid.codes allocates 1209:4121 to
      LibreVNA (its registry entry names the project and the repository).
      Unconfirmed here: not captured from hardware.
    confirmed: false
    node_kind: libusb
  - vendor: "0483"
    product: "4121"
    description: LibreVNA, on STMicroelectronics' vendor identifier
    evidence: >-
      Upstream source at tag v1.6.5, librevnausbdriver.cpp, and upstream's
      own udev rule. Vendor 0483 is STMicroelectronics; usb.ids names no
      product 4121 under it, and no archive rule names the pair, so there is
      no evidence here of another product presenting it. Unconfirmed here:
      not captured from hardware.
    confirmed: false
    node_kind: libusb
  - vendor: "0483"
    product: "564e"
    description: LibreVNA, the original identifier
    evidence: >-
      Upstream source at tag v1.6.5, first in librevnausbdriver.cpp's list of
      valid identifiers, and upstream's own udev rule. Vendor 0483 is
      STMicroelectronics; usb.ids names no product 564e under it, and no
      archive rule names the pair. Unconfirmed here: not captured from
      hardware.
    confirmed: false
    node_kind: libusb
groups: [plugdev]
packages: [librevna]
documentation:
  what_it_is: >-
    An open-hardware vector network analyser: two ports, 100 kHz to 6 GHz,
    measuring reflection and transmission (S11, S21, S12, S22) for antennas,
    filters, amplifiers and cables. It also works as a spectrum analyser and
    a signal generator. Hardware, firmware and the PC program are all
    published under open licences by the project.
  what_you_can_do_with_it: >-
    Tune and check an antenna across a band, measure a filter's passband or
    a cable's loss and length, and see where an amplifier is matched -- the
    work `nanovna-saver` does for a NanoVNA, for this instrument. Everything
    goes through the `librevna` program, which has a firmware-update dialog
    (`firmwareupdatedialog.cpp`); the device has no screen of its own.
  setup_steps: >-
    Install `librevna`. The device is opened through libusb, so the account
    needs access to the raw USB device: upstream's README installs its own
    udev rule, which sets MODE 0666 (every user on the machine). This entry
    asks for `plugdev` instead, and because its identifiers are unconfirmed
    no rule is generated from it yet: until one is, the program finds the
    device only when run with access to it. Calibrate before every
    measurement session, with a calibration kit at the end of the cable you
    will measure through.
  known_problems: >-
    Upstream's own udev rule makes the matching USB devices writable by
    every account on the machine (MODE 0666, no group). That rule is not
    installed by this project. The GUI can also update the device's
    firmware; that writes to the device, and nothing here has done it.
    Unmeasured here: the device itself, on any target.
  upstream_url: https://github.com/jankae/LibreVNA
