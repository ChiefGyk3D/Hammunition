kind: device
name: clip-boy
summary: Open-source DEF CON badge — ESP32-S3 with an LVGL touch UI
vendor: SafeHazard
device_class: badgelife
status: supported

# Captured against real hardware 2026-08-26. The guess in the previous version
# was right -- it is ESP32-S3 native USB -- and the capture turned that into the
# clearest demonstration of D-028 in the catalog.
#
# Clip-Boy presents 303a:1001 with product string "USB JTAG/serial debug unit".
# So does the Minino, and so does the ESP32-S3 inside the Free-WiLi 2. Same
# vendor, same product, same product STRING. THREE unrelated products,
# indistinguishable by anything a catalog-wide udev rule can match on. Only the per-unit serial differs, and a
# serial belongs to one board on one desk, not in a shipped manifest.
#
# The honest consequence is that this device gets NO device-specific symlink,
# ever, from us. /dev/serial/by-id/ already separates the two by serial, which
# is the right answer and one systemd made years ago.

usb_ids:
  - vendor: "303a"
    product: "1001"
    description: Espressif ESP32-S3 native USB JTAG/serial peripheral
    evidence: >-
      lsusb against real hardware 2026-08-26 on Pop!_OS 22.04, via
      scripts/identify-device.sh. manufacturer=Espressif product="USB
      JTAG/serial debug unit" serial=28:37:2F:88:DC:40, presenting
      /dev/ttyACM0.
    confirmed: true
    node_kind: serial
    product_string: USB JTAG/serial debug unit
    reports_serial: true
    ambiguity:
      basis: vendor_chip_default
      evidence: >-
        esptool calls 0x1001 USB_JTAG_SERIAL_PID, a constant of the ESP32-S3/C3
        USB-serial-JTAG peripheral. Confirmed by capture, not inferred: the
        Minino and the Free-WiLi 2's onboard ESP32-S3 present the identical
        pair AND the identical product string, all three captured on the same
        day on the same machine. Nothing short of the serial distinguishes them.
      also_used_by:
        - free-wili-2
        - minino
        - every ESP32-S3 or ESP32-C3 board using native USB

maintainer_verified:
  date: 2026-08-26
  by: ChiefGyk3D
  distro: Pop!_OS 22.04
  what_was_tested: >-
    Attached and enumerated; identifier, product string and serial captured with
    scripts/identify-device.sh. Nothing was run and no firmware was flashed.

firmware:
  - kind: esptool
    packages: [esptool, arduino-cli]
    note: >-
      Firmware is an Arduino sketch in the upstream repository, so the Linux path
      is arduino-cli to build and esptool to flash. Upstream also offers a web
      flasher, but that is ESP Web Tools over WebSerial — a browser path, not a
      toolchain path. Building locally is what lets you modify the badge, which
      is the point of it being open source.

documentation:
  what_it_is: >-
    An open-source DEF CON badge built around an ESP32-S3 with a touch display
    driven by LVGL. Licensed GPL-3.0, with the hardware design files — BOM,
    Gerbers, enclosure and OmniTag — published alongside the firmware.
  what_you_can_do_with_it: >-
    Read its serial output, build and flash modified firmware, and use it as a
    worked example of the badgelife class: everything here is class behaviour
    with a name attached.
  setup_steps: >-
    Follow the badgelife class setup. Clone the upstream repository, build the
    sketch with arduino-cli against the ESP32-S3 board definition, and flash with
    esptool over the badge's serial port.
  known_problems: >-
    The published flashing route is a web flasher using ESP Web Tools over
    WebSerial, which needs a Chromium-based browser and does not work in Firefox
    or on a machine without a graphical session. That gap is the reason this
    entry exists.
  upstream_url: https://github.com/SafeHazard/Clip-Boy
