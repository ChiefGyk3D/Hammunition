kind: device
name: usrp
summary: Ettus USRP — the research-grade SDR family, B200/B210 and older USB models
vendor: Ettus Research / National Instruments
status: supported

# Not owned by the maintainer, and `status: supported` anyway -- which is worth
# explaining, because it looks like the D-018 violation it is not. The claim
# being made is that these identifiers are correct and the udev rules generated
# from them will match, and the evidence for that is Debian's own uhd-host rule,
# a primary source. What is NOT claimed is that anyone here has run one.
#
# That distinction is the whole reason `gap_closure` and `status` are separate
# fields. A device can have a perfectly known USB identity and no operational
# testing behind it. Conflating the two would mean either overclaiming or
# throwing away good evidence, and neither is honest.

usb_ids:
