packages: [uhd-host, gqrx-sdr]

documentation:
  what_it_is: >-
    Ettus Research's Universal Software Radio Peripheral family. The B200 and
    B210 are the USB members and the ones most people meet; the entries here
    also cover the older USRP1 and B100, and the National-Instruments-branded
    B2xx boards, which enumerate under a different vendor id.
  what_you_can_do_with_it: >-
    Full-duplex transmit and receive with calibration and clock discipline good
    enough for research work, driven through UHD directly or through GNU Radio
    and SoapySDR.
  setup_steps: >-
    Install uhd-host and join `plugdev`, then log out and back in. The FPGA
    images are large and Debian's package does not ship them all —
    `uhd_images_downloader` fetches what your board needs, over the network, on
    first use. `uhd_find_devices` should then list the board.
  known_problems: >-
    The firmware download on first use surprises people, especially on a field
    machine with no connectivity — fetch the images before you leave. USB 3.0 is
    effectively required for the B210's full sample rate, and a marginal cable
    or hub shows up as dropped samples rather than as an error. The NI-branded
    boards are the same hardware under a different vendor id, which is why both
    appear above.
  upstream_url: https://kb.ettus.com/
