# The identifier list is Debian's, in full. This entry previously carried three
# pairs -- the two Realtek ones everybody knows plus a variant -- and Debian's
# own librtlsdr0 rule carries 42. The missing 39 are not exotic: they are the
# rebadged DVB-T sticks from Hauppauge, Compro, Terratec, Dexatek, Gigabyte and
# a dozen others that people actually own, all RTL2832U underneath.
#
# That gap is the shape of a udev rule that silently never matches. Somebody
# with a Hauppauge stick would have had a working device and no /dev symlink,
# with nothing to tell them why. Transcribed from the rule rather than typed
# from memory; every entry cites it.
kind: device
name: rtl-sdr
summary: RTL2832U DVB-T dongle repurposed as a wideband receive-only SDR
vendor: various (Realtek RTL2832U reference design)
status: supported

